e unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so.\nGM_EU_376_2014_SEC_2_2__C0014 [GM 2.2]: The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew.\nGM_EU_376_2014_SEC_2_2__C0016 [GM 2.2]: These situations should be covered and described by organisations within their safety management system.", "ai_notes": "The original answer invented unspecified compliance consequences.", "n": 2, "va": 2, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "GM_EU_376_2014_SEC_2_2__C0001", "cit": "GM 2.2", "seq": 1, "text": "Whereas the reporting of any safety relevant occurrence should be encouraged, Regulation 376/2014 differentiates between occurrences that should always be reported, because they have been considered by the legislator as posing a significant risk for aviation safety, and those that may be reported if judged relevant by potential reporters (more information of the reportable occurrences is provided "}, {"id": "GM_EU_376_2014_SEC_2_2__C0002", "cit": "GM 2.2", "seq": 2, "text": "Furthermore, whereas any person involved in aviation activities should be encouraged to report any safety occurrence it considers relevant, Regulation 376/2014 differentiates between the persons who are always required to report defined occurrences, because they have been considered as front line operators by the legislator, and those that may report occurrences when they judge it relevant."}, {"id": "GM_EU_376_2014_SEC_2_2__C0003", "cit": "GM 2.2", "seq": 3, "text": "Key principle The obligation for designated persons to report certain occurrences does not prevent other persons from reporting occurrences under the normal operation of their organisation safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0004", "cit": "GM 2.2", "seq": 4, "text": "This section provides information on the persons who are required to report certain occurrences in accordance with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0005", "cit": "GM 2.2", "seq": 5, "text": "This Regulation provides for a list of designated persons that must report occurrences in the context of mandatory reporting schemes (Article 4(6)). This list covers a broad range of persons involved in aviation activities, employees as well as other persons."}, {"id": "GM_EU_376_2014_SEC_2_2__C0006", "cit": "GM 2.2", "seq": 6, "text": "Key principle The list of persons who are required to report certain occurrences covers employees of an organisation, as well as persons whose services are contracted or used by the organisation (Article 4(6))."}, {"id": "GM_EU_376_2014_SEC_2_2__C0007", "cit": "GM 2.2", "seq": 7, "text": "Example: Pilots employed by a European operator as well as self-employed pilots who are pilot-in-command of aircraft used by a European operator are covered under this obligation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0008", "cit": "GM 2.2", "seq": 8, "text": "These designated persons are under a legal obligation to report certain defined occurrences. Without these occurrence reports, the European Union and the organisations and competent authorities that are part of it cannot make the best decisions on safety priorities. In addition, the failure to comply with the reporting legal obligation might have consequences for those required to report (Article "}, {"id": "GM_EU_376_2014_SEC_2_2__C0009", "cit": "GM 2.2", "seq": 9, "text": "It is therefore important to clearly identify the persons that are under the obligation to report occurrences under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0010", "cit": "GM 2.2", "seq": 10, "text": "Furthermore, clarification is necessary to ensure that, where relevant, natural persons already subject to an obligation to report safety occurrences under other European rules (see also section 3.6) are the same than the ones covered under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0011", "cit": "GM 2.2", "seq": 11, "text": "Pilots"}, {"id": "GM_EU_376_2014_SEC_2_2__C0012", "cit": "GM 2.2", "seq": 12, "text": "Key principle Article 4(6)(a) covers both pilots in command operating in the context of commercial air transport as well as private pilots operating on an aircraft covered by the Regulation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0013", "cit": "GM 2.2", "seq": 13, "text": "In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so."}, {"id": "GM_EU_376_2014_SEC_2_2__C0014", "cit": "GM 2.2", "seq": 14, "text": "The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew."}, {"id": "GM_EU_376_2014_SEC_2_2__C0015", "cit": "GM 2.2", "seq": 15, "text": "Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager."}, {"id": "GM_EU_376_2014_SEC_2_2__C0016", "cit": "GM 2.2", "seq": 16, "text": "These situations should be covered and described by organisations within their safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0017", "cit": "GM 2.2", "seq": 17, "text": "Design / manufacturing / airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0018", "cit": "GM 2.2", "seq": 18, "text": "Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certi"}, {"id": "GM_EU_376_2014_SEC_2_2__C0019", "cit": "GM 2.2", "seq": 19, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition."}, {"id": "GM_EU_376_2014_SEC_2_2__C0020", "cit": "GM 2.2", "seq": 20, "text": "Example: A person working in a production organisation being responsible of the investigation, together with the Design Approval Holder (DAH), to confirm if identified deviations of the manufactured product from design data could lead to an unsafe condition of the final certified product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0021", "cit": "GM 2.2", "seq": 21, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions for the holder of a typecertificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair d"}, {"id": "GM_EU_376_2014_SEC_2_2__C0022", "cit": "GM 2.2", "seq": 22, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0023", "cit": "GM 2.2", "seq": 23, "text": "Example: A person working in a DAH having the responsibility to carry out the process to identify unsafe or potential unsafe conditions as per Part-21 requirements under Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0024", "cit": "GM 2.2", "seq": 24, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}];
const CHECK = ['question_clear_and_unambiguous','answer_fully_supported','citation_correct','gold_evidence_complete'];
const CHECK_LABEL = ['Question clear & unambiguous','Answer fully supported','Citation correct','Evidence complete'];
const state = {};   // qa_id -> record
let cur = 0;
let reviewer = '';

DATA.forEach(r=>{
  state[r.qa_id] = r.auto ? {
    decision:r.auto,
    checks:[r.agg_q1||'uncertain', r.agg_q2||'uncertain', r.agg_q3||'uncertain', r.agg_q4||'uncertain'],
    alt:'', cq:'', ca:'', cc:'', cp:'', cg:'', notes:'', fromPanel:true
  } : { decision:'', checks:['','','',''], alt:'', cq:'', ca:'', cc:'', cp:'', cg:'', notes:'', fromPanel:false };
});

function validate(r){
  const s = state[r.qa_id];
  if(!s.decision) return [false,'No decision selected'];
  if(s.checks.some(c=>!c)) return [false,'All four validity checks must be set'];
  if(s.decision==='accept'){
    if(s.checks.some(c=>c!=='yes')) return [false,'“accept” requires all four checks = yes'];
    if(s.alt.trim()) return [false,'Alternatives supplied — use accept_with_alternative_evidence'];
  }
  if(s.decision==='accept_with_alternative_evidence'){
    if(!s.alt.trim()) return [false,'At least one alternative child ID is required'];
    if(s.checks.slice(0,3).some(c=>c!=='yes')) return [false,'First three checks must be yes for this decision'];
  }
  if(s.decision==='correct' && !(s.cq||s.ca||s.cc||s.cp||s.cg).trim())
    return [false,'“correct” requires at least one corrected field'];
  return [true,'Valid — will pass the freeze contract'];
}
const isDone = r => validate(r)[0];

function renderNav(){
  const done = DATA.filter(isDone).length;
  document.getElementById('pb').style.width = (done/DATA.length*100)+'%';
  document.getElementById('cnt').textContent = done+' / '+DATA.length+' valid';
  document.getElementById('nav').innerHTML = DATA.map((r,i)=>{
    const s=state[r.qa_id]; const ok=isDone(r);
    const cls = ok ? (s.fromPanel&&!s.notes?'d-panel':'d-done') : (s.decision?'d-err':'d-todo');
    return `<div class="it ${i===cur?'sel':''}" onclick="go(${i})">
      <span class="dot ${cls}"></span>
      <span class="id">${r.qa_id}</span>
      <span class="sub">${r.auto?'panel':'<b>you</b>'} · ${r.cls}</span></div>`;
  }).join('');
}
function go(i){ cur=i; render(); }

function render(){
  const r=DATA[cur], s=state[r.qa_id];
  const [ok,msg]=validate(r);
  document.getElementById('main').innerHTML = `
    <h2>${r.qa_id}</h2>
    <div class="meta">
      <span class="tag">${r.cls}</span><span class="tag">${r.qtype}</span>
      <span class="tag">${r.diff}</span><span class="tag">${r.split}</span>
      <span class="tag">${r.reason}</span>
    </div>
    <div class="box"><h3>Question</h3><div>${esc(r.question)}</div></div>
    <div class="box"><h3>Proposed answer</h3><div>${esc(r.answer)}</div></div>
    <div class="box"><h3>Proposed citation</h3><div><b>${esc(r.citation||'(none)')}</b>
      <div class="hint">parent ${esc(r.parent_id)} · gold children: ${r.gold.map(esc).join(', ')||'(none)'}</div></div></div>
    <div class="box"><h3>Evidence supplied to reviewers</h3><div class="ev">${esc(r.evidence||'(none)')}</div></div>
    <div class="box"><h3>AI audit note</h3><div style="color:var(--gray)">${esc(r.ai_notes||'—')}</div></div>

    <div class="valid ${ok?'v-ok':'v-bad'}">${ok?'✓ ':'✗ '}${msg}</div>

    <label>Decision</label>
    <select onchange="set('decision',this.value)">
      <option value="">— choose —</option>
      ${['accept','accept_with_alternative_evidence','correct','exclude']
        .map(d=>`<option value="${d}" ${s.decision===d?'selected':''}>${d}</option>`).join('')}
    </select>
    <div class="hint">accept = all four checks yes · correct = supply at least one corrected field ·
      accept_with_alternative_evidence = first three yes + alternative IDs</div>

    <label>Validity checks</label>
    <div class="checks">${CHECK.map((c,i)=>`<div>
      <div style="font-size:11.5px;color:var(--gray);margin-bottom:3px">${CHECK_LABEL[i]}</div>
      <select onchange="setChk(${i},this.value)">
        <option value="">—</option>
        ${['yes','no','uncertain'].map(v=>`<option value="${v}" ${s.checks[i]===v?'selected':''}>${v}</option>`).join('')}
      </select></div>`).join('')}</div>

    <label>Alternative acceptable child IDs <span style="font-weight:400;color:var(--gray)">(semicolon separated — click siblings on the right)</span></label>
    <input type="text" value="${esc(s.alt)}" oninput="set('alt',this.value)" placeholder="EU_376_2014_ART_4__C0003;...">

    <label>Corrected fields <span style="font-weight:400;color:var(--gray)">(only for “correct”)</span></label>
    <textarea placeholder="corrected question" oninput="set('cq',this.value)">${esc(s.cq)}</textarea>
    <textarea placeholder="corrected reference answer" oninput="set('ca',this.value)">${esc(s.ca)}</textarea>
    <input type="text" placeholder="corrected citation" value="${esc(s.cc)}" oninput="set('cc',this.value)" style="margin-top:8px">
    <input type="text" placeholder="corrected parent id" value="${esc(s.cp)}" oninput="set('cp',this.value)" style="margin-top:8px">
    <input type="text" placeholder="corrected gold child ids (semicolon separated)" value="${esc(s.cg)}" oninput="set('cg',this.value)" style="margin-top:8px">

    <label>Your justification <span style="font-weight:400;color:var(--gray)">(recorded in review_notes — write one line, D024 requires it)</span></label>
    <textarea oninput="set('notes',this.value)">${esc(s.notes)}</textarea>

    <div style="margin:18px 0 40px;display:flex;gap:9px">
      <button class="btn btn-s" style="border:1px solid var(--line)" onclick="go(${Math.max(0,cur-1)})">← Previous</button>
      <button class="btn btn-g" onclick="go(${Math.min(DATA.length-1,cur+1)})">Next →</button>
    </div>`;

  const tot=r.n||0;
  document.getElementById('side').innerHTML = `
    <div class="box"><h3>Panel</h3>
      ${tot? `<div style="font-size:12px;color:var(--gray)">${tot} reviewer${tot>1?'s':''} ·
        ${r.contested==='yes'?'<span class="pill p-bad">contested</span>':'<span class="pill p-ok">agreed</span>'}</div>
      <div class="vote">
        <span class="p-ok">accept ${r.va}</span>
        <span class="p-warn">correct ${r.vc}</span>
        <span class="p-bad">exclude ${r.ve}</span></div>
      <div style="font-size:11.5px;color:var(--gray)">majority checks: ${r.agg_q1||'—'} / ${r.agg_q2||'—'} / ${r.agg_q3||'—'} / ${r.agg_q4||'—'}</div>
      ${r.action?`<div class="hint" style="margin-top:7px"><b>${esc(r.action)}</b></div>`:''}`
      : '<div style="font-size:12px;color:var(--gray)">No reviewer rated this record.</div>'}
    </div>
    ${r.comments?`<div class="box"><h3>Reviewer comments</h3>
      ${r.comments.split('||').map(c=>`<div class="cmt">${esc(c.trim())}</div>`).join('')}</div>`:''}
    <div class="box"><h3>Children of ${esc(r.parent_id)}</h3>
      <div class="hint" style="margin-bottom:8px">Click to add/remove from the alternative-IDs box.</div>
      ${r.siblings.map(c=>{
        const on=(state[r.qa_id].alt||'').split(';').map(x=>x.trim()).includes(c.id);
        const gold=r.gold.includes(c.id);
        return `<div class="sib ${on?'on':''}" onclick="tog('${c.id}')">
          <code>${esc(c.cit)}</code> ${gold?'<span class="pill p-ok" style="font-size:10px">gold</span>':''}
          <p>${esc(c.text)}</p></div>`;}).join('')}
    </div>`;
  renderNav();
}
function esc(t){return (t==null?'':String(t)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function set(k,v){ state[DATA[cur].qa_id][k]=v; const [ok,msg]=validate(DATA[cur]);
  const el=document.querySelector('.valid'); el.className='valid '+(ok?'v-ok':'v-bad'); el.textContent=(ok?'✓ ':'✗ ')+msg; renderNav(); }
function setChk(i,v){ state[DATA[cur].qa_id].checks[i]=v; set('checks',state[DATA[cur].qa_id].checks); }
function tog(id){ const s=state[DATA[cur].qa_id];
  let a=(s.alt||'').split(';').map(x=>x.trim()).filter(Boolean);
  a = a.includes(id) ? a.filter(x=>x!==id) : a.concat([id]);
  s.alt=a.join(';'); render(); }

function saveProg(){
  const blob=new Blob([JSON.stringify({reviewer,state},null,1)],{type:'application/json'});
  dl(blob,'adjudication_progress.json');
}
document.getElementById('lp').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return; const fr=new FileReader();
  fr.onload=()=>{ const o=JSON.parse(fr.result); reviewer=o.reviewer||'';
    Object.assign(state,o.state); render(); alert('Progress loaded.'); };
  fr.readAsText(f);
});

const COLS = ['qa_id','review_reason','split','source_class','audit_decision','question_type','difficulty',
 'question','reference_answer','acceptable_citation','parent_id','gold_child_ids','gold_evidence_text',
 'ai_audit_notes','reviewer_decision','question_clear_and_unambiguous','answer_fully_supported',
 'citation_correct','gold_evidence_complete','alternative_acceptable_child_ids','alternative_evidence_sets_json',
 'corrected_question','corrected_reference_answer','corrected_citation','corrected_parent_id',
 'corrected_gold_child_ids','corrected_evidence_sets_json','review_notes','reviewer_name_or_role','review_date'];

function exportCsv(){
  const bad=DATA.filter(r=>!isDone(r));
  if(bad.length && !confirm(bad.length+' record(s) are still invalid and will export blank:\n'+
     bad.map(r=>r.qa_id).join(', ')+'\n\nExport anyway?')) return;
  if(!reviewer){ reviewer=prompt('Your name or role (goes in reviewer_name_or_role):','')||''; }
  const today=new Date().toISOString().slice(0,10);
  const rows=[COLS];
  DATA.slice().sort((a,b)=>a.qa_id.localeCompare(b.qa_id)).forEach(r=>{
    const s=state[r.qa_id]; const ok=isDone(r);
    const alt=s.alt.split(';').map(x=>x.trim()).filter(Boolean);
    rows.push([r.qa_id,r.reason,r.split,r.cls,r.audit,r.qtype,r.diff,r.question,r.answer,
      r.citation,r.parent_id,r.gold.join(';'),r.evidence,r.ai_notes,
      ok?s.decision:'', ok?s.checks[0]:'', ok?s.checks[1]:'', ok?s.checks[2]:'', ok?s.checks[3]:'',
      alt.join(';'), alt.length?JSON.stringify([alt]):'',
      s.cq,s.ca,s.cc,s.cp,s.cg,'',
      (s.fromPanel && !s.notes ? 'panel-cleared: accept '+r.va+' / correct '+r.vc+' / exclude '+r.ve : s.notes),
      ok?(s.fromPanel && !s.notes ? 'panel('+r.n+')' : reviewer):'',
      ok?today:'']);
  });
  const csv=rows.map(r=>r.map(v=>{
    v=(v==null?'':String(v));
    return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  dl(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),'review_queue.csv');
}
function dl(blob,name){ const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

window.addEventListener('beforeunload',e=>{ if(DATA.some(r=>state[r.qa_id].decision && !state[r.qa_id].fromPanel)){
  e.preventDefault(); e.returnValue=''; }});
render();
</script></body></html>
