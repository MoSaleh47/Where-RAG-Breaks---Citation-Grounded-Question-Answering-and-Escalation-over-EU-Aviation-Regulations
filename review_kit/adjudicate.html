in this Article."}, {"id": "EU_376_2014_ART_18__C0002", "cit": "Article 18(2)", "seq": 2, "text": "2.The power to adopt delegated acts referred to in Article 7(6) and Article 17 shall be conferred on the Commission for a period of five years from the entry into force of this Regulation. The Commission shall draw up a report in respect of the delegation of power not later than nine months before the end of the five year period. The delegation of power shall be tacitly extended for periods of an "}, {"id": "EU_376_2014_ART_18__C0003", "cit": "Article 18(3)", "seq": 3, "text": "3.The delegation of power referred to in Article 7(6) and Article 17 may be revoked at any time by the European Parliament or by the Council. A decision to revoke shall put an end to the delegation of the power specified in that decision. It shall take effect the day following the publication of the decision in the Official Journal of the European Union or at a later date specified therein. It sha"}, {"id": "EU_376_2014_ART_18__C0004", "cit": "Article 18(4)", "seq": 4, "text": "4.As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European Parliament and to the Council."}, {"id": "EU_376_2014_ART_18__C0005", "cit": "Article 18(5)", "seq": 5, "text": "5.A delegated act adopted pursuant to Article 7(6) and Article 17 shall enter into force only if no objection has been expressed either by the European Parliament or the Council within a period of two months of notification of that act to the European Parliament and the Council or if, before the expiry of that period, the European Parliament and the Council have both informed the Commission that t"}]}, {"qa_id": "QA_0080", "reason": "exception_record;hybrid_k20_residual", "cls": "ANNEX", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "Does the activity category under which an occurrence is listed limit whether it must be reported?", "answer": "No. The Annex groups occurrences under activities where they are normally observed, but an occurrence must still be reported when it takes place outside the category under which it is listed.", "citation": "Annex I, Remark", "parent_id": "EU_2015_1018_ANNEX_I", "gold": ["EU_2015_1018_ANNEX_I__C0001"], "evidence": "EU_2015_1018_ANNEX_I__C0001 [Annex I]: Remark: This Annex is structured in such a way that the pertinent occurrences are linked with categories of activities during which they are normally observed, according to experience, in order to facilitate the reporting of those occurrences. However, this presentation must not be understood as meaning that occurrences must not be reported in case they take place outside the category of activities to which they are linked in the list.", "ai_notes": "The original answer added an unrelated endangerment formulation taken from individual occurrence examples.", "n": 3, "va": 2, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R2: on parle d'occurence category et d'activity category à ma connaissance.", "siblings": [{"id": "EU_2015_1018_ANNEX_I__C0001", "cit": "Annex I", "seq": 1, "text": "Remark: This Annex is structured in such a way that the pertinent occurrences are linked with categories of activities during which they are normally observed, according to experience, in order to facilitate the reporting of those occurrences. However, this presentation must not be understood as meaning that occurrences must not be reported in case they take place outside the category of activitie"}, {"id": "EU_2015_1018_ANNEX_I__C0002", "cit": "Annex I, item 1", "seq": 2, "text": "1.AIR OPERATIONS"}, {"id": "EU_2015_1018_ANNEX_I__C0003", "cit": "Annex I, item 1.1", "seq": 3, "text": "1.1.Flight preparation"}, {"id": "EU_2015_1018_ANNEX_I__C0004", "cit": "Annex I, item 1.1.1", "seq": 4, "text": "(1)Use of incorrect data or erroneous entries into equipment used for navigation or performance calculations which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0005", "cit": "Annex I, item 1.1.2", "seq": 5, "text": "(2)Carriage or attempted carriage of dangerous goods in contravention of applicable legislations including incorrect labelling, packaging and handling of dangerous goods."}, {"id": "EU_2015_1018_ANNEX_I__C0006", "cit": "Annex I, item 1.2", "seq": 6, "text": "1.2.Aircraft preparation"}, {"id": "EU_2015_1018_ANNEX_I__C0007", "cit": "Annex I, item 1.2.1", "seq": 7, "text": "(1)Incorrect fuel type or contaminated fuel."}, {"id": "EU_2015_1018_ANNEX_I__C0008", "cit": "Annex I, item 1.2.2", "seq": 8, "text": "(2)Missing, incorrect or inadequate De-icing/Anti-icing treatment."}, {"id": "EU_2015_1018_ANNEX_I__C0009", "cit": "Annex I, item 1.3", "seq": 9, "text": "1.3.Take-off and landing"}, {"id": "EU_2015_1018_ANNEX_I__C0010", "cit": "Annex I, item 1.3.1", "seq": 10, "text": "(1)Taxiway or runway excursion."}, {"id": "EU_2015_1018_ANNEX_I__C0011", "cit": "Annex I, item 1.3.2", "seq": 11, "text": "(2)Actual or potential taxiway or runway incursion."}, {"id": "EU_2015_1018_ANNEX_I__C0012", "cit": "Annex I, item 1.3.3", "seq": 12, "text": "(3)Final Approach and Take-off Area (FATO) incursion."}, {"id": "EU_2015_1018_ANNEX_I__C0013", "cit": "Annex I, item 1.3.4", "seq": 13, "text": "(4)Any rejected take-off."}, {"id": "EU_2015_1018_ANNEX_I__C0014", "cit": "Annex I, item 1.3.5", "seq": 14, "text": "(5)Inability to achieve required or expected performance during take-off, go-around or landing."}, {"id": "EU_2015_1018_ANNEX_I__C0015", "cit": "Annex I, item 1.3.6", "seq": 15, "text": "(6)Actual or attempted take-off, approach or landing with incorrect configuration setting."}, {"id": "EU_2015_1018_ANNEX_I__C0016", "cit": "Annex I, item 1.3.7", "seq": 16, "text": "(7)Tail, blade/wingtip or nacelle strike during take-off or landing."}, {"id": "EU_2015_1018_ANNEX_I__C0017", "cit": "Annex I, item 1.3.8", "seq": 17, "text": "(8)Approach continued against air operator stabilised approach criteria."}, {"id": "EU_2015_1018_ANNEX_I__C0018", "cit": "Annex I, item 1.3.9", "seq": 18, "text": "(9)Continuation of an instrument approach below published minimums with inadequate visual references."}, {"id": "EU_2015_1018_ANNEX_I__C0019", "cit": "Annex I, item 1.3.10", "seq": 19, "text": "(10)Precautionary or forced landing."}, {"id": "EU_2015_1018_ANNEX_I__C0020", "cit": "Annex I, item 1.3.11", "seq": 20, "text": "(11)Short and long landing."}, {"id": "EU_2015_1018_ANNEX_I__C0021", "cit": "Annex I, item 1.3.12", "seq": 21, "text": "(12)Hard landing."}, {"id": "EU_2015_1018_ANNEX_I__C0022", "cit": "Annex I, item 1.4", "seq": 22, "text": "1.4.Any phase of flight"}, {"id": "EU_2015_1018_ANNEX_I__C0023", "cit": "Annex I, item 1.4.1", "seq": 23, "text": "(1)Loss of control."}, {"id": "EU_2015_1018_ANNEX_I__C0024", "cit": "Annex I, item 1.4.2", "seq": 24, "text": "(2)Aircraft upset, exceeding normal pitch attitude, bank angle or airspeed inappropriate for the conditions."}, {"id": "EU_2015_1018_ANNEX_I__C0025", "cit": "Annex I, item 1.4.3", "seq": 25, "text": "(3)Level bust."}, {"id": "EU_2015_1018_ANNEX_I__C0026", "cit": "Annex I, item 1.4.4", "seq": 26, "text": "(4)Activation of any flight envelope protection, including stall warning, stick shaker, stick pusher and automatic protections."}, {"id": "EU_2015_1018_ANNEX_I__C0027", "cit": "Annex I, item 1.4.5", "seq": 27, "text": "(5)Unintentional deviation from intended or assigned track of the lowest of twice the required navigation performance or 10 nautical miles."}, {"id": "EU_2015_1018_ANNEX_I__C0028", "cit": "Annex I, item 1.4.6", "seq": 28, "text": "(6)Exceedance of aircraft flight manual limitation."}, {"id": "EU_2015_1018_ANNEX_I__C0029", "cit": "Annex I, item 1.4.7", "seq": 29, "text": "(7)Operation with incorrect altimeter setting."}, {"id": "EU_2015_1018_ANNEX_I__C0030", "cit": "Annex I, item 1.4.8", "seq": 30, "text": "(8)Jet blast or rotor and prop wash occurrences which have or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0031", "cit": "Annex I, item 1.4.9", "seq": 31, "text": "(9)Misinterpretation of automation mode or of any flight deck information provided to the flight crew which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0032", "cit": "Annex I, item 1.5", "seq": 32, "text": "1.5.Other types of occurrences"}, {"id": "EU_2015_1018_ANNEX_I__C0033", "cit": "Annex I, item 1.5.1", "seq": 33, "text": "(1)Unintentional release of cargo or other externally carried equipment."}, {"id": "EU_2015_1018_ANNEX_I__C0034", "cit": "Annex I, item 1.5.2", "seq": 34, "text": "(2)Loss of situational awareness (including environmental, mode and system awareness, spatial disorientation, and time horizon)."}, {"id": "EU_2015_1018_ANNEX_I__C0035", "cit": "Annex I, item 1.5.3", "seq": 35, "text": "(3)Any occurrence where the human performance has directly contributed to or could have contributed to an accident or a serious incident."}, {"id": "EU_2015_1018_ANNEX_I__C0036", "cit": "Annex I, item 2", "seq": 36, "text": "2.TECHNICAL OCCURRENCES"}, {"id": "EU_2015_1018_ANNEX_I__C0037", "cit": "Annex I, item 2.1", "seq": 37, "text": "2.1.Structure and systems"}, {"id": "EU_2015_1018_ANNEX_I__C0038", "cit": "Annex I, item 2.1.1", "seq": 38, "text": "(1)Loss of any part of the aircraft structure in flight."}, {"id": "EU_2015_1018_ANNEX_I__C0039", "cit": "Annex I, item 2.1.2", "seq": 39, "text": "(2)Loss of a system."}, {"id": "EU_2015_1018_ANNEX_I__C0040", "cit": "Annex I, item 2.1.3", "seq": 40, "text": "(3)Loss of redundancy of a system."}, {"id": "EU_2015_1018_ANNEX_I__C0041", "cit": "Annex I, item 2.1.4", "seq": 41, "text": "(4)Leakage of any fluid which resulted in a fire hazard or possible hazardous contamination of aircraft structure, systems or equipment, or which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0042", "cit": "Annex I, item 2.1.5", "seq": 42, "text": "(5)Fuel system malfunctions or defects, which had an effect on fuel supply and/or distribution."}, {"id": "EU_2015_1018_ANNEX_I__C0043", "cit": "Annex I, item 2.1.6", "seq": 43, "text": "(6)Malfunction or defect of any indication system when this results in misleading indications to the crew."}, {"id": "EU_2015_1018_ANNEX_I__C0044", "cit": "Annex I, item 2.1.7", "seq": 44, "text": "(7)Abnormal functioning of flight controls such as asymmetric or stuck/jammed flight controls (for example: lift (flaps/slats), drag (spoilers), attitude control (ailerons, elevators, rudder) devices)."}, {"id": "EU_2015_1018_ANNEX_I__C0045", "cit": "Annex I, item 2.2", "seq": 45, "text": "2.2.Propulsion (including engines, propellers and rotor systems) and auxiliary power units (APUs)"}, {"id": "EU_2015_1018_ANNEX_I__C0046", "cit": "Annex I, item 2.2.1", "seq": 46, "text": "(1)Failure or significant malfunction of any part or controlling of a propeller, rotor or powerplant."}, {"id": "EU_2015_1018_ANNEX_I__C0047", "cit": "Annex I, item 2.2.2", "seq": 47, "text": "(2)Damage to or failure of main/tail rotor or transmission and/or equivalent systems."}, {"id": "EU_2015_1018_ANNEX_I__C0048", "cit": "Annex I, item 2.2.3", "seq": 48, "text": "(3)Flameout, in-flight shutdown of any engine or APU when required (for example: ETOPS (Extended range Twin engine aircraft Operations), MEL (Minimum Equipment List))."}, {"id": "EU_2015_1018_ANNEX_I__C0049", "cit": "Annex I, item 2.2.4", "seq": 49, "text": "(4)Engine operating limitation exceedance, including overspeed or inability to control the speed of any high-speed rotating component (for example: APU, air starter, air cycle machine, air turbine motor, propeller or rotor)."}, {"id": "EU_2015_1018_ANNEX_I__C0050", "cit": "Annex I, item 2.2.5", "seq": 50, "text": "(5)Failure or malfunction of any part of an engine, powerplant, APU or transmission resulting in any one or more of the following:"}, {"id": "EU_2015_1018_ANNEX_I__C0051", "cit": "Annex I, item 2.2.5.a", "seq": 51, "text": "(a)thrust-reversing system failing to operate as commanded;"}, {"id": "EU_2015_1018_ANNEX_I__C0052", "cit": "Annex I, item 2.2.5.a.b", "seq": 52, "text": "(b)inability to control power, thrust or rpm (revolutions per minute);"}, {"id": "EU_2015_1018_ANNEX_I__C0053", "cit": "Annex I, item 2.2.5.a.b.c", "seq": 53, "text": "(c)non-containment of components/debris."}, {"id": "EU_2015_1018_ANNEX_I__C0054", "cit": "Annex I, item 3", "seq": 54, "text": "3.INTERACTION WITH AIR NAVIGATION SERVICES (ANS) AND AIR TRAFFIC MANAGEMENT (ATM)"}, {"id": "EU_2015_1018_ANNEX_I__C0055", "cit": "Annex I, item 3.1", "seq": 55, "text": "(1)Unsafe ATC (Air Traffic Control) clearance."}, {"id": "EU_2015_1018_ANNEX_I__C0056", "cit": "Annex I, item 3.2", "seq": 56, "text": "(2)Prolonged loss of communication with ATS (Air Traffic Service) or ATM Unit."}, {"id": "EU_2015_1018_ANNEX_I__C0057", "cit": "Annex I, item 3.3", "seq": 57, "text": "(3)Conflicting instructions from different ATS Units potentially leading to a loss of separation."}, {"id": "EU_2015_1018_ANNEX_I__C0058", "cit": "Annex I, item 3.4", "seq": 58, "text": "(4)Misinterpretation of radio-communication which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0059", "cit": "Annex I, item 3.5", "seq": 59, "text": "(5)Intentional deviation from ATC instruction which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0060", "cit": "Annex I, item 4", "seq": 60, "text": "4.EMERGENCIES AND OTHER CRITICAL SITUATIONS"}, {"id": "EU_2015_1018_ANNEX_I__C0061", "cit": "Annex I, item 4.1", "seq": 61, "text": "(1)Any event leading to the declaration of an emergency (‘Mayday’ or ‘PAN call’)."}, {"id": "EU_2015_1018_ANNEX_I__C0062", "cit": "Annex I, item 4.2", "seq": 62, "text": "(2)Any burning, melting, smoke, fumes, arcing, overheating, fire or explosion."}, {"id": "EU_2015_1018_ANNEX_I__C0063", "cit": "Annex I, item 4.3", "seq": 63, "text": "(3)Contaminated air in the cockpit or in the passenger compartment which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0064", "cit": "Annex I, item 4.4", "seq": 64, "text": "(4)Failure to apply the correct non-normal or emergency procedure by the flight or cabin crew to deal with an emergency."}, {"id": "EU_2015_1018_ANNEX_I__C0065", "cit": "Annex I, item 4.5", "seq": 65, "text": "(5)Use of any emergency equipment or non-normal procedure affecting in-flight or landing performance."}, {"id": "EU_2015_1018_ANNEX_I__C0066", "cit": "Annex I, item 4.6", "seq": 66, "text": "(6)Failure of any emergency or rescue system or equipment which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0067", "cit": "Annex I, item 4.7", "seq": 67, "text": "(7)Uncontrollable cabin pressure."}, {"id": "EU_2015_1018_ANNEX_I__C0068", "cit": "Annex I, item 4.8", "seq": 68, "text": "(8)Critically low fuel quantity or fuel quantity at destination below required final reserve fuel."}, {"id": "EU_2015_1018_ANNEX_I__C0069", "cit": "Annex I, item 4.9", "seq": 69, "text": "(9)Any use of crew oxygen system by the crew."}, {"id": "EU_2015_1018_ANNEX_I__C0070", "cit": "Annex I, item 4.10", "seq": 70, "text": "(10)Incapacitation of any member of the flight or cabin crew that results in the reduction below the minimum certified crew complement."}, {"id": "EU_2015_1018_ANNEX_I__C0071", "cit": "Annex I, item 4.11", "seq": 71, "text": "(11)Crew fatigue impacting or potentially impacting their ability to perform safely their flight duties."}, {"id": "EU_2015_1018_ANNEX_I__C0072", "cit": "Annex I, item 5", "seq": 72, "text": "5.EXTERNAL ENVIRONMENT AND METEOROLOGY"}, {"id": "EU_2015_1018_ANNEX_I__C0073", "cit": "Annex I, item 5.1", "seq": 73, "text": "(1)A collision or a near collision on the ground or in the air, with another aircraft, terrain or obstacle ()."}, {"id": "EU_2015_1018_ANNEX_I__C0074", "cit": "Annex I, item 5.2", "seq": 74, "text": "(2)ACAS RA (Airborne Collision Avoidance System, Resolution Advisory)."}, {"id": "EU_2015_1018_ANNEX_I__C0075", "cit": "Annex I, item 5.3", "seq": 75, "text": "(3)Activation of genuine ground collision system such as GPWS (Ground Proximity Warning System)/TAWS (Terrain Awareness and Warning System) ‘warning’."}, {"id": "EU_2015_1018_ANNEX_I__C0076", "cit": "Annex I, item 5.4", "seq": 76, "text": "(4)Wildlife strike including bird strike."}, {"id": "EU_2015_1018_ANNEX_I__C0077", "cit": "Annex I, item 5.5", "seq": 77, "text": "(5)Foreign object damage/debris (FOD)."}, {"id": "EU_2015_1018_ANNEX_I__C0078", "cit": "Annex I, item 5.6", "seq": 78, "text": "(6)Unexpected encounter of poor runway surface conditions."}, {"id": "EU_2015_1018_ANNEX_I__C0079", "cit": "Annex I, item 5.7", "seq": 79, "text": "(7)Wake-turbulence encounters."}, {"id": "EU_2015_1018_ANNEX_I__C0080", "cit": "Annex I, item 5.8", "seq": 80, "text": "(8)Interference with the aircraft by firearms, fireworks, flying kites, laser illumination, high powered lights, lasers, Remotely Piloted Aircraft Systems, model aircraft or by similar means."}, {"id": "EU_2015_1018_ANNEX_I__C0081", "cit": "Annex I, item 5.9", "seq": 81, "text": "(9)A lightning strike which resulted in damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0082", "cit": "Annex I, item 5.10", "seq": 82, "text": "(10)A hail encounter which resulted in damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0083", "cit": "Annex I, item 5.11", "seq": 83, "text": "(11)Severe turbulence encounter or any encounter resulting in injury to occupants or deemed to require a ‘turbulence check’ of the aircraft."}, {"id": "EU_2015_1018_ANNEX_I__C0084", "cit": "Annex I, item 5.12", "seq": 84, "text": "(12)A significant wind shear or thunderstorm encounter which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0085", "cit": "Annex I, item 5.13", "seq": 85, "text": "(13)Icing encounter resulting in handling difficulties, damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0086", "cit": "Annex I, item 5.14", "seq": 86, "text": "(14)Volcanic ash encounter."}, {"id": "EU_2015_1018_ANNEX_I__C0087", "cit": "Annex I, item 6", "seq": 87, "text": "6.SECURITY"}, {"id": "EU_2015_1018_ANNEX_I__C0088", "cit": "Annex I, item 6.1", "seq": 88, "text": "(1)Bomb threat or hijack."}, {"id": "EU_2015_1018_ANNEX_I__C0089", "cit": "Annex I, item 6.2", "seq": 89, "text": "(2)Difficulty in controlling intoxicated, violent or unruly passengers."}, {"id": "EU_2015_1018_ANNEX_I__C0090", "cit": "Annex I, item 6.3", "seq": 90, "text": "(3)Discovery of a stowaway."}]}, {"qa_id": "QA_0176", "reason": "exception_record;hybrid_k20_residual", "cls": "GM", "qtype": "obligation", "diff": "easy", "split": "test", "audit": "ai_rewritten_supported", "question": "What does Regulation 376/2014 require organisations to do with occurrence information?", "answer": "It requires organisations to collect, analyse and follow up occurrences as part of their safety management systems and to transfer certain occurrences to their competent authority.", "citation": "GM 3.1", "parent_id": "GM_EU_376_2014_SEC_3_1", "gold": ["GM_EU_376_2014_SEC_3_1__C0001", "GM_EU_376_2014_SEC_3_1__C0002"], "evidence": "GM_EU_376_2014_SEC_3_1__C0001 [GM 3.1]: See also Sections 1.1 and 2.1. The collection, analysis and follow-up of occurrences are part of organisations safety management systems. It contributes to the identification of risks and to the adoption of relevant mitigation actions by organisations.\nGM_EU_376_2014_SEC_3_1__C0002 [GM 3.1]: Regulation 376/2014 requires the collection, analysis and follow-up by organisations, as well as the transfer of certain occurrences to their competent authority. One could question the safety benefit of transferring this information to the competent authority. Indeed the organisation has already addressed its safety risks in the context of its SMS.", "ai_notes": "The original citation incorrectly pointed to Section 1.1.", "n": 3, "va": 2, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R1: GM 3(1) = ?", "siblings": [{"id": "GM_EU_376_2014_SEC_3_1__C0001", "cit": "GM 3.1", "seq": 1, "text": "See also Sections 1.1 and 2.1. The collection, analysis and follow-up of occurrences are part of organisations safety management systems. It contributes to the identification of risks and to the adoption of relevant mitigation actions by organisations."}, {"id": "GM_EU_376_2014_SEC_3_1__C0002", "cit": "GM 3.1", "seq": 2, "text": "Regulation 376/2014 requires the collection, analysis and follow-up by organisations, as well as the transfer of certain occurrences to their competent authority. One could question the safety benefit of transferring this information to the competent authority. Indeed the organisation has already addressed its safety risks in the context of its SMS."}, {"id": "GM_EU_376_2014_SEC_3_1__C0003", "cit": "GM 3.1", "seq": 3, "text": "Sharing occurrences with the competent authority (Member States or EASA) allow this authority to be informed about the risks faced at national or European level and to therefore identify measures that may be necessary to ensure aviation safety from a broader (national or European) perspective. Indeed, the reporting of aviation safety occurrences is vital to the understanding safety risks in the av"}, {"id": "GM_EU_376_2014_SEC_3_1__C0004", "cit": "GM 3.1", "seq": 4, "text": "Furthermore, this information is necessary in the context of the oversight performed by the competent authorities on their organisations."}]}, {"qa_id": "QA_0193", "reason": "exception_record", "cls": "GM", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "What should organisations aim to provide in their initial occurrence report?", "answer": "They should make the initial report as complete as possible, especially its safety assessment, because not every report will receive a follow-up report.", "citation": "GM 3.9", "parent_id": "GM_EU_376_2014_SEC_3_9", "gold": ["GM_EU_376_2014_SEC_3_9__C0006"], "evidence": "GM_EU_376_2014_SEC_3_9__C0006 [GM 3.9]: It is recognised that some of the requested information might necessitate detailed assessment or analysis (e.g. risk classification) and might only be available after the occurrence has been analysed. It is also recognised that the period required for the notification of the occurrence might not allow the organisation to provide complete information within its initial notification. However, organisations should aim to provide the initial report as complete as possible, notably in regards to the safety assessment, as not all reports may be subject to follow-up report.", "ai_notes": "The original citation incorrectly pointed to Section 3.10.", "n": 2, "va": 2, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "GM_EU_376_2014_SEC_3_9__C0001", "cit": "GM 3.9", "seq": 1, "text": "Regulation 376/2014 imposes requirements on organisations related to reporting format and content (Article 7). This set of requirements applies to all reportable occurrences (MOR and VOR reportable occurrences)."}, {"id": "GM_EU_376_2014_SEC_3_9__C0002", "cit": "GM 3.9", "seq": 2, "text": "Key principle Occurrence reports contained in an organisation database and sent to the competent authority shall comply with format specifications that include: The compatibility with the ECCAIRS software and the ADREP taxonomy The use of standardised formats The provision of mandatory data fields"}, {"id": "GM_EU_376_2014_SEC_3_9__C0003", "cit": "GM 3.9", "seq": 3, "text": "In addition, organisations are required to use data quality checking processes and to classify occurrences according to their safety risk."}, {"id": "GM_EU_376_2014_SEC_3_9__C0004", "cit": "GM 3.9", "seq": 4, "text": "Detailed information about these requirements is provided in Sections 3.10 to 3.14."}, {"id": "GM_EU_376_2014_SEC_3_9__C0005", "cit": "GM 3.9", "seq": 5, "text": "These obligations apply to occurrence reports registered in organisations databases."}, {"id": "GM_EU_376_2014_SEC_3_9__C0006", "cit": "GM 3.9", "seq": 6, "text": "It is recognised that some of the requested information might necessitate detailed assessment or analysis (e.g. risk classification) and might only be available after the occurrence has been analysed. It is also recognised that the period required for the notification of the occurrence might not allow the organisation to provide complete information within its initial notification. However, organi"}, {"id": "GM_EU_376_2014_SEC_3_9__C0007", "cit": "GM 3.9", "seq": 7, "text": "The European Commission, with the support of EASA, has developed a European Reporting Portal which is available here. This website offers a single address that can be used by reporting organisations to transfer occurrences to their competent authority in a format that is compliant with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_3_9__C0008", "cit": "GM 3.9", "seq": 8, "text": "Key principle Using tools and methods provided by the European Commission ensures compliance with format related legal requirements."}, {"id": "GM_EU_376_2014_SEC_3_9__C0009", "cit": "GM 3.9", "seq": 9, "text": "It is understood that organisations and competent authorities may agree on any other method that brings equivalent level of compliance."}]}, {"qa_id": "QA_0229", "reason": "stratified_unchanged_GM_test", "cls": "GM", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_provisional_supported", "question": "What principle is established in Article 16(11) regarding internal rules?", "answer": "Article 16(11) sets the obligation for organisations to adopt internal rules describing how ‘Just Culture’ principles are guaranteed and implemented within that organisation after consulting its staff representatives.", "citation": "Article 16(11)", "parent_id": "GM_EU_376_2014_SEC_4_9", "gold": ["GM_EU_376_2014_SEC_4_9__C0002"], "evidence": "GM_EU_376_2014_SEC_4_9__C0002 [GM 4.9]: Article 16(6) states the principle of proceedings limitations; Article 16(9) establishes the principle of non-prejudice in a corporate context, both principles being subject to the two exceptions mentioned in Article 16(10). Article 16(11) sets the obligation for organisations to adopt, after consulting its staff representatives, internal rules describing how ‘Just Culture’ principles are guaranteed and implemented within that organisation.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "GM_EU_376_2014_SEC_4_9__C0001", "cit": "GM 4.9", "seq": 1, "text": "Key principle Article 16(2) requires the Member States to designate a body responsible for the implementation of Article 16 (6), (9) and (11)."}, {"id": "GM_EU_376_2014_SEC_4_9__C0002", "cit": "GM 4.9", "seq": 2, "text": "Article 16(6) states the principle of proceedings limitations; Article 16(9) establishes the principle of non-prejudice in a corporate context, both principles being subject to the two exceptions mentioned in Article 16(10). Article 16(11) sets the obligation for organisations to adopt, after consulting its staff representatives, internal rules describing how ‘Just Culture’ principles are guarante"}, {"id": "GM_EU_376_2014_SEC_4_9__C0003", "cit": "GM 4.9", "seq": 3, "text": "Key principle Full flexibility is given to the Member States to decide which entity shall be entrusted with this role."}, {"id": "GM_EU_376_2014_SEC_4_9__C0004", "cit": "GM 4.9", "seq": 4, "text": "It is understood that it could be an existing entity or an entity established specifically for fulfilling this responsibility. It is also understood that this entity might be elsewhere entrusted with aviation responsibilities, judicial responsibilities, ombudsman related responsibilities or with any other responsibility. Member States are however encouraged to designate an entity which acts indepe"}, {"id": "GM_EU_376_2014_SEC_4_9__C0005", "cit": "GM 4.9", "seq": 5, "text": "The designated entity is responsible for:"}, {"id": "GM_EU_376_2014_SEC_4_9__C0006", "cit": "GM 4.9", "seq": 6, "text": "Receiving and handling employees and contracted personnel alleged infringements of the rules"}, {"id": "GM_EU_376_2014_SEC_4_9__C0007", "cit": "GM 4.9", "seq": 7, "text": "Advise the relevant authorities of the Member States on the adoption of actions against those who infringe the principles of protection of the reporter and of other persons mentioned in occurrence reports, such as remedies or penalties"}, {"id": "GM_EU_376_2014_SEC_4_9__C0008", "cit": "GM 4.9", "seq": 8, "text": "Upon its decision, reviewing ‘Just Culture’ internal rules of organisations established in its Member State."}, {"id": "GM_EU_376_2014_SEC_4_9__C0009", "cit": "GM 4.9", "seq": 9, "text": "It is understood that this entity shall coordinate with the authorities of its Member State responsible for imposing penalties in infringement to the Regulation and shall advise them about remedies or penalties it intends to adopt (Article 16(12))."}, {"id": "GM_EU_376_2014_SEC_4_9__C0010", "cit": "GM 4.9", "seq": 10, "text": "A report detailing the activities of this entity shall be sent to the European Commission every five years."}]}, {"qa_id": "QA_0248", "reason": "exception_record", "cls": "ARTICLE", "qtype": "exception", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "Who must report when the pilot in command is unable to report an occurrence?", "answer": "When the pilot in command is unable to report, another crew member next in the chain of command must report the occurrence, subject to the aircraft and operator scope stated in Article 4(6)(a).", "citation": "Article 4(6)(a)", "parent_id": "EU_376_2014_ART_4", "gold": ["EU_376_2014_ART_4__C0030"], "evidence": "EU_376_2014_ART_4__C0030 [Article 4(6)(a)]: (a)the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft registered in a Member State or an aircraft registered outside the Union but used by an operator for which a Member State ensures oversight of operations or an operator established in the Union;", "ai_notes": "The original negative question implied an exemption rather than a transfer to the next crew member.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "EU_376_2014_ART_4__C0001", "cit": "Article 4(1)", "seq": 1, "text": "1.Occurrences which may represent a significant risk to aviation safety and which fall into the following categories shall be reported by the persons listed in paragraph 6 through the mandatory occurrence reporting systems pursuant to this Article:"}, {"id": "EU_376_2014_ART_4__C0002", "cit": "Article 4(1)(a)", "seq": 2, "text": "(a)occurrences related to the operation of the aircraft, such as:"}, {"id": "EU_376_2014_ART_4__C0003", "cit": "Article 4(1)(a)(i)", "seq": 3, "text": "(i)collision-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0004", "cit": "Article 4(1)(a)(ii)", "seq": 4, "text": "(ii)take-off and landing-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0005", "cit": "Article 4(1)(a)(iii)", "seq": 5, "text": "(iii)fuel-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0006", "cit": "Article 4(1)(a)(iv)", "seq": 6, "text": "(iv)in-flight occurrences;"}, {"id": "EU_376_2014_ART_4__C0007", "cit": "Article 4(1)(a)(v)", "seq": 7, "text": "(v)communication-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0008", "cit": "Article 4(1)(a)(vi)", "seq": 8, "text": "(vi)occurrences related to injury, emergencies and other critical situations;"}, {"id": "EU_376_2014_ART_4__C0009", "cit": "Article 4(1)(a)(vii)", "seq": 9, "text": "(vii)crew incapacitation and other crew-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0010", "cit": "Article 4(1)(a)(viii)", "seq": 10, "text": "(viii)meteorological conditions or security-related occurrences;"}, {"id": "EU_376_2014_ART_4__C0011", "cit": "Article 4(1)(b)", "seq": 11, "text": "(b)occurrences related to technical conditions, maintenance and repair of aircraft, such as:"}, {"id": "EU_376_2014_ART_4__C0012", "cit": "Article 4(1)(b)(i)", "seq": 12, "text": "(i)structural defects;"}, {"id": "EU_376_2014_ART_4__C0013", "cit": "Article 4(1)(b)(ii)", "seq": 13, "text": "(ii)system malfunctions;"}, {"id": "EU_376_2014_ART_4__C0014", "cit": "Article 4(1)(b)(iii)", "seq": 14, "text": "(iii)maintenance and repair problems;"}, {"id": "EU_376_2014_ART_4__C0015", "cit": "Article 4(1)(b)(iv)", "seq": 15, "text": "(iv)propulsion problems (including engines, propellers and rotor systems) and auxiliary power unit problems;"}, {"id": "EU_376_2014_ART_4__C0016", "cit": "Article 4(1)(c)", "seq": 16, "text": "(c)occurrences related to air navigation services and facilities, such as:"}, {"id": "EU_376_2014_ART_4__C0017", "cit": "Article 4(1)(c)(i)", "seq": 17, "text": "(i)collisions, near collisions or potential for collisions;"}, {"id": "EU_376_2014_ART_4__C0018", "cit": "Article 4(1)(c)(ii)", "seq": 18, "text": "(ii)specific occurrences of air traffic management and air navigation services (ATM/ANS);"}, {"id": "EU_376_2014_ART_4__C0019", "cit": "Article 4(1)(c)(iii)", "seq": 19, "text": "(iii)ATM/ANS operational occurrences;"}, {"id": "EU_376_2014_ART_4__C0020", "cit": "Article 4(1)(d)", "seq": 20, "text": "(d)occurrences related to aerodromes and ground services, such as:"}, {"id": "EU_376_2014_ART_4__C0021", "cit": "Article 4(1)(d)(i)", "seq": 21, "text": "(i)occurrences related to aerodrome activities and facilities;"}, {"id": "EU_376_2014_ART_4__C0022", "cit": "Article 4(1)(d)(ii)", "seq": 22, "text": "(ii)occurrences related to handling of passengers, baggage, mail and cargo;"}, {"id": "EU_376_2014_ART_4__C0023", "cit": "Article 4(1)(d)(iii)", "seq": 23, "text": "(iii)occurrences related to aircraft ground handling and related services."}, {"id": "EU_376_2014_ART_4__C0024", "cit": "Article 4(2)", "seq": 24, "text": "2.Each organisation established in a Member State shall establish a mandatory reporting system to facilitate the collection of details of occurrences referred to in paragraph 1."}, {"id": "EU_376_2014_ART_4__C0025", "cit": "Article 4(3)", "seq": 25, "text": "3.Each Member State shall establish a mandatory reporting system to facilitate the collection of details of occurrences including the collection of details of occurrences collected by organisations pursuant to paragraph 2."}, {"id": "EU_376_2014_ART_4__C0026", "cit": "Article 4(4)", "seq": 26, "text": "4.The European Aviation Safety Agency (‘the Agency’) shall establish a mandatory reporting system to facilitate the collection of details of occurrences, including the collection of details of occurrences collected pursuant to paragraph 2 by organisations which have been certified or approved by the Agency."}, {"id": "EU_376_2014_ART_4__C0027", "cit": "Article 4(5)", "seq": 27, "text": "5.The Commission shall, by means of implementing acts, adopt a list classifying occurrences to be referred to when reporting occurrences pursuant to paragraph 1. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 19(2)."}, {"id": "EU_376_2014_ART_4__C0028", "cit": "Article 4(5)", "seq": 28, "text": "The Commission shall include in those implementing acts a separate list classifying occurrences applicable to aircraft other than complex motor-powered aircraft. The list shall be a simplified version of the list referred to in the first subparagraph and shall, where appropriate, be adapted to the specificities of that branch of aviation."}, {"id": "EU_376_2014_ART_4__C0029", "cit": "Article 4(6)", "seq": 29, "text": "6.The following natural persons shall report the occurrences referred to in paragraph 1 through the system established in accordance with paragraph 2 by the organisation which employs, contracts or uses the services of the reporter or, failing that, through the system established in accordance with paragraph 3 by the Member State of establishment of their organisation, or by the State which issued"}, {"id": "EU_376_2014_ART_4__C0030", "cit": "Article 4(6)(a)", "seq": 30, "text": "(a)the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft registered in a Member State or an aircraft registered outside the Union but used by an operator for which a Member State ensures oversight of operations or an operator established in the Union;"}, {"id": "EU_376_2014_ART_4__C0031", "cit": "Article 4(6)(b)", "seq": 31, "text": "(b)a person engaged in designing, manufacturing, continuous airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof, under the oversight of a Member State or of the Agency;"}, {"id": "EU_376_2014_ART_4__C0032", "cit": "Article 4(6)(c)", "seq": 32, "text": "(c)a person who signs an airworthiness review certificate, or a release to service in respect of an aircraft or any equipment or part thereof, under the oversight of a Member State or of the Agency;"}, {"id": "EU_376_2014_ART_4__C0033", "cit": "Article 4(6)(d)", "seq": 33, "text": "(d)a person who performs a function which requires him or her to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer;"}, {"id": "EU_376_2014_ART_4__C0034", "cit": "Article 4(6)(e)", "seq": 34, "text": "(e)a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 of the European Parliament and of the Council () applies;"}, {"id": "EU_376_2014_ART_4__C0035", "cit": "Article 4(6)(f)", "seq": 35, "text": "(f)a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State ensures the oversight;"}, {"id": "EU_376_2014_ART_4__C0036", "cit": "Article 4(6)(g)", "seq": 36, "text": "(g)a person who performs a function connected with the ground handling of aircraft, including fuelling, loadsheet preparation, loading, de-icing and towing at an airport covered by Regulation (EC) No 1008/2008."}, {"id": "EU_376_2014_ART_4__C0037", "cit": "Article 4(7)", "seq": 37, "text": "7.The persons listed in paragraph 6 shall report occurrences within 72 hours of becoming aware of the occurrence, unless exceptional circumstances prevent this."}, {"id": "EU_376_2014_ART_4__C0038", "cit": "Article 4(8)", "seq": 38, "text": "8.Following notification of an occurrence, any organisation established in a Member State which is not covered by paragraph 9 shall report to the competent authority of that Member State, as referred to in Article 6(3), the details of occurrences collected in accordance with paragraph 2 of this Article as soon as possible, and in any event no later than 72 hours after becoming aware of the occurre"}, {"id": "EU_376_2014_ART_4__C0039", "cit": "Article 4(9)", "seq": 39, "text": "9.Following notification of an occurrence, each organisation established in a Member State which is certified or approved by the Agency shall report to the Agency the details of occurrences collected in accordance with paragraph 2 as soon as possible, and in any event no later than 72 hours after becoming aware of the occurrence."}]}, {"qa_id": "QA_0258", "reason": "exception_record", "cls": "ARTICLE", "qtype": "scope", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "What information must competent authorities store in the national database?", "answer": "They must store occurrence reports drawn up from details collected under Articles 4 and 5. Relevant information on accidents and serious incidents collected or issued by safety investigation authorities must also be stored there.", "citation": "Article 6(6)-(7)", "parent_id": "EU_376_2014_ART_6", "gold": ["EU_376_2014_ART_6__C0014", "EU_376_2014_ART_6__C0015"], "evidence": "EU_376_2014_ART_6__C0014 [Article 6(6)]: 6.The competent authorities referred to in paragraph 3 shall store occurrence reports drawn up on the basis of details of occurrences collected in accordance with Articles 4 and 5 in a national database.\nEU_376_2014_ART_6__C0015 [Article 6(7)]: 7.Relevant information on accidents and serious incidents collected or issued by safety investigation authorities shall also be stored in the national database.", "ai_notes": "The original answer invented consequences of non-storage that are not stated in the cited clauses.", "n": 3, "va": 2, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R4: dans la question \"information\" est vague. Dans la réponse expliciter le contenu des articles 4 et 5", "siblings": [{"id": "EU_376_2014_ART_6__C0001", "cit": "Article 6(1)", "seq": 1, "text": "1.Each organisation established in a Member State shall designate one or more persons to handle independently the collection, evaluation, processing, analysis and storage of details of occurrences reported pursuant to Articles 4 and 5."}, {"id": "EU_376_2014_ART_6__C0002", "cit": "Article 6(1)", "seq": 2, "text": "The handling of the reports shall be done with a view to preventing the use of information for purposes other than safety, and shall appropriately safeguard the confidentiality of the identity of the reporter and of the persons mentioned in occurrence reports, with a view to promoting a ‘just culture’."}, {"id": "EU_376_2014_ART_6__C0003", "cit": "Article 6(2)", "seq": 3, "text": "2.By agreement with the competent authority, small organisations may put in place a simplified mechanism for the collection, evaluation, processing, analysis and storage of details of occurrences. They may share those tasks with organisations of the same nature, while complying with the rules on confidentiality and protection pursuant to this Regulation."}, {"id": "EU_376_2014_ART_6__C0004", "cit": "Article 6(3)", "seq": 4, "text": "3.Each Member State shall designate one or more competent authorities to establish a mechanism to independently collect, evaluate, process, analyse and store details of occurrences reported pursuant to Articles 4 and 5."}, {"id": "EU_376_2014_ART_6__C0005", "cit": "Article 6(3)", "seq": 5, "text": "The handling of the reports shall be done with a view to preventing the use of information for purposes other than safety, and shall appropriately safeguard the confidentiality of the identity of the reporter and of the persons mentioned in occurrence reports, with a view to promoting a ‘just culture’."}, {"id": "EU_376_2014_ART_6__C0006", "cit": "Article 6(3)", "seq": 6, "text": "The authorities which may be designated pursuant to the first subparagraph, either jointly or separately, are the following:"}, {"id": "EU_376_2014_ART_6__C0007", "cit": "Article 6(3)(a)", "seq": 7, "text": "(a)the national civil aviation authority; and/or"}, {"id": "EU_376_2014_ART_6__C0008", "cit": "Article 6(3)(b)", "seq": 8, "text": "(b)the safety investigation authority; and/or"}, {"id": "EU_376_2014_ART_6__C0009", "cit": "Article 6(3)(c)", "seq": 9, "text": "(c)any other independent body or entity based in the Union that is entrusted with this function."}, {"id": "EU_376_2014_ART_6__C0010", "cit": "Article 6(3)(c)", "seq": 10, "text": "Where a Member State designates more than one body or entity, it shall designate one of them as point of contact for the transfer of information referred to in Article 8(2)."}, {"id": "EU_376_2014_ART_6__C0011", "cit": "Article 6(4)", "seq": 11, "text": "4.The Agency shall designate one or more persons to establish a mechanism to independently collect, evaluate, process, analyse and store details of occurrences reported in accordance with Articles 4 and 5."}, {"id": "EU_376_2014_ART_6__C0012", "cit": "Article 6(4)", "seq": 12, "text": "The handling of the reports shall be done with a view to preventing the use of information for purposes other than safety, and shall appropriately safeguard the confidentiality of the identity of the reporter and of the persons mentioned in occurrence reports, with a view to promoting a ‘just culture’."}, {"id": "EU_376_2014_ART_6__C0013", "cit": "Article 6(5)", "seq": 13, "text": "5.Organisations shall store occurrence reports drawn up on the basis of details of occurrences collected in accordance with Articles 4 and 5 in one or more databases."}, {"id": "EU_376_2014_ART_6__C0014", "cit": "Article 6(6)", "seq": 14, "text": "6.The competent authorities referred to in paragraph 3 shall store occurrence reports drawn up on the basis of details of occurrences collected in accordance with Articles 4 and 5 in a national database."}, {"id": "EU_376_2014_ART_6__C0015", "cit": "Article 6(7)", "seq": 15, "text": "7.Relevant information on accidents and serious incidents collected or issued by safety investigation authorities shall also be stored in the national database."}, {"id": "EU_376_2014_ART_6__C0016", "cit": "Article 6(8)", "seq": 16, "text": "8.The Agency shall store occurrence reports drawn up on the basis of details of occurrences collected in accordance with Articles 4 and 5 in a database."}, {"id": "EU_376_2014_ART_6__C0017", "cit": "Article 6(9)", "seq": 17, "text": "9.Safety investigation authorities shall have full access to their respective national database referred to in paragraph 6 for the purpose of discharging their responsibilities pursuant to Article 5(4) of Regulation (EU) No 996/2010."}, {"id": "EU_376_2014_ART_6__C0018", "cit": "Article 6(10)", "seq": 18, "text": "10.Civil aviation authorities of Member States shall have full access to their respective national database referred to in paragraph 6 for the purposes of their safety-related responsibilities."}]}, {"qa_id": "QA_0263", "reason": "exception_record", "cls": "ARTICLE", "qtype": "cross_reference", "diff": "hard", "split": "test", "audit": "ai_rewritten_supported", "question": "What database-format requirements and support responsibilities are specified in Article 7(4) and Article 7(8)?", "answer": "The relevant databases must use formats that are standardised for information exchange and compatible with ECCAIRS and the ADREP taxonomy. The Commission and the Agency must support Member-State competent authorities with data integration and provide that support in a way that contributes to harmonised data entry.", "citation": "Article 7(4) and 7(8)", "parent_id": "EU_376_2014_ART_7", "gold": ["EU_376_2014_ART_7__C0004", "EU_376_2014_ART_7__C0005", "EU_376_2014_ART_7__C0006", "EU_376_2014_ART_7__C0011", "EU_376_2014_ART_7__C0015"], "evidence": "EU_376_2014_ART_7__C0004 [Article 7(4)]: 4.The databases referred to in paragraphs 5, 6 and 8 of Article 6 shall use formats which are:\nEU_376_2014_ART_7__C0005 [Article 7(4)(a)]: (a)standardised to facilitate information exchange; and\nEU_376_2014_ART_7__C0006 [Article 7(4)(b)]: (b)compatible with the ECCAIRS software and the ADREP taxonomy.\nEU_376_2014_ART_7__C0011 [Article 7(8)]: 8.The Commission and the Agency shall support the competent authorities of the Member States in their task of data integration, including for example in:\nEU_376_2014_ART_7__C0015 [Article 7(8)(c)]: The Commission and the Agency shall provide that support in such a way as to contribute to the harmonisation of the data entry process across Member States, in particular by providing to staff working in the bodies or entities referred to in Article 6(1), (3) and (4):", "ai_notes": "The original answer asserted a direct dependency and failure consequence not stated in the provisions.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "EU_376_2014_ART_7__C0001", "cit": "Article 7(1)", "seq": 1, "text": "1.Occurrence reports referred to in Article 6 shall contain at least the information listed in Annex I."}, {"id": "EU_376_2014_ART_7__C0002", "cit": "Article 7(2)", "seq": 2, "text": "2.Occurrence reports referred to in paragraphs 5, 6 and 8 of Article 6 shall include a safety risk classification for the occurrence concerned. That classification shall be reviewed and if necessary amended, and shall be endorsed by the competent authority of the Member State or the Agency, in accordance with the common European risk classification scheme referred to in paragraph 5 of this Article"}, {"id": "EU_376_2014_ART_7__C0003", "cit": "Article 7(3)", "seq": 3, "text": "3.Organisations, Member States and the Agency shall establish data quality checking processes to improve data consistency, notably between the information collected initially and the report stored in the database."}, {"id": "EU_376_2014_ART_7__C0004", "cit": "Article 7(4)", "seq": 4, "text": "4.The databases referred to in paragraphs 5, 6 and 8 of Article 6 shall use formats which are:"}, {"id": "EU_376_2014_ART_7__C0005", "cit": "Article 7(4)(a)", "seq": 5, "text": "(a)standardised to facilitate information exchange; and"}, {"id": "EU_376_2014_ART_7__C0006", "cit": "Article 7(4)(b)", "seq": 6, "text": "(b)compatible with the ECCAIRS software and the ADREP taxonomy."}, {"id": "EU_376_2014_ART_7__C0007", "cit": "Article 7(5)", "seq": 7, "text": "5.The Commission, in close cooperation with the Member States and the Agency through the network of aviation safety analysts, referred to in Article 14(2), shall develop a common European risk classification scheme to enable the organisations, Member States and the Agency to classify occurrences in terms of safety risk. In so doing, the Commission shall take into account the need for compatibility"}, {"id": "EU_376_2014_ART_7__C0008", "cit": "Article 7(5)", "seq": 8, "text": "The Commission shall develop that scheme by 15 May 2017."}, {"id": "EU_376_2014_ART_7__C0009", "cit": "Article 7(6)", "seq": 9, "text": "6.The Commission shall be empowered to adopt delegated acts in accordance with Article 18 to define the common European risk classification scheme."}, {"id": "EU_376_2014_ART_7__C0010", "cit": "Article 7(7)", "seq": 10, "text": "7.The Commission shall, by means of implementing acts, adopt the arrangements for the implementation of the common European risk classification scheme. Those implementing acts shall be adopted in accordance with the examination procedure referred to in Article 19(2)."}, {"id": "EU_376_2014_ART_7__C0011", "cit": "Article 7(8)", "seq": 11, "text": "8.The Commission and the Agency shall support the competent authorities of the Member States in their task of data integration, including for example in:"}, {"id": "EU_376_2014_ART_7__C0012", "cit": "Article 7(8)(a)", "seq": 12, "text": "(a)the integration of the minimum information referred to in paragraph 1;"}, {"id": "EU_376_2014_ART_7__C0013", "cit": "Article 7(8)(b)", "seq": 13, "text": "(b)the risk classification of occurrences referred to in paragraph 2; and"}, {"id": "EU_376_2014_ART_7__C0014", "cit": "Article 7(8)(c)", "seq": 14, "text": "(c)the establishment of data quality checking processes referred to in paragraph 3."}, {"id": "EU_376_2014_ART_7__C0015", "cit": "Article 7(8)(c)", "seq": 15, "text": "The Commission and the Agency shall provide that support in such a way as to contribute to the harmonisation of the data entry process across Member States, in particular by providing to staff working in the bodies or entities referred to in Article 6(1), (3) and (4):"}, {"id": "EU_376_2014_ART_7__C0016", "cit": "Article 7(8)(a)", "seq": 16, "text": "(a)guidance material;"}, {"id": "EU_376_2014_ART_7__C0017", "cit": "Article 7(8)(b)", "seq": 17, "text": "(b)workshops; and"}, {"id": "EU_376_2014_ART_7__C0018", "cit": "Article 7(8)(c)", "seq": 18, "text": "(c)appropriate training."}]}, {"qa_id": "QA_0265", "reason": "exception_record", "cls": "ARTICLE", "qtype": "obligation", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "What must an organisation do after its analysis identifies appropriate corrective or preventive action for a safety deficiency?", "answer": "It must implement the action in a timely manner and establish a process to monitor its implementation and effectiveness.", "citation": "Article 13(2)", "parent_id": "EU_376_2014_ART_13", "gold": ["EU_376_2014_ART_13__C0003", "EU_376_2014_ART_13__C0004", "EU_376_2014_ART_13__C0005"], "evidence": "EU_376_2014_ART_13__C0003 [Article 13(2)]: 2.When, following the analysis referred to in paragraph 1, an organisation established in a Member State identifies any appropriate corrective or preventive action required to address actual or potential aviation safety deficiencies, it shall:\nEU_376_2014_ART_13__C0004 [Article 13(2)(a)]: (a)implement that action in a timely manner; and\nEU_376_2014_ART_13__C0005 [Article 13(2)(b)]: (b)establish a process to monitor the implementation and effectiveness of the action.", "ai_notes": "The original final sentence claimed that failure to analyse negates the obligation; that consequence is not stated.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "EU_376_2014_ART_13__C0001", "cit": "Article 13(1)", "seq": 1, "text": "1.Each organisation established in a Member State shall develop a process to analyse occurrences collected in accordance with Articles 4(2) and 5(1) in order to identify the safety hazards associated with identified occurrences or groups of occurrences."}, {"id": "EU_376_2014_ART_13__C0002", "cit": "Article 13(1)", "seq": 2, "text": "Based on that analysis, each organisation shall determine any appropriate corrective or preventive action, required to improve aviation safety."}, {"id": "EU_376_2014_ART_13__C0003", "cit": "Article 13(2)", "seq": 3, "text": "2.When, following the analysis referred to in paragraph 1, an organisation established in a Member State identifies any appropriate corrective or preventive action required to address actual or potential aviation safety deficiencies, it shall:"}, {"id": "EU_376_2014_ART_13__C0004", "cit": "Article 13(2)(a)", "seq": 4, "text": "(a)implement that action in a timely manner; and"}, {"id": "EU_376_2014_ART_13__C0005", "cit": "Article 13(2)(b)", "seq": 5, "text": "(b)establish a process to monitor the implementation and effectiveness of the action."}, {"id": "EU_376_2014_ART_13__C0006", "cit": "Article 13(3)", "seq": 6, "text": "3.Each organisation established in a Member State shall regularly provide its employees and contracted personnel with information concerning the analysis of, and follow-up on, occurrences for which preventive or corrective action is taken."}, {"id": "EU_376_2014_ART_13__C0007", "cit": "Article 13(4)", "seq": 7, "text": "4.Where an organisation established in a Member State which is not covered by paragraph 5 identifies an actual or potential aviation safety risk as a result of its analysis of occurrences or group of occurrences reported pursuant to Articles 4(8) and 5(6), it shall transmit to the competent authority of that Member State, within 30 days from the date of notification of the occurrence by the report"}, {"id": "EU_376_2014_ART_13__C0008", "cit": "Article 13(4)(a)", "seq": 8, "text": "(a)the preliminary results of the analysis performed pursuant to paragraph 1, if any; and"}, {"id": "EU_376_2014_ART_13__C0009", "cit": "Article 13(4)(b)", "seq": 9, "text": "(b)any action to be taken pursuant to paragraph 2."}, {"id": "EU_376_2014_ART_13__C0010", "cit": "Article 13(4)(b)", "seq": 10, "text": "The organisation shall report the final results of the analysis, where required, as soon as they are available and, in principle, no later than three months from the date of notification of the occurrence."}, {"id": "EU_376_2014_ART_13__C0011", "cit": "Article 13(4)(b)", "seq": 11, "text": "A competent authority of a Member State may request organisations to transmit to it the preliminary or final results of the analysis of any occurrence of which it has been notified but in relation to which it has received no follow-up or only the preliminary results."}, {"id": "EU_376_2014_ART_13__C0012", "cit": "Article 13(5)", "seq": 12, "text": "5.Where an organisation established in a Member State and certified or approved by the Agency identifies an actual or potential aviation safety risk as a result of its analysis of occurrences or group of occurrences reported pursuant to Articles 4(9) and 5(5), it shall transmit to the Agency, within 30 days from the date of notification of the occurrence by the reporter:"}, {"id": "EU_376_2014_ART_13__C0013", "cit": "Article 13(5)(a)", "seq": 13, "text": "(a)the preliminary results of the analysis performed pursuant to paragraph 1, if any; and"}, {"id": "EU_376_2014_ART_13__C0014", "cit": "Article 13(5)(b)", "seq": 14, "text": "(b)any action to be taken pursuant to paragraph 2."}, {"id": "EU_376_2014_ART_13__C0015", "cit": "Article 13(5)(b)", "seq": 15, "text": "The organisation certified or approved by the Agency shall transmit to the Agency the final results of the analysis, where required, as soon as they are available and, in principle, no later than three months from the date of notification of the occurrence."}, {"id": "EU_376_2014_ART_13__C0016", "cit": "Article 13(5)(b)", "seq": 16, "text": "The Agency may request organisations to transmit to it the preliminary or final results of the analysis of any occurrence of which it has been notified but in relation to which it has received no follow-up or only the preliminary results."}, {"id": "EU_376_2014_ART_13__C0017", "cit": "Article 13(6)", "seq": 17, "text": "6.Each Member State and the Agency shall develop a process to analyse the information relating to occurrences which are directly reported to them in accordance with Articles 4(6), 5(2) and 5(3) in order to identify the safety hazards associated with those occurrences. Based on that analysis, they shall determine any appropriate corrective or preventive action required to improve aviation safety."}, {"id": "EU_376_2014_ART_13__C0018", "cit": "Article 13(7)", "seq": 18, "text": "7.When, following the analysis referred to in paragraph 6, a Member State or the Agency identifies any appropriate corrective or preventive action required to address actual or potential aviation safety deficiencies, it shall:"}, {"id": "EU_376_2014_ART_13__C0019", "cit": "Article 13(7)(a)", "seq": 19, "text": "(a)implement that action in a timely manner; and"}, {"id": "EU_376_2014_ART_13__C0020", "cit": "Article 13(7)(b)", "seq": 20, "text": "(b)establish a process to monitor the implementation and effectiveness of the action."}, {"id": "EU_376_2014_ART_13__C0021", "cit": "Article 13(8)", "seq": 21, "text": "8.For each occurrence or group of occurrences monitored in accordance with paragraph 4 or 5, each Member State and the Agency shall have access to the analysis made and shall appropriately monitor action taken by the organisations for which it is respectively responsible."}, {"id": "EU_376_2014_ART_13__C0022", "cit": "Article 13(8)", "seq": 22, "text": "If a Member State or the Agency concludes that the implementation and the effectiveness of the reported action is inappropriate to address actual or potential safety deficiencies, it shall ensure that additional appropriate action is taken and implemented by the relevant organisation."}, {"id": "EU_376_2014_ART_13__C0023", "cit": "Article 13(9)", "seq": 23, "text": "9.Where available, information relating to the analysis and the follow-up of individual occurrences or groups of occurrences obtained pursuant to this Article shall be stored in the European Central Repository, in accordance with Article 8(2) and (3), in a timely manner and no later than two months after their storage in the national database."}, {"id": "EU_376_2014_ART_13__C0024", "cit": "Article 13(10)", "seq": 24, "text": "10.Member States shall use information obtained from the analysis of occurrence reports to identify remedial action to be taken, if any, within the State Safety Programme."}, {"id": "EU_376_2014_ART_13__C0025", "cit": "Article 13(11)", "seq": 25, "text": "11.In order to inform the public of the level of safety in civil aviation, each Member State shall publish a safety review at least once a year. The safety review shall:"}, {"id": "EU_376_2014_ART_13__C0026", "cit": "Article 13(11)(a)", "seq": 26, "text": "(a)contain aggregated and anonymised information on the type of occurrences and safetyrelated information reported through its national mandatory and voluntary reporting systems;"}, {"id": "EU_376_2014_ART_13__C0027", "cit": "Article 13(11)(b)", "seq": 27, "text": "(b)identify trends;"}, {"id": "EU_376_2014_ART_13__C0028", "cit": "Article 13(11)(c)", "seq": 28, "text": "(c)identify the action it has taken."}, {"id": "EU_376_2014_ART_13__C0029", "cit": "Article 13(12)", "seq": 29, "text": "12.Member States may also publish anonymised occurrence reports and risk analysis outcomes."}]}, {"qa_id": "QA_0277", "reason": "exception_record", "cls": "ARTICLE", "qtype": "obligation", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "What must Member States do regarding personal details and disidentified information in national occurrence databases?", "answer": "Member States must ensure that personal details are never recorded in the national database referred to in Article 6(6), and must make the disidentified information available to relevant parties so they can discharge aviation-safety improvement obligations.", "citation": "Article 16(3)", "parent_id": "EU_376_2014_ART_16", "gold": ["EU_376_2014_ART_16__C0004"], "evidence": "EU_376_2014_ART_16__C0004 [Article 16(3)]: 3.Each Member State shall ensure that no personal details are ever recorded in the national database referred to in Article 6(6). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement.", "ai_notes": "The original citation incorrectly added Article 16(6), which concerns proceedings.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "EU_376_2014_ART_16__C0001", "cit": "Article 16(1)", "seq": 1, "text": "1.For the purposes of this Article, ‘personal details’ includes in particular names or addresses of natural persons."}, {"id": "EU_376_2014_ART_16__C0002", "cit": "Article 16(2)", "seq": 2, "text": "2.Each organisation established in a Member State shall ensure that all personal details are made available to staff of that organisation other than persons designated in accordance with Article 6(1) only where absolutely necessary in order to investigate occurrences with a view to enhancing aviation safety."}, {"id": "EU_376_2014_ART_16__C0003", "cit": "Article 16(2)", "seq": 3, "text": "Disidentified information shall be disseminated within the organisation as appropriate."}, {"id": "EU_376_2014_ART_16__C0004", "cit": "Article 16(3)", "seq": 4, "text": "3.Each Member State shall ensure that no personal details are ever recorded in the national database referred to in Article 6(6). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0005", "cit": "Article 16(4)", "seq": 5, "text": "4.The Agency shall ensure that no personal details are ever recorded in the Agency database referred to in Article 6(8). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0006", "cit": "Article 16(5)", "seq": 6, "text": "5.Member States and the Agency shall not be prevented from taking any action necessary for maintaining or improving aviation safety."}, {"id": "EU_376_2014_ART_16__C0007", "cit": "Article 16(6)", "seq": 7, "text": "6.Without prejudice to applicable national criminal law, Member States shall refrain from instituting proceedings in respect of unpremeditated or inadvertent infringements of the law which come to their attention only because they have been reported pursuant to Articles 4 and 5."}, {"id": "EU_376_2014_ART_16__C0008", "cit": "Article 16(6)", "seq": 8, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10. Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular apply this rule without the exceptions referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0009", "cit": "Article 16(7)", "seq": 9, "text": "7.If disciplinary or administrative proceedings are instituted under national law, information contained in occurrence reports shall not be used against:"}, {"id": "EU_376_2014_ART_16__C0010", "cit": "Article 16(7)(a)", "seq": 10, "text": "(a)the reporters; or"}, {"id": "EU_376_2014_ART_16__C0011", "cit": "Article 16(7)(b)", "seq": 11, "text": "(b)the persons mentioned in occurrence reports."}, {"id": "EU_376_2014_ART_16__C0012", "cit": "Article 16(7)(b)", "seq": 12, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0013", "cit": "Article 16(7)(b)", "seq": 13, "text": "Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular extend that protection to civil or criminal proceedings."}, {"id": "EU_376_2014_ART_16__C0014", "cit": "Article 16(8)", "seq": 14, "text": "8.Member States may adopt or maintain in force legislative provisions ensuring a higher level of protection for reporters or for persons mentioned in occurrence reports than those established in this Regulation."}, {"id": "EU_376_2014_ART_16__C0015", "cit": "Article 16(9)", "seq": 15, "text": "9.Except where paragraph 10 applies, employees and contracted personnel who report or are mentioned in occurrence reports collected in accordance with Articles 4 and 5 shall not be subject to any prejudice by their employer or by the organisation for which the services are provided on the basis of the information supplied by the reporter."}, {"id": "EU_376_2014_ART_16__C0016", "cit": "Article 16(10)", "seq": 16, "text": "10.The protection under paragraphs 6, 7 and 9 of this Article shall not apply to any of the following situations:"}, {"id": "EU_376_2014_ART_16__C0017", "cit": "Article 16(10)(a)", "seq": 17, "text": "(a)in cases of wilful misconduct;"}, {"id": "EU_376_2014_ART_16__C0018", "cit": "Article 16(10)(b)", "seq": 18, "text": "(b)where there has been a manifest, severe and serious disregard of an obvious risk and profound failure of professional responsibility to take such care as is evidently required in the circumstances, causing foreseeable damage to a person or property, or which seriously compromises the level of aviation safety."}, {"id": "EU_376_2014_ART_16__C0019", "cit": "Article 16(11)", "seq": 19, "text": "11.Each organisation established in a Member State shall, after consulting its staff representatives, adopt internal rules describing how ‘just culture’ principles, in particular the principle referred to in paragraph 9, are guaranteed and implemented within that organisation."}, {"id": "EU_376_2014_ART_16__C0020", "cit": "Article 16(11)", "seq": 20, "text": "The body designated pursuant to paragraph 12 may ask to review the internal rules of the organisations established in its Member State before those internal rules are implemented."}, {"id": "EU_376_2014_ART_16__C0021", "cit": "Article 16(12)", "seq": 21, "text": "12.Each Member State shall designate a body responsible for the implementation of paragraphs 6, 9 and 11."}, {"id": "EU_376_2014_ART_16__C0022", "cit": "Article 16(12)", "seq": 22, "text": "Employees and contracted personnel may report to that body alleged infringements of the rules established by this Article. Employees and contracted personnel shall not be penalised for reporting alleged infringements. Employees and contracted personnel may inform the Commission about such alleged infringements."}, {"id": "EU_376_2014_ART_16__C0023", "cit": "Article 16(12)", "seq": 23, "text": "Where appropriate, the designated body shall advise the relevant authorities of its Member State concerning remedies or penalties in application of Article 21."}, {"id": "EU_376_2014_ART_16__C0024", "cit": "Article 16(13)", "seq": 24, "text": "13.On 15 May 2019 and every five years thereafter, each Member State shall send the Commission a report on the application of this Article, and in particular on the activities of the body designated pursuant to paragraph 12. The report shall not contain any personal data."}]}, {"qa_id": "QA_0278", "reason": "exception_record", "cls": "ARTICLE", "qtype": "cross_reference", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "What duties do organisations and the designated Member-State body have in implementing just-culture protections?", "answer": "After consulting staff representatives, each organisation must adopt internal rules describing how just-culture principles, particularly paragraph 9, are guaranteed and implemented. The body designated by the Member State is responsible for implementing paragraphs 6, 9 and 11 and may ask to review those internal rules before implementation.", "citation": "Article 16(11)-(12)", "parent_id": "EU_376_2014_ART_16", "gold": ["EU_376_2014_ART_16__C0019", "EU_376_2014_ART_16__C0020", "EU_376_2014_ART_16__C0021"], "evidence": "EU_376_2014_ART_16__C0019 [Article 16(11)]: 11.Each organisation established in a Member State shall, after consulting its staff representatives, adopt internal rules describing how ‘just culture’ principles, in particular the principle referred to in paragraph 9, are guaranteed and implemented within that organisation.\nEU_376_2014_ART_16__C0020 [Article 16(11)]: The body designated pursuant to paragraph 12 may ask to review the internal rules of the organisations established in its Member State before those internal rules are implemented.\nEU_376_2014_ART_16__C0021 [Article 16(12)]: 12.Each Member State shall designate a body responsible for the implementation of paragraphs 6, 9 and 11.", "ai_notes": "The original answer described review as mandatory rather than something the designated body may request.", "n": 3, "va": 2, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R4: question à clarifier. dans la réponse bien séparer organisation d'un côté et member state de l'autre", "siblings": [{"id": "EU_376_2014_ART_16__C0001", "cit": "Article 16(1)", "seq": 1, "text": "1.For the purposes of this Article, ‘personal details’ includes in particular names or addresses of natural persons."}, {"id": "EU_376_2014_ART_16__C0002", "cit": "Article 16(2)", "seq": 2, "text": "2.Each organisation established in a Member State shall ensure that all personal details are made available to staff of that organisation other than persons designated in accordance with Article 6(1) only where absolutely necessary in order to investigate occurrences with a view to enhancing aviation safety."}, {"id": "EU_376_2014_ART_16__C0003", "cit": "Article 16(2)", "seq": 3, "text": "Disidentified information shall be disseminated within the organisation as appropriate."}, {"id": "EU_376_2014_ART_16__C0004", "cit": "Article 16(3)", "seq": 4, "text": "3.Each Member State shall ensure that no personal details are ever recorded in the national database referred to in Article 6(6). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0005", "cit": "Article 16(4)", "seq": 5, "text": "4.The Agency shall ensure that no personal details are ever recorded in the Agency database referred to in Article 6(8). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0006", "cit": "Article 16(5)", "seq": 6, "text": "5.Member States and the Agency shall not be prevented from taking any action necessary for maintaining or improving aviation safety."}, {"id": "EU_376_2014_ART_16__C0007", "cit": "Article 16(6)", "seq": 7, "text": "6.Without prejudice to applicable national criminal law, Member States shall refrain from instituting proceedings in respect of unpremeditated or inadvertent infringements of the law which come to their attention only because they have been reported pursuant to Articles 4 and 5."}, {"id": "EU_376_2014_ART_16__C0008", "cit": "Article 16(6)", "seq": 8, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10. Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular apply this rule without the exceptions referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0009", "cit": "Article 16(7)", "seq": 9, "text": "7.If disciplinary or administrative proceedings are instituted under national law, information contained in occurrence reports shall not be used against:"}, {"id": "EU_376_2014_ART_16__C0010", "cit": "Article 16(7)(a)", "seq": 10, "text": "(a)the reporters; or"}, {"id": "EU_376_2014_ART_16__C0011", "cit": "Article 16(7)(b)", "seq": 11, "text": "(b)the persons mentioned in occurrence reports."}, {"id": "EU_376_2014_ART_16__C0012", "cit": "Article 16(7)(b)", "seq": 12, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0013", "cit": "Article 16(7)(b)", "seq": 13, "text": "Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular extend that protection to civil or criminal proceedings."}, {"id": "EU_376_2014_ART_16__C0014", "cit": "Article 16(8)", "seq": 14, "text": "8.Member States may adopt or maintain in force legislative provisions ensuring a higher level of protection for reporters or for persons mentioned in occurrence reports than those established in this Regulation."}, {"id": "EU_376_2014_ART_16__C0015", "cit": "Article 16(9)", "seq": 15, "text": "9.Except where paragraph 10 applies, employees and contracted personnel who report or are mentioned in occurrence reports collected in accordance with Articles 4 and 5 shall not be subject to any prejudice by their employer or by the organisation for which the services are provided on the basis of the information supplied by the reporter."}, {"id": "EU_376_2014_ART_16__C0016", "cit": "Article 16(10)", "seq": 16, "text": "10.The protection under paragraphs 6, 7 and 9 of this Article shall not apply to any of the following situations:"}, {"id": "EU_376_2014_ART_16__C0017", "cit": "Article 16(10)(a)", "seq": 17, "text": "(a)in cases of wilful misconduct;"}, {"id": "EU_376_2014_ART_16__C0018", "cit": "Article 16(10)(b)", "seq": 18, "text": "(b)where there has been a manifest, severe and serious disregard of an obvious risk and profound failure of professional responsibility to take such care as is evidently required in the circumstances, causing foreseeable damage to a person or property, or which seriously compromises the level of aviation safety."}, {"id": "EU_376_2014_ART_16__C0019", "cit": "Article 16(11)", "seq": 19, "text": "11.Each organisation established in a Member State shall, after consulting its staff representatives, adopt internal rules describing how ‘just culture’ principles, in particular the principle referred to in paragraph 9, are guaranteed and implemented within that organisation."}, {"id": "EU_376_2014_ART_16__C0020", "cit": "Article 16(11)", "seq": 20, "text": "The body designated pursuant to paragraph 12 may ask to review the internal rules of the organisations established in its Member State before those internal rules are implemented."}, {"id": "EU_376_2014_ART_16__C0021", "cit": "Article 16(12)", "seq": 21, "text": "12.Each Member State shall designate a body responsible for the implementation of paragraphs 6, 9 and 11."}, {"id": "EU_376_2014_ART_16__C0022", "cit": "Article 16(12)", "seq": 22, "text": "Employees and contracted personnel may report to that body alleged infringements of the rules established by this Article. Employees and contracted personnel shall not be penalised for reporting alleged infringements. Employees and contracted personnel may inform the Commission about such alleged infringements."}, {"id": "EU_376_2014_ART_16__C0023", "cit": "Article 16(12)", "seq": 23, "text": "Where appropriate, the designated body shall advise the relevant authorities of its Member State concerning remedies or penalties in application of Article 21."}, {"id": "EU_376_2014_ART_16__C0024", "cit": "Article 16(13)", "seq": 24, "text": "13.On 15 May 2019 and every five years thereafter, each Member State shall send the Commission a report on the application of this Article, and in particular on the activities of the body designated pursuant to paragraph 12. The report shall not contain any personal data."}]}, {"qa_id": "QA_0290", "reason": "exception_record", "cls": "GM", "qtype": "obligation", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "How should an organisation address cases where the pilot in command cannot report an occurrence?", "answer": "The organisation should cover and describe those cases in its safety management system, including which other crew member is next in the chain of command when the pilot is physically unable to report.", "citation": "GM 2.2; Article 4(6)(a)", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": ["GM_EU_376_2014_SEC_2_2__C0013", "GM_EU_376_2014_SEC_2_2__C0014", "GM_EU_376_2014_SEC_2_2__C0016"], "evidence": "GM_EU_376_2014_SEC_2_2__C0013 [GM 2.2]: In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would b
