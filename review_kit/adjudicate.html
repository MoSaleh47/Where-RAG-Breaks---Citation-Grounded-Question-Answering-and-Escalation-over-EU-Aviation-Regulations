<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>PFE — Benchmark adjudication</title>
<style>
:root{--navy:#1C2B52;--gold:#B5922A;--light:#F4F6FA;--gray:#6B7280;--ink:#1F2937;
      --ok:#166534;--okbg:#DCFCE7;--bad:#9B1C1C;--badbg:#FEE2E2;--warn:#92400E;--warnbg:#FEF3C7;--line:#E3E8F0;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 18px;
       display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.bar{flex:1;min-width:180px;height:7px;background:#33406A;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.btn{border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn-g{background:var(--gold);color:var(--navy)}
.btn-o{background:transparent;color:#fff;border:1px solid #55618A}
.btn-s{background:#fff;color:var(--navy)}
.wrap{display:grid;grid-template-columns:290px 1fr 400px;height:calc(100vh - 46px)}
nav{border-right:1px solid var(--line);overflow-y:auto;background:#FAFBFD}
nav .it{padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px;align-items:center}
nav .it:hover{background:#EEF2F9}
nav .it.sel{background:var(--navy);color:#fff}
nav .it.sel .sub{color:#B9C4DC}
nav .id{font-weight:700;font-size:12.5px;min-width:66px}
nav .sub{font-size:11px;color:var(--gray)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-todo{background:#D1D5DB}.d-done{background:#16A34A}.d-panel{background:#93C5FD}.d-err{background:#DC2626}
main{overflow-y:auto;padding:20px 26px}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:18px;background:#FAFBFD}
h2{font-size:19px;margin:0 0 3px}
.meta{color:var(--gray);font-size:12px;margin-bottom:14px}
.tag{display:inline-block;background:var(--light);border:1px solid var(--line);border-radius:4px;
     padding:1px 7px;margin-right:5px;font-size:11px;color:var(--navy)}
.box{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:13px;background:#fff}
.box h3{margin:0 0 7px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.ev{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    background:var(--light);border-radius:6px;padding:11px;max-height:250px;overflow:auto}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px}
select,textarea,input[type=text]{width:100%;padding:7px 9px;border:1px solid #CBD5E1;border-radius:6px;font:inherit}
textarea{min-height:56px;resize:vertical}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.valid{border-radius:7px;padding:10px 13px;font-size:12.5px;font-weight:600;margin:13px 0}
.v-ok{background:var(--okbg);color:var(--ok)}.v-bad{background:var(--badbg);color:var(--bad)}
.sib{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px;font-size:12px;cursor:pointer}
.sib:hover{background:#EEF2F9}
.sib.on{background:#E0EBFF;border-color:#93C5FD}
.sib code{font-size:10.5px;color:var(--navy);font-weight:700}
.sib p{margin:3px 0 0;color:var(--gray);font-size:11.5px}
.vote{display:flex;gap:6px;margin:7px 0}
.vote span{flex:1;text-align:center;padding:5px;border-radius:5px;font-size:11.5px;font-weight:700}
.cmt{font-size:12px;background:#fff;border-left:3px solid var(--gold);padding:7px 10px;margin:6px 0;
     white-space:pre-wrap;border-radius:0 5px 5px 0}
.hide{display:none}
.hint{font-size:11.5px;color:var(--gray);margin-top:4px}
</style></head><body>
<header>
  <h1>Benchmark adjudication</h1>
  <div class="bar"><i id="pb"></i></div>
  <span id="cnt" style="font-size:12.5px;font-weight:600"></span>
  <button class="btn btn-o" onclick="saveProg()">Save progress</button>
  <label class="btn btn-o" style="margin:0">Load progress<input type="file" id="lp" class="hide" accept=".json"></label>
  <button class="btn btn-g" onclick="exportCsv()">Export review_queue.csv</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<script>
const DATA = [{"qa_id": "QA_0003", "reason": "exception_record", "cls": "GM", "qtype": "obligation", "diff": "medium", "split": "excluded", "audit": "excluded_invalid", "question": "Am I under the legal obligation to report occurrences?", "answer": "Yes, individuals are under a legal obligation to report occurrences as specified in Section 2.2 of the regulation.", "citation": "Section 2.2", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": [], "evidence": "", "ai_notes": "Generated from table-of-contents text; the reference answer is tautological and not evidence-grounded.", "n": 3, "va": 0, "vc": 2, "ve": 1, "agg_q1": "yes", "agg_q2": "uncertain", "agg_q3": "uncertain", "agg_q4": "no", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R1: Dire \"individus\" est réducteur, ce sont en fait les organisations qui doivent reporter. \nQu'entends-tu par \"section 2.2.\" dans le 376 ?\nJe ne suis pas sûre que le mot \"soutenue\" et la formulation dans  \" La reponse est-elle entierement soutenue par le texte fourni?\" soit français. || R2: Seules les organisations sont soumis à la notification obligatoire. || R4: texte manquant", "siblings": [{"id": "GM_EU_376_2014_SEC_2_2__C0001", "cit": "GM 2.2", "seq": 1, "text": "Whereas the reporting of any safety relevant occurrence should be encouraged, Regulation 376/2014 differentiates between occurrences that should always be reported, because they have been considered by the legislator as posing a significant risk for aviation safety, and those that may be reported if judged relevant by potential reporters (more information of the reportable occurrences is provided "}, {"id": "GM_EU_376_2014_SEC_2_2__C0002", "cit": "GM 2.2", "seq": 2, "text": "Furthermore, whereas any person involved in aviation activities should be encouraged to report any safety occurrence it considers relevant, Regulation 376/2014 differentiates between the persons who are always required to report defined occurrences, because they have been considered as front line operators by the legislator, and those that may report occurrences when they judge it relevant."}, {"id": "GM_EU_376_2014_SEC_2_2__C0003", "cit": "GM 2.2", "seq": 3, "text": "Key principle The obligation for designated persons to report certain occurrences does not prevent other persons from reporting occurrences under the normal operation of their organisation safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0004", "cit": "GM 2.2", "seq": 4, "text": "This section provides information on the persons who are required to report certain occurrences in accordance with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0005", "cit": "GM 2.2", "seq": 5, "text": "This Regulation provides for a list of designated persons that must report occurrences in the context of mandatory reporting schemes (Article 4(6)). This list covers a broad range of persons involved in aviation activities, employees as well as other persons."}, {"id": "GM_EU_376_2014_SEC_2_2__C0006", "cit": "GM 2.2", "seq": 6, "text": "Key principle The list of persons who are required to report certain occurrences covers employees of an organisation, as well as persons whose services are contracted or used by the organisation (Article 4(6))."}, {"id": "GM_EU_376_2014_SEC_2_2__C0007", "cit": "GM 2.2", "seq": 7, "text": "Example: Pilots employed by a European operator as well as self-employed pilots who are pilot-in-command of aircraft used by a European operator are covered under this obligation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0008", "cit": "GM 2.2", "seq": 8, "text": "These designated persons are under a legal obligation to report certain defined occurrences. Without these occurrence reports, the European Union and the organisations and competent authorities that are part of it cannot make the best decisions on safety priorities. In addition, the failure to comply with the reporting legal obligation might have consequences for those required to report (Article "}, {"id": "GM_EU_376_2014_SEC_2_2__C0009", "cit": "GM 2.2", "seq": 9, "text": "It is therefore important to clearly identify the persons that are under the obligation to report occurrences under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0010", "cit": "GM 2.2", "seq": 10, "text": "Furthermore, clarification is necessary to ensure that, where relevant, natural persons already subject to an obligation to report safety occurrences under other European rules (see also section 3.6) are the same than the ones covered under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0011", "cit": "GM 2.2", "seq": 11, "text": "Pilots"}, {"id": "GM_EU_376_2014_SEC_2_2__C0012", "cit": "GM 2.2", "seq": 12, "text": "Key principle Article 4(6)(a) covers both pilots in command operating in the context of commercial air transport as well as private pilots operating on an aircraft covered by the Regulation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0013", "cit": "GM 2.2", "seq": 13, "text": "In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so."}, {"id": "GM_EU_376_2014_SEC_2_2__C0014", "cit": "GM 2.2", "seq": 14, "text": "The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew."}, {"id": "GM_EU_376_2014_SEC_2_2__C0015", "cit": "GM 2.2", "seq": 15, "text": "Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager."}, {"id": "GM_EU_376_2014_SEC_2_2__C0016", "cit": "GM 2.2", "seq": 16, "text": "These situations should be covered and described by organisations within their safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0017", "cit": "GM 2.2", "seq": 17, "text": "Design / manufacturing / airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0018", "cit": "GM 2.2", "seq": 18, "text": "Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certi"}, {"id": "GM_EU_376_2014_SEC_2_2__C0019", "cit": "GM 2.2", "seq": 19, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition."}, {"id": "GM_EU_376_2014_SEC_2_2__C0020", "cit": "GM 2.2", "seq": 20, "text": "Example: A person working in a production organisation being responsible of the investigation, together with the Design Approval Holder (DAH), to confirm if identified deviations of the manufactured product from design data could lead to an unsafe condition of the final certified product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0021", "cit": "GM 2.2", "seq": 21, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions for the holder of a typecertificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair d"}, {"id": "GM_EU_376_2014_SEC_2_2__C0022", "cit": "GM 2.2", "seq": 22, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0023", "cit": "GM 2.2", "seq": 23, "text": "Example: A person working in a DAH having the responsibility to carry out the process to identify unsafe or potential unsafe conditions as per Part-21 requirements under Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0024", "cit": "GM 2.2", "seq": 24, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}, {"qa_id": "QA_0040", "reason": "stratified_unchanged_ARTICLE_test", "cls": "ARTICLE", "qtype": "timeline", "diff": "medium", "split": "test", "audit": "ai_provisional_supported", "question": "What is the timeline for transmitting information about requests to the Commission?", "answer": "The information regarding each request and the action taken must be transmitted in a timely manner to the Commission whenever a request is received and/or action is taken.", "citation": "Article 12(1)", "parent_id": "EU_376_2014_ART_12", "gold": ["EU_376_2014_ART_12__C0002", "EU_376_2014_ART_12__C0001"], "evidence": "EU_376_2014_ART_12__C0002 [Article 12(1)]: That information shall be transmitted in a timely manner to the Commission whenever a request is received and/or action is taken.\nEU_376_2014_ART_12__C0001 [Article 12(1)]: 1.The point of contact shall record each request received and the action taken pursuant to that request.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 1, "vc": 1, "ve": 1, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "no", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R2: L'article 12 (1) n'a rien à voir avec la chronologie (timeline). || R3: Il me semble qu'on peut être plus direct avec des \"timelines\" plus précises (3j pour notifier un évènement, 3mois pour en faire l'analyse, etc) mais à confirmer", "siblings": [{"id": "EU_376_2014_ART_12__C0001", "cit": "Article 12(1)", "seq": 1, "text": "1.The point of contact shall record each request received and the action taken pursuant to that request."}, {"id": "EU_376_2014_ART_12__C0002", "cit": "Article 12(1)", "seq": 2, "text": "That information shall be transmitted in a timely manner to the Commission whenever a request is received and/or action is taken."}, {"id": "EU_376_2014_ART_12__C0003", "cit": "Article 12(2)", "seq": 3, "text": "2.The Commission shall make available the updated list of requests received and action taken by the various points of contact and by the Commission itself to all points of contact."}]}, {"qa_id": "QA_0062", "reason": "exception_record", "cls": "ARTICLE", "qtype": "scope", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "How does Regulation (EU) No 376/2014 interact with rules on access to documents and personal-data protection?", "answer": "Except for the stricter access rules in Articles 10 and 11, Regulation (EU) No 376/2014 applies without prejudice to Regulation (EC) No 1049/2001. It also applies without prejudice to national measures implementing Directive 95/46/EC and in accordance with Regulation (EC) No 45/2001.", "citation": "Article 20(1)-(2)", "parent_id": "EU_376_2014_ART_20", "gold": ["EU_376_2014_ART_20__C0001", "EU_376_2014_ART_20__C0002"], "evidence": "EU_376_2014_ART_20__C0001 [Article 20(1)]: 1.With the exception of Articles 10 and 11, which establish stricter rules on access to the data and information contained in the European Central Repository, this Regulation shall apply without prejudice to Regulation (EC) No 1049/2001.\nEU_376_2014_ART_20__C0002 [Article 20(2)]: 2.This Regulation shall apply without prejudice to national legal acts implementing Directive 95/46/EC and in accordance with Regulation (EC) No 45/2001.", "ai_notes": "The original citation named only paragraph 1 although the answer also relied on paragraph 2.", "n": 4, "va": 0, "vc": 4, "ve": 0, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "no", "contested": "no", "auto": "", "action": "panel wants a correction - you must supply the corrected fields", "comments": "R1: renvoyer à des textes existants ne me paraît pas donner une réponse claire et rapide à la question || R2: L'article 20 fait référence aux articles 10 et 11...difficile de répondre précisément à la question sans ces articles. || R3: Réponse trop vague encore peut-être chercher à plus précisier || R4: expliciter 1049/200, Directive 95/46/EC et 45/2001.", "siblings": [{"id": "EU_376_2014_ART_20__C0001", "cit": "Article 20(1)", "seq": 1, "text": "1.With the exception of Articles 10 and 11, which establish stricter rules on access to the data and information contained in the European Central Repository, this Regulation shall apply without prejudice to Regulation (EC) No 1049/2001."}, {"id": "EU_376_2014_ART_20__C0002", "cit": "Article 20(2)", "seq": 2, "text": "2.This Regulation shall apply without prejudice to national legal acts implementing Directive 95/46/EC and in accordance with Regulation (EC) No 45/2001."}]}, {"qa_id": "QA_0063", "reason": "hybrid_k20_residual", "cls": "ARTICLE", "qtype": "exception", "diff": "easy", "split": "test", "audit": "ai_provisional_supported", "question": "What exceptions are noted in Regulation (EU) No 376/2014?", "answer": "Articles 10 and 11 of Regulation (EU) No 376/2014 establish stricter rules on access to the data and information contained in the European Central Repository, which are exceptions to the general application of the Regulation.", "citation": "Article 20(1)", "parent_id": "EU_376_2014_ART_20", "gold": ["EU_376_2014_ART_20__C0001"], "evidence": "EU_376_2014_ART_20__C0001 [Article 20(1)]: 1.With the exception of Articles 10 and 11, which establish stricter rules on access to the data and information contained in the European Central Repository, this Regulation shall apply without prejudice to Regulation (EC) No 1049/2001.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 4, "va": 0, "vc": 2, "ve": 2, "agg_q1": "no", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "no", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R1: What exceptions are noted in Regulation (EU) No 376/2014? --> concerne uniquement l'accès aux doc et à la protection des données. La question ne précise pas cela3 || R2: voir réponse précédente sur ce même article. || R3: Pas sûr d'avoir compris< l'intérêt de cette question || R4: expliciter question", "siblings": [{"id": "EU_376_2014_ART_20__C0001", "cit": "Article 20(1)", "seq": 1, "text": "1.With the exception of Articles 10 and 11, which establish stricter rules on access to the data and information contained in the European Central Repository, this Regulation shall apply without prejudice to Regulation (EC) No 1049/2001."}, {"id": "EU_376_2014_ART_20__C0002", "cit": "Article 20(2)", "seq": 2, "text": "2.This Regulation shall apply without prejudice to national legal acts implementing Directive 95/46/EC and in accordance with Regulation (EC) No 45/2001."}]}, {"qa_id": "QA_0071", "reason": "stratified_unchanged_ANNEX_test", "cls": "ANNEX", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_provisional_supported", "question": "What must organisations, Member States, and the Agency ensure when entering occurrence reports in their databases?", "answer": "They must ensure that occurrence reports recorded in their databases contain at least the common mandatory data fields, which include information such as Headline, Filing Information, Date, Location, Classification, Narrative, Events, and Risk classification. This applies to both mandatorily reported and, to the best extent possible, voluntarily reported occurrences.", "citation": "Section 1", "parent_id": "EU_376_2014_ANNEX_I", "gold": ["EU_376_2014_ANNEX_I__C0003"], "evidence": "EU_376_2014_ANNEX_I__C0003 [Annex I, item 1]: When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 4, "va": 1, "vc": 3, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R1: qu'entends-tu par \"section 1\" ? || R2: Il faut préciser les champs olbigatoires. Ex: \"Filling information\" => Responsible entity, File number, Occurence Status. || R4: question plus explicite sur la qualité des données. réponse plus explicite en fournissant la liste des 13 champs communs obligatoires.", "siblings": [{"id": "EU_376_2014_ANNEX_I__C0001", "cit": "Annex I", "seq": 1, "text": "Note: The data fields must be completed with the information requested. If it is not possible for the competent authorities of the Member States or the Agency to include that information because it has not been provided by the organisation or the reporter, the data field may be completed with the value ‘unknown’. However, with a view to ensuring that the appropriate information is transmitted, use"}, {"id": "EU_376_2014_ANNEX_I__C0002", "cit": "Annex I, item 1", "seq": 2, "text": "1.COMMON MANDATORY DATA FIELDS"}, {"id": "EU_376_2014_ANNEX_I__C0003", "cit": "Annex I, item 1", "seq": 3, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0004", "cit": "Annex I, item 1.1", "seq": 4, "text": "(1)Headline"}, {"id": "EU_376_2014_ANNEX_I__C0005", "cit": "Annex I, item 1.1", "seq": 5, "text": "Headline"}, {"id": "EU_376_2014_ANNEX_I__C0006", "cit": "Annex I, item 1.2", "seq": 6, "text": "(2)Filing Information"}, {"id": "EU_376_2014_ANNEX_I__C0007", "cit": "Annex I, item 1.2", "seq": 7, "text": "Responsible Entity"}, {"id": "EU_376_2014_ANNEX_I__C0008", "cit": "Annex I, item 1.2", "seq": 8, "text": "File Number"}, {"id": "EU_376_2014_ANNEX_I__C0009", "cit": "Annex I, item 1.2", "seq": 9, "text": "Occurrence Status"}, {"id": "EU_376_2014_ANNEX_I__C0010", "cit": "Annex I, item 1.3", "seq": 10, "text": "(3)When"}, {"id": "EU_376_2014_ANNEX_I__C0011", "cit": "Annex I, item 1.3", "seq": 11, "text": "UTC Date"}, {"id": "EU_376_2014_ANNEX_I__C0012", "cit": "Annex I, item 1.4", "seq": 12, "text": "(4)Where"}, {"id": "EU_376_2014_ANNEX_I__C0013", "cit": "Annex I, item 1.4", "seq": 13, "text": "State/Area of Occurrence"}, {"id": "EU_376_2014_ANNEX_I__C0014", "cit": "Annex I, item 1.4", "seq": 14, "text": "Location of Occurrence"}, {"id": "EU_376_2014_ANNEX_I__C0015", "cit": "Annex I, item 1.5", "seq": 15, "text": "(5)Classification"}, {"id": "EU_376_2014_ANNEX_I__C0016", "cit": "Annex I, item 1.5", "seq": 16, "text": "Occurrence Class"}, {"id": "EU_376_2014_ANNEX_I__C0017", "cit": "Annex I, item 1.5", "seq": 17, "text": "Occurrence Category"}, {"id": "EU_376_2014_ANNEX_I__C0018", "cit": "Annex I, item 1.6", "seq": 18, "text": "(6)Narrative"}, {"id": "EU_376_2014_ANNEX_I__C0019", "cit": "Annex I, item 1.6", "seq": 19, "text": "Narrative Language"}, {"id": "EU_376_2014_ANNEX_I__C0020", "cit": "Annex I, item 1.6", "seq": 20, "text": "Narrative"}, {"id": "EU_376_2014_ANNEX_I__C0021", "cit": "Annex I, item 1.7", "seq": 21, "text": "(7)Events"}, {"id": "EU_376_2014_ANNEX_I__C0022", "cit": "Annex I, item 1.7", "seq": 22, "text": "Event Type"}, {"id": "EU_376_2014_ANNEX_I__C0023", "cit": "Annex I, item 1.8", "seq": 23, "text": "(8)Risk classification"}, {"id": "EU_376_2014_ANNEX_I__C0024", "cit": "Annex I, item 2", "seq": 24, "text": "2.SPECIFIC MANDATORY DATA FIELDS"}, {"id": "EU_376_2014_ANNEX_I__C0025", "cit": "Annex I, item 2.1", "seq": 25, "text": "2.1.Aircraft-related data fields"}, {"id": "EU_376_2014_ANNEX_I__C0026", "cit": "Annex I, item 2.1", "seq": 26, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0027", "cit": "Annex I, item 2.1.1", "seq": 27, "text": "(1)Aircraft Identification"}, {"id": "EU_376_2014_ANNEX_I__C0028", "cit": "Annex I, item 2.1.1", "seq": 28, "text": "State of Registry"}, {"id": "EU_376_2014_ANNEX_I__C0029", "cit": "Annex I, item 2.1.1", "seq": 29, "text": "Make/Model/Series"}, {"id": "EU_376_2014_ANNEX_I__C0030", "cit": "Annex I, item 2.1.1", "seq": 30, "text": "Aircraft serial number"}, {"id": "EU_376_2014_ANNEX_I__C0031", "cit": "Annex I, item 2.1.1", "seq": 31, "text": "Aircraft Registration"}, {"id": "EU_376_2014_ANNEX_I__C0032", "cit": "Annex I, item 2.1.1", "seq": 32, "text": "Call sign"}, {"id": "EU_376_2014_ANNEX_I__C0033", "cit": "Annex I, item 2.1.2", "seq": 33, "text": "(2)Aircraft Operation"}, {"id": "EU_376_2014_ANNEX_I__C0034", "cit": "Annex I, item 2.1.2", "seq": 34, "text": "Operator"}, {"id": "EU_376_2014_ANNEX_I__C0035", "cit": "Annex I, item 2.1.2", "seq": 35, "text": "Type of operation"}, {"id": "EU_376_2014_ANNEX_I__C0036", "cit": "Annex I, item 2.1.3", "seq": 36, "text": "(3)Aircraft Description"}, {"id": "EU_376_2014_ANNEX_I__C0037", "cit": "Annex I, item 2.1.3", "seq": 37, "text": "Aircraft Category"}, {"id": "EU_376_2014_ANNEX_I__C0038", "cit": "Annex I, item 2.1.3", "seq": 38, "text": "Propulsion Type"}, {"id": "EU_376_2014_ANNEX_I__C0039", "cit": "Annex I, item 2.1.3", "seq": 39, "text": "Mass Group"}, {"id": "EU_376_2014_ANNEX_I__C0040", "cit": "Annex I, item 2.1.4", "seq": 40, "text": "(4)History of Flight"}, {"id": "EU_376_2014_ANNEX_I__C0041", "cit": "Annex I, item 2.1.4", "seq": 41, "text": "Last Departure Point"}, {"id": "EU_376_2014_ANNEX_I__C0042", "cit": "Annex I, item 2.1.4", "seq": 42, "text": "Planned Destination"}, {"id": "EU_376_2014_ANNEX_I__C0043", "cit": "Annex I, item 2.1.4", "seq": 43, "text": "Flight Phase"}, {"id": "EU_376_2014_ANNEX_I__C0044", "cit": "Annex I, item 2.1.5", "seq": 44, "text": "(5)Weather"}, {"id": "EU_376_2014_ANNEX_I__C0045", "cit": "Annex I, item 2.1.5", "seq": 45, "text": "Weather relevant"}, {"id": "EU_376_2014_ANNEX_I__C0046", "cit": "Annex I, item 2.2", "seq": 46, "text": "2.2.Data fields relating to air navigation services"}, {"id": "EU_376_2014_ANNEX_I__C0047", "cit": "Annex I, item 2.2", "seq": 47, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0048", "cit": "Annex I, item 2.2.1", "seq": 48, "text": "(1)ATM relation"}, {"id": "EU_376_2014_ANNEX_I__C0049", "cit": "Annex I, item 2.2.1", "seq": 49, "text": "ATM contribution"}, {"id": "EU_376_2014_ANNEX_I__C0050", "cit": "Annex I, item 2.2.1", "seq": 50, "text": "Service affected (effect on ATM service)"}, {"id": "EU_376_2014_ANNEX_I__C0051", "cit": "Annex I, item 2.2.2", "seq": 51, "text": "(2)ATS Unit Name"}, {"id": "EU_376_2014_ANNEX_I__C0052", "cit": "Annex I, item 2.2.1", "seq": 52, "text": "2.2.1.Separation Minima Infringement/Loss of Separation and Airspace Infringementrelated data fields"}, {"id": "EU_376_2014_ANNEX_I__C0053", "cit": "Annex I, item 2.2.1", "seq": 53, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0054", "cit": "Annex I, item 2.2.1.1", "seq": 54, "text": "(1)Airspace"}, {"id": "EU_376_2014_ANNEX_I__C0055", "cit": "Annex I, item 2.2.1.1", "seq": 55, "text": "Airspace type"}, {"id": "EU_376_2014_ANNEX_I__C0056", "cit": "Annex I, item 2.2.1.1", "seq": 56, "text": "Airspace class"}, {"id": "EU_376_2014_ANNEX_I__C0057", "cit": "Annex I, item 2.2.1.1", "seq": 57, "text": "FIR/UIR name"}, {"id": "EU_376_2014_ANNEX_I__C0058", "cit": "Annex I, item 2.3", "seq": 58, "text": "2.3.Aerodrome-related data fields"}, {"id": "EU_376_2014_ANNEX_I__C0059", "cit": "Annex I, item 2.3", "seq": 59, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0060", "cit": "Annex I, item 2.3.1", "seq": 60, "text": "(1)Location Indicator (ICAO indicator of the airport)"}, {"id": "EU_376_2014_ANNEX_I__C0061", "cit": "Annex I, item 2.3.2", "seq": 61, "text": "(2)Location on the aerodrome"}, {"id": "EU_376_2014_ANNEX_I__C0062", "cit": "Annex I, item 2.4", "seq": 62, "text": "2.4.Aircraft damage or personal injury-related data fields"}, {"id": "EU_376_2014_ANNEX_I__C0063", "cit": "Annex I, item 2.4", "seq": 63, "text": "When entering, in their respective databases, information on every occurrence mandatorily reported and, to the best extent possible, every occurrence voluntarily reported, organisations, Member States and the Agency must ensure that occurrence reports recorded in their databases contain at least the following information:"}, {"id": "EU_376_2014_ANNEX_I__C0064", "cit": "Annex I, item 2.4.1", "seq": 64, "text": "(1)Severity"}, {"id": "EU_376_2014_ANNEX_I__C0065", "cit": "Annex I, item 2.4.1", "seq": 65, "text": "Highest Damage"}, {"id": "EU_376_2014_ANNEX_I__C0066", "cit": "Annex I, item 2.4.1", "seq": 66, "text": "Injury Level"}, {"id": "EU_376_2014_ANNEX_I__C0067", "cit": "Annex I, item 2.4.2", "seq": 67, "text": "(2)Injuries to persons"}, {"id": "EU_376_2014_ANNEX_I__C0068", "cit": "Annex I, item 2.4.2", "seq": 68, "text": "Number of injuries on ground (fatal, serious, minor)"}, {"id": "EU_376_2014_ANNEX_I__C0069", "cit": "Annex I, item 2.4.2", "seq": 69, "text": "Number of injuries on aircraft (fatal, serious, minor)"}]}, {"qa_id": "QA_0081", "reason": "stratified_unchanged_ANNEX_test", "cls": "ANNEX", "qtype": "scope", "diff": "medium", "split": "test", "audit": "ai_provisional_supported", "question": "What is included in the category of 'Take-off and landing' occurrences?", "answer": "The 'Take-off and landing' category includes occurrences such as taxiway or runway excursions, rejected take-offs, and inability to achieve required performance during take-off or landing. It also covers incidents like incorrect configuration settings during take-off or landing.", "citation": "ANNEX I, 1.3", "parent_id": "EU_2015_1018_ANNEX_I", "gold": ["EU_2015_1018_ANNEX_I__C0014", "EU_2015_1018_ANNEX_I__C0015"], "evidence": "EU_2015_1018_ANNEX_I__C0014 [Annex I, item 1.3.5]: (5)Inability to achieve required or expected performance during take-off, go-around or landing.\nEU_2015_1018_ANNEX_I__C0015 [Annex I, item 1.3.6]: (6)Actual or attempted take-off, approach or landing with incorrect configuration setting.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 2, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R4: terme catégorie ambigu dans la question. réponse non exhaustive", "siblings": [{"id": "EU_2015_1018_ANNEX_I__C0001", "cit": "Annex I", "seq": 1, "text": "Remark: This Annex is structured in such a way that the pertinent occurrences are linked with categories of activities during which they are normally observed, according to experience, in order to facilitate the reporting of those occurrences. However, this presentation must not be understood as meaning that occurrences must not be reported in case they take place outside the category of activitie"}, {"id": "EU_2015_1018_ANNEX_I__C0002", "cit": "Annex I, item 1", "seq": 2, "text": "1.AIR OPERATIONS"}, {"id": "EU_2015_1018_ANNEX_I__C0003", "cit": "Annex I, item 1.1", "seq": 3, "text": "1.1.Flight preparation"}, {"id": "EU_2015_1018_ANNEX_I__C0004", "cit": "Annex I, item 1.1.1", "seq": 4, "text": "(1)Use of incorrect data or erroneous entries into equipment used for navigation or performance calculations which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0005", "cit": "Annex I, item 1.1.2", "seq": 5, "text": "(2)Carriage or attempted carriage of dangerous goods in contravention of applicable legislations including incorrect labelling, packaging and handling of dangerous goods."}, {"id": "EU_2015_1018_ANNEX_I__C0006", "cit": "Annex I, item 1.2", "seq": 6, "text": "1.2.Aircraft preparation"}, {"id": "EU_2015_1018_ANNEX_I__C0007", "cit": "Annex I, item 1.2.1", "seq": 7, "text": "(1)Incorrect fuel type or contaminated fuel."}, {"id": "EU_2015_1018_ANNEX_I__C0008", "cit": "Annex I, item 1.2.2", "seq": 8, "text": "(2)Missing, incorrect or inadequate De-icing/Anti-icing treatment."}, {"id": "EU_2015_1018_ANNEX_I__C0009", "cit": "Annex I, item 1.3", "seq": 9, "text": "1.3.Take-off and landing"}, {"id": "EU_2015_1018_ANNEX_I__C0010", "cit": "Annex I, item 1.3.1", "seq": 10, "text": "(1)Taxiway or runway excursion."}, {"id": "EU_2015_1018_ANNEX_I__C0011", "cit": "Annex I, item 1.3.2", "seq": 11, "text": "(2)Actual or potential taxiway or runway incursion."}, {"id": "EU_2015_1018_ANNEX_I__C0012", "cit": "Annex I, item 1.3.3", "seq": 12, "text": "(3)Final Approach and Take-off Area (FATO) incursion."}, {"id": "EU_2015_1018_ANNEX_I__C0013", "cit": "Annex I, item 1.3.4", "seq": 13, "text": "(4)Any rejected take-off."}, {"id": "EU_2015_1018_ANNEX_I__C0014", "cit": "Annex I, item 1.3.5", "seq": 14, "text": "(5)Inability to achieve required or expected performance during take-off, go-around or landing."}, {"id": "EU_2015_1018_ANNEX_I__C0015", "cit": "Annex I, item 1.3.6", "seq": 15, "text": "(6)Actual or attempted take-off, approach or landing with incorrect configuration setting."}, {"id": "EU_2015_1018_ANNEX_I__C0016", "cit": "Annex I, item 1.3.7", "seq": 16, "text": "(7)Tail, blade/wingtip or nacelle strike during take-off or landing."}, {"id": "EU_2015_1018_ANNEX_I__C0017", "cit": "Annex I, item 1.3.8", "seq": 17, "text": "(8)Approach continued against air operator stabilised approach criteria."}, {"id": "EU_2015_1018_ANNEX_I__C0018", "cit": "Annex I, item 1.3.9", "seq": 18, "text": "(9)Continuation of an instrument approach below published minimums with inadequate visual references."}, {"id": "EU_2015_1018_ANNEX_I__C0019", "cit": "Annex I, item 1.3.10", "seq": 19, "text": "(10)Precautionary or forced landing."}, {"id": "EU_2015_1018_ANNEX_I__C0020", "cit": "Annex I, item 1.3.11", "seq": 20, "text": "(11)Short and long landing."}, {"id": "EU_2015_1018_ANNEX_I__C0021", "cit": "Annex I, item 1.3.12", "seq": 21, "text": "(12)Hard landing."}, {"id": "EU_2015_1018_ANNEX_I__C0022", "cit": "Annex I, item 1.4", "seq": 22, "text": "1.4.Any phase of flight"}, {"id": "EU_2015_1018_ANNEX_I__C0023", "cit": "Annex I, item 1.4.1", "seq": 23, "text": "(1)Loss of control."}, {"id": "EU_2015_1018_ANNEX_I__C0024", "cit": "Annex I, item 1.4.2", "seq": 24, "text": "(2)Aircraft upset, exceeding normal pitch attitude, bank angle or airspeed inappropriate for the conditions."}, {"id": "EU_2015_1018_ANNEX_I__C0025", "cit": "Annex I, item 1.4.3", "seq": 25, "text": "(3)Level bust."}, {"id": "EU_2015_1018_ANNEX_I__C0026", "cit": "Annex I, item 1.4.4", "seq": 26, "text": "(4)Activation of any flight envelope protection, including stall warning, stick shaker, stick pusher and automatic protections."}, {"id": "EU_2015_1018_ANNEX_I__C0027", "cit": "Annex I, item 1.4.5", "seq": 27, "text": "(5)Unintentional deviation from intended or assigned track of the lowest of twice the required navigation performance or 10 nautical miles."}, {"id": "EU_2015_1018_ANNEX_I__C0028", "cit": "Annex I, item 1.4.6", "seq": 28, "text": "(6)Exceedance of aircraft flight manual limitation."}, {"id": "EU_2015_1018_ANNEX_I__C0029", "cit": "Annex I, item 1.4.7", "seq": 29, "text": "(7)Operation with incorrect altimeter setting."}, {"id": "EU_2015_1018_ANNEX_I__C0030", "cit": "Annex I, item 1.4.8", "seq": 30, "text": "(8)Jet blast or rotor and prop wash occurrences which have or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0031", "cit": "Annex I, item 1.4.9", "seq": 31, "text": "(9)Misinterpretation of automation mode or of any flight deck information provided to the flight crew which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0032", "cit": "Annex I, item 1.5", "seq": 32, "text": "1.5.Other types of occurrences"}, {"id": "EU_2015_1018_ANNEX_I__C0033", "cit": "Annex I, item 1.5.1", "seq": 33, "text": "(1)Unintentional release of cargo or other externally carried equipment."}, {"id": "EU_2015_1018_ANNEX_I__C0034", "cit": "Annex I, item 1.5.2", "seq": 34, "text": "(2)Loss of situational awareness (including environmental, mode and system awareness, spatial disorientation, and time horizon)."}, {"id": "EU_2015_1018_ANNEX_I__C0035", "cit": "Annex I, item 1.5.3", "seq": 35, "text": "(3)Any occurrence where the human performance has directly contributed to or could have contributed to an accident or a serious incident."}, {"id": "EU_2015_1018_ANNEX_I__C0036", "cit": "Annex I, item 2", "seq": 36, "text": "2.TECHNICAL OCCURRENCES"}, {"id": "EU_2015_1018_ANNEX_I__C0037", "cit": "Annex I, item 2.1", "seq": 37, "text": "2.1.Structure and systems"}, {"id": "EU_2015_1018_ANNEX_I__C0038", "cit": "Annex I, item 2.1.1", "seq": 38, "text": "(1)Loss of any part of the aircraft structure in flight."}, {"id": "EU_2015_1018_ANNEX_I__C0039", "cit": "Annex I, item 2.1.2", "seq": 39, "text": "(2)Loss of a system."}, {"id": "EU_2015_1018_ANNEX_I__C0040", "cit": "Annex I, item 2.1.3", "seq": 40, "text": "(3)Loss of redundancy of a system."}, {"id": "EU_2015_1018_ANNEX_I__C0041", "cit": "Annex I, item 2.1.4", "seq": 41, "text": "(4)Leakage of any fluid which resulted in a fire hazard or possible hazardous contamination of aircraft structure, systems or equipment, or which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0042", "cit": "Annex I, item 2.1.5", "seq": 42, "text": "(5)Fuel system malfunctions or defects, which had an effect on fuel supply and/or distribution."}, {"id": "EU_2015_1018_ANNEX_I__C0043", "cit": "Annex I, item 2.1.6", "seq": 43, "text": "(6)Malfunction or defect of any indication system when this results in misleading indications to the crew."}, {"id": "EU_2015_1018_ANNEX_I__C0044", "cit": "Annex I, item 2.1.7", "seq": 44, "text": "(7)Abnormal functioning of flight controls such as asymmetric or stuck/jammed flight controls (for example: lift (flaps/slats), drag (spoilers), attitude control (ailerons, elevators, rudder) devices)."}, {"id": "EU_2015_1018_ANNEX_I__C0045", "cit": "Annex I, item 2.2", "seq": 45, "text": "2.2.Propulsion (including engines, propellers and rotor systems) and auxiliary power units (APUs)"}, {"id": "EU_2015_1018_ANNEX_I__C0046", "cit": "Annex I, item 2.2.1", "seq": 46, "text": "(1)Failure or significant malfunction of any part or controlling of a propeller, rotor or powerplant."}, {"id": "EU_2015_1018_ANNEX_I__C0047", "cit": "Annex I, item 2.2.2", "seq": 47, "text": "(2)Damage to or failure of main/tail rotor or transmission and/or equivalent systems."}, {"id": "EU_2015_1018_ANNEX_I__C0048", "cit": "Annex I, item 2.2.3", "seq": 48, "text": "(3)Flameout, in-flight shutdown of any engine or APU when required (for example: ETOPS (Extended range Twin engine aircraft Operations), MEL (Minimum Equipment List))."}, {"id": "EU_2015_1018_ANNEX_I__C0049", "cit": "Annex I, item 2.2.4", "seq": 49, "text": "(4)Engine operating limitation exceedance, including overspeed or inability to control the speed of any high-speed rotating component (for example: APU, air starter, air cycle machine, air turbine motor, propeller or rotor)."}, {"id": "EU_2015_1018_ANNEX_I__C0050", "cit": "Annex I, item 2.2.5", "seq": 50, "text": "(5)Failure or malfunction of any part of an engine, powerplant, APU or transmission resulting in any one or more of the following:"}, {"id": "EU_2015_1018_ANNEX_I__C0051", "cit": "Annex I, item 2.2.5.a", "seq": 51, "text": "(a)thrust-reversing system failing to operate as commanded;"}, {"id": "EU_2015_1018_ANNEX_I__C0052", "cit": "Annex I, item 2.2.5.a.b", "seq": 52, "text": "(b)inability to control power, thrust or rpm (revolutions per minute);"}, {"id": "EU_2015_1018_ANNEX_I__C0053", "cit": "Annex I, item 2.2.5.a.b.c", "seq": 53, "text": "(c)non-containment of components/debris."}, {"id": "EU_2015_1018_ANNEX_I__C0054", "cit": "Annex I, item 3", "seq": 54, "text": "3.INTERACTION WITH AIR NAVIGATION SERVICES (ANS) AND AIR TRAFFIC MANAGEMENT (ATM)"}, {"id": "EU_2015_1018_ANNEX_I__C0055", "cit": "Annex I, item 3.1", "seq": 55, "text": "(1)Unsafe ATC (Air Traffic Control) clearance."}, {"id": "EU_2015_1018_ANNEX_I__C0056", "cit": "Annex I, item 3.2", "seq": 56, "text": "(2)Prolonged loss of communication with ATS (Air Traffic Service) or ATM Unit."}, {"id": "EU_2015_1018_ANNEX_I__C0057", "cit": "Annex I, item 3.3", "seq": 57, "text": "(3)Conflicting instructions from different ATS Units potentially leading to a loss of separation."}, {"id": "EU_2015_1018_ANNEX_I__C0058", "cit": "Annex I, item 3.4", "seq": 58, "text": "(4)Misinterpretation of radio-communication which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0059", "cit": "Annex I, item 3.5", "seq": 59, "text": "(5)Intentional deviation from ATC instruction which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0060", "cit": "Annex I, item 4", "seq": 60, "text": "4.EMERGENCIES AND OTHER CRITICAL SITUATIONS"}, {"id": "EU_2015_1018_ANNEX_I__C0061", "cit": "Annex I, item 4.1", "seq": 61, "text": "(1)Any event leading to the declaration of an emergency (‘Mayday’ or ‘PAN call’)."}, {"id": "EU_2015_1018_ANNEX_I__C0062", "cit": "Annex I, item 4.2", "seq": 62, "text": "(2)Any burning, melting, smoke, fumes, arcing, overheating, fire or explosion."}, {"id": "EU_2015_1018_ANNEX_I__C0063", "cit": "Annex I, item 4.3", "seq": 63, "text": "(3)Contaminated air in the cockpit or in the passenger compartment which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0064", "cit": "Annex I, item 4.4", "seq": 64, "text": "(4)Failure to apply the correct non-normal or emergency procedure by the flight or cabin crew to deal with an emergency."}, {"id": "EU_2015_1018_ANNEX_I__C0065", "cit": "Annex I, item 4.5", "seq": 65, "text": "(5)Use of any emergency equipment or non-normal procedure affecting in-flight or landing performance."}, {"id": "EU_2015_1018_ANNEX_I__C0066", "cit": "Annex I, item 4.6", "seq": 66, "text": "(6)Failure of any emergency or rescue system or equipment which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0067", "cit": "Annex I, item 4.7", "seq": 67, "text": "(7)Uncontrollable cabin pressure."}, {"id": "EU_2015_1018_ANNEX_I__C0068", "cit": "Annex I, item 4.8", "seq": 68, "text": "(8)Critically low fuel quantity or fuel quantity at destination below required final reserve fuel."}, {"id": "EU_2015_1018_ANNEX_I__C0069", "cit": "Annex I, item 4.9", "seq": 69, "text": "(9)Any use of crew oxygen system by the crew."}, {"id": "EU_2015_1018_ANNEX_I__C0070", "cit": "Annex I, item 4.10", "seq": 70, "text": "(10)Incapacitation of any member of the flight or cabin crew that results in the reduction below the minimum certified crew complement."}, {"id": "EU_2015_1018_ANNEX_I__C0071", "cit": "Annex I, item 4.11", "seq": 71, "text": "(11)Crew fatigue impacting or potentially impacting their ability to perform safely their flight duties."}, {"id": "EU_2015_1018_ANNEX_I__C0072", "cit": "Annex I, item 5", "seq": 72, "text": "5.EXTERNAL ENVIRONMENT AND METEOROLOGY"}, {"id": "EU_2015_1018_ANNEX_I__C0073", "cit": "Annex I, item 5.1", "seq": 73, "text": "(1)A collision or a near collision on the ground or in the air, with another aircraft, terrain or obstacle ()."}, {"id": "EU_2015_1018_ANNEX_I__C0074", "cit": "Annex I, item 5.2", "seq": 74, "text": "(2)ACAS RA (Airborne Collision Avoidance System, Resolution Advisory)."}, {"id": "EU_2015_1018_ANNEX_I__C0075", "cit": "Annex I, item 5.3", "seq": 75, "text": "(3)Activation of genuine ground collision system such as GPWS (Ground Proximity Warning System)/TAWS (Terrain Awareness and Warning System) ‘warning’."}, {"id": "EU_2015_1018_ANNEX_I__C0076", "cit": "Annex I, item 5.4", "seq": 76, "text": "(4)Wildlife strike including bird strike."}, {"id": "EU_2015_1018_ANNEX_I__C0077", "cit": "Annex I, item 5.5", "seq": 77, "text": "(5)Foreign object damage/debris (FOD)."}, {"id": "EU_2015_1018_ANNEX_I__C0078", "cit": "Annex I, item 5.6", "seq": 78, "text": "(6)Unexpected encounter of poor runway surface conditions."}, {"id": "EU_2015_1018_ANNEX_I__C0079", "cit": "Annex I, item 5.7", "seq": 79, "text": "(7)Wake-turbulence encounters."}, {"id": "EU_2015_1018_ANNEX_I__C0080", "cit": "Annex I, item 5.8", "seq": 80, "text": "(8)Interference with the aircraft by firearms, fireworks, flying kites, laser illumination, high powered lights, lasers, Remotely Piloted Aircraft Systems, model aircraft or by similar means."}, {"id": "EU_2015_1018_ANNEX_I__C0081", "cit": "Annex I, item 5.9", "seq": 81, "text": "(9)A lightning strike which resulted in damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0082", "cit": "Annex I, item 5.10", "seq": 82, "text": "(10)A hail encounter which resulted in damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0083", "cit": "Annex I, item 5.11", "seq": 83, "text": "(11)Severe turbulence encounter or any encounter resulting in injury to occupants or deemed to require a ‘turbulence check’ of the aircraft."}, {"id": "EU_2015_1018_ANNEX_I__C0084", "cit": "Annex I, item 5.12", "seq": 84, "text": "(12)A significant wind shear or thunderstorm encounter which has or could have endangered the aircraft, its occupants or any other person."}, {"id": "EU_2015_1018_ANNEX_I__C0085", "cit": "Annex I, item 5.13", "seq": 85, "text": "(13)Icing encounter resulting in handling difficulties, damage to the aircraft or loss or malfunction of any aircraft system."}, {"id": "EU_2015_1018_ANNEX_I__C0086", "cit": "Annex I, item 5.14", "seq": 86, "text": "(14)Volcanic ash encounter."}, {"id": "EU_2015_1018_ANNEX_I__C0087", "cit": "Annex I, item 6", "seq": 87, "text": "6.SECURITY"}, {"id": "EU_2015_1018_ANNEX_I__C0088", "cit": "Annex I, item 6.1", "seq": 88, "text": "(1)Bomb threat or hijack."}, {"id": "EU_2015_1018_ANNEX_I__C0089", "cit": "Annex I, item 6.2", "seq": 89, "text": "(2)Difficulty in controlling intoxicated, violent or unruly passengers."}, {"id": "EU_2015_1018_ANNEX_I__C0090", "cit": "Annex I, item 6.3", "seq": 90, "text": "(3)Discovery of a stowaway."}]}, {"qa_id": "QA_0083", "reason": "exception_record", "cls": "ANNEX", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "Which maintenance-related occurrence is listed in Annex II, item 3.14?", "answer": "The listed occurrence is releasing an aircraft to service from maintenance where there is non-compliance that endangers flight safety.", "citation": "Annex II, item 3.14", "parent_id": "EU_2015_1018_ANNEX_II", "gold": ["EU_2015_1018_ANNEX_II__C0022"], "evidence": "EU_2015_1018_ANNEX_II__C0022 [Annex II, item 3.14]: (14)Releasing an aircraft to service from maintenance in case of any non-compliance which endangers the flight safety.", "ai_notes": "The source identifies a reportable occurrence; it does not itself formulate a release-to-service prohibition.", "n": 4, "va": 1, "vc": 2, "ve": 1, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "no", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R1: qu'entends-tu par \"Annex II, item 3.14\" ? || R4: la question fait référence au 2015/1018 et non au 376/2014", "siblings": [{"id": "EU_2015_1018_ANNEX_II__C0001", "cit": "Annex II, item 1", "seq": 1, "text": "1.MANUFACTURING"}, {"id": "EU_2015_1018_ANNEX_II__C0002", "cit": "Annex II, item 1", "seq": 2, "text": "Products, parts or appliances released from the production organisation with deviations from applicable design data that could lead to a potential unsafe condition as identified with the holder of the type-certificate or design approval."}, {"id": "EU_2015_1018_ANNEX_II__C0003", "cit": "Annex II, item 2", "seq": 3, "text": "2.DESIGN"}, {"id": "EU_2015_1018_ANNEX_II__C0004", "cit": "Annex II, item 2", "seq": 4, "text": "Any failure, malfunction, defect or other occurrence related to a product, part, or appliance which has resulted in or may result in an unsafe condition."}, {"id": "EU_2015_1018_ANNEX_II__C0005", "cit": "Annex II, item 2", "seq": 5, "text": "Remark: This list is applicable to occurrences occurring on a product, part, or appliance covered by the type-certificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair design approval or any other relevant approval deemed to have been issued under Commission Regulation (EU) No 748/2012 ()."}, {"id": "EU_2015_1018_ANNEX_II__C0006", "cit": "Annex II, item 3", "seq": 6, "text": "3.MAINTENANCE AND CONTINUING AIRWORTHINESS MANAGEMENT"}, {"id": "EU_2015_1018_ANNEX_II__C0007", "cit": "Annex II, item 3.1", "seq": 7, "text": "(1)Serious structural damage (for example: cracks, permanent deformation, delamination, debonding, burning, excessive wear, or corrosion) found during maintenance of the aircraft or component."}, {"id": "EU_2015_1018_ANNEX_II__C0008", "cit": "Annex II, item 3.2", "seq": 8, "text": "(2)Serious leakage or contamination of fluids (for example: hydraulic, fuel, oil, gas or other fluids)."}, {"id": "EU_2015_1018_ANNEX_II__C0009", "cit": "Annex II, item 3.3", "seq": 9, "text": "(3)Failure or malfunction of any part of an engine or powerplant and/or transmission resulting in any one or more of the following:"}, {"id": "EU_2015_1018_ANNEX_II__C0010", "cit": "Annex II, item 3.3.a", "seq": 10, "text": "(a)non-containment of components/debris;"}, {"id": "EU_2015_1018_ANNEX_II__C0011", "cit": "Annex II, item 3.3.b", "seq": 11, "text": "(b)failure of the engine mount structure."}, {"id": "EU_2015_1018_ANNEX_II__C0012", "cit": "Annex II, item 3.4", "seq": 12, "text": "(4)Damage, failure or defect of propeller, which could lead to in-flight separation of the propeller or any major portion of the propeller and/or malfunctions of the propeller control."}, {"id": "EU_2015_1018_ANNEX_II__C0013", "cit": "Annex II, item 3.5", "seq": 13, "text": "(5)Damage, failure or defect of main rotor gearbox/attachment, which could lead to in-flight separation of the rotor assembly and/or malfunctions of the rotor control."}, {"id": "EU_2015_1018_ANNEX_II__C0014", "cit": "Annex II, item 3.6", "seq": 14, "text": "(6)Significant malfunction of a safety-critical system or equipment including emergency system or equipment during maintenance testing or failure to activate these systems after maintenance."}, {"id": "EU_2015_1018_ANNEX_II__C0015", "cit": "Annex II, item 3.7", "seq": 15, "text": "(7)Incorrect assembly or installation of components of the aircraft found during an inspection or test procedure not intended for that specific purpose."}, {"id": "EU_2015_1018_ANNEX_II__C0016", "cit": "Annex II, item 3.8", "seq": 16, "text": "(8)Wrong assessment of a serious defect, or serious non-compliance with MEL and Technical logbook procedures."}, {"id": "EU_2015_1018_ANNEX_II__C0017", "cit": "Annex II, item 3.9", "seq": 17, "text": "(9)Serious damage to Electrical Wiring Interconnection System (EWIS)."}, {"id": "EU_2015_1018_ANNEX_II__C0018", "cit": "Annex II, item 3.10", "seq": 18, "text": "(10)Any defect in a life-controlled critical part causing retirement before completion of its full life."}, {"id": "EU_2015_1018_ANNEX_II__C0019", "cit": "Annex II, item 3.11", "seq": 19, "text": "(11)The use of products, components or materials, from unknown, suspect origin, or unserviceable critical components."}, {"id": "EU_2015_1018_ANNEX_II__C0020", "cit": "Annex II, item 3.12", "seq": 20, "text": "(12)Misleading, incorrect or insufficient applicable maintenance data or procedures that could lead to significant maintenance errors, including language issue."}, {"id": "EU_2015_1018_ANNEX_II__C0021", "cit": "Annex II, item 3.13", "seq": 21, "text": "(13)Incorrect control or application of aircraft maintenance limitations or scheduled maintenance."}, {"id": "EU_2015_1018_ANNEX_II__C0022", "cit": "Annex II, item 3.14", "seq": 22, "text": "(14)Releasing an aircraft to service from maintenance in case of any non-compliance which endangers the flight safety."}, {"id": "EU_2015_1018_ANNEX_II__C0023", "cit": "Annex II, item 3.15", "seq": 23, "text": "(15)Serious damage caused to an aircraft during maintenance activities due to incorrect maintenance or use of inappropriate or unserviceable ground support equipment that requires additional maintenance actions."}, {"id": "EU_2015_1018_ANNEX_II__C0024", "cit": "Annex II, item 3.16", "seq": 24, "text": "(16)Identified burning, melting, smoke, arcing, overheating or fire occurrences."}, {"id": "EU_2015_1018_ANNEX_II__C0025", "cit": "Annex II, item 3.17", "seq": 25, "text": "(17)Any occurrence where the human performance, including fatigue of personnel, has directly contributed to or could have contributed to an accident or a serious incident."}, {"id": "EU_2015_1018_ANNEX_II__C0026", "cit": "Annex II, item 3.18", "seq": 26, "text": "(18)Significant malfunction, reliability issue, or recurrent recording quality issue affecting a flight recorder system (such as a flight data recorder system, a data link recording system or a cockpit voice recorder system) or lack of information needed to ensure the serviceability of a flight recorder system."}]}, {"qa_id": "QA_0097", "reason": "stratified_unchanged_ARTICLE_test", "cls": "ARTICLE", "qtype": "timeline", "diff": "easy", "split": "test", "audit": "ai_provisional_supported", "question": "From when does Regulation (EU) 2020/2034 apply?", "answer": "This Regulation shall apply from 1 January 2021.", "citation": "Article 4", "parent_id": "EU_2020_2034_ART_4", "gold": ["EU_2020_2034_ART_4__C0002", "EU_2020_2034_ART_4__C0003", "EU_2020_2034_ART_4__C0001", "EU_2020_2034_ART_4__C0004"], "evidence": "EU_2020_2034_ART_4__C0002 [Article 4]: It shall apply from 1 January 2021.\nEU_2020_2034_ART_4__C0003 [Article 4]: This Regulation shall be binding in its entirety and directly applicable in all Member States.\nEU_2020_2034_ART_4__C0001 [Article 4]: This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.\nEU_2020_2034_ART_4__C0004 [Article 4]: Done at Brussels, 6 October 2020.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 1, "vc": 1, "ve": 1, "agg_q1": "no", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R2: Sauf erreur de ma prt, 2020/2034 non cité dans le 376/2014. || R4: il manque le libellé en clair du texte référencé", "siblings": [{"id": "EU_2020_2034_ART_4__C0001", "cit": "Article 4", "seq": 1, "text": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"id": "EU_2020_2034_ART_4__C0002", "cit": "Article 4", "seq": 2, "text": "It shall apply from 1 January 2021."}, {"id": "EU_2020_2034_ART_4__C0003", "cit": "Article 4", "seq": 3, "text": "This Regulation shall be binding in its entirety and directly applicable in all Member States."}, {"id": "EU_2020_2034_ART_4__C0004", "cit": "Article 4", "seq": 4, "text": "Done at Brussels, 6 October 2020."}]}, {"qa_id": "QA_0163", "reason": "stratified_unchanged_GM_test", "cls": "GM", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_provisional_supported", "question": "What is the key principle regarding the reporting of occurrences?", "answer": "The key principle is that reporting an occurrence through the reporting system of their organisation should be promoted and recognised as the normal channel for aviation professionals. However, direct reporting to a competent authority is not prevented if the reporter lacks confidence in their organisation's reporting system.", "citation": "Article 4(6)", "parent_id": "GM_EU_376_2014_SEC_2_8", "gold": ["GM_EU_376_2014_SEC_2_8__C0005", "GM_EU_376_2014_SEC_2_8__C0009"], "evidence": "GM_EU_376_2014_SEC_2_8__C0005 [GM 2.8]: Key principle Reporting an occurrence through the reporting system of their organisation should be promoted and recognised as the normal channel of reporting for aviation professionals.\nGM_EU_376_2014_SEC_2_8__C0009 [GM 2.8]: Whereas the most direct reporting channel should be preferred (the organisation’s reporting system) and even promoted, it is understood that direct reporting to a competent authority by a person employed by an organisation or whose services are contracted or used by this organisation is not prevented. Indeed, situations may occur where reporters are not confident in the reporting system of their organisations and may wish to use another reporting channel. This is consistent with the objective of fostering a ‘Just Culture’ which is pursued by Regulation 376/2014. It aims, in particular, at ensuring confidence of aviation professionals in occurrence reporting systems and encourages them to reports any relevant safety information with a view to contribute to the enhancement of aviation safety and accidents prevention.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 0, "vc": 3, "ve": 0, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "", "action": "panel wants a correction - you must supply the corrected fields", "comments": "R1: l'Article 4(6) ne me semble pas parler de manque de confiance en son organisation || R3: Réponse pas assez complète à mon avis but manquant et dimension analytique prévention des risques pas assez mentionnée comparée à ce qu'il y a dans le texte || R4: expliciter la question sur le canal de remontée préférentiel", "siblings": [{"id": "GM_EU_376_2014_SEC_2_8__C0001", "cit": "GM 2.8", "seq": 1, "text": "The Regulation gives persons subject to the MOR obligation the following reporting channels (Article 4(6)):"}, {"id": "GM_EU_376_2014_SEC_2_8__C0002", "cit": "GM 2.8", "seq": 2, "text": "The mandatory reporting system of the organisation which employs them or contracts or uses their services, or"}, {"id": "GM_EU_376_2014_SEC_2_8__C0003", "cit": "GM 2.8", "seq": 3, "text": "The mandatory system of the Member State of establishment or of the competent authority of their organisation, or by the State which issued, validated or converted the pilot’s licence or"}, {"id": "GM_EU_376_2014_SEC_2_8__C0004", "cit": "GM 2.8", "seq": 4, "text": "The mandatory system of EASA."}, {"id": "GM_EU_376_2014_SEC_2_8__C0005", "cit": "GM 2.8", "seq": 5, "text": "Key principle Reporting an occurrence through the reporting system of their organisation should be promoted and recognised as the normal channel of reporting for aviation professionals."}, {"id": "GM_EU_376_2014_SEC_2_8__C0006", "cit": "GM 2.8", "seq": 6, "text": "This is notably consistent with the integration of occurrence data into the safety management system of an organisation."}, {"id": "GM_EU_376_2014_SEC_2_8__C0007", "cit": "GM 2.8", "seq": 7, "text": "The reporting through the system of a Member States is understood as the one to be used in the absence of any organisation or in situation where the reporter is not confident in the reporting system of an organisation certified or approved by that Member State."}, {"id": "GM_EU_376_2014_SEC_2_8__C0008", "cit": "GM 2.8", "seq": 8, "text": "The reporting through the mandatory system of EASA is understood as the one to be used by organisations for which EASA is the competent authority or in situation where the reporter is not confident in the reporting system of an organisation certified or approved by EASA."}, {"id": "GM_EU_376_2014_SEC_2_8__C0009", "cit": "GM 2.8", "seq": 9, "text": "Whereas the most direct reporting channel should be preferred (the organisation’s reporting system) and even promoted, it is understood that direct reporting to a competent authority by a person employed by an organisation or whose services are contracted or used by this organisation is not prevented. Indeed, situations may occur where reporters are not confident in the reporting system of their o"}, {"id": "GM_EU_376_2014_SEC_2_8__C0010", "cit": "GM 2.8", "seq": 10, "text": "It should be highlighted that the choice of a reporting system should be exclusive. Indeed the use of ‘‘or’’ in Article 4(6) indicates that only one report is required to be made by the reporter and that an occurrence should not lead to multiple reports from the reporter."}, {"id": "GM_EU_376_2014_SEC_2_8__C0011", "cit": "GM 2.8", "seq": 11, "text": "It is therefore understood, in accordance with the Regulation, that a reporter should not report an occurrence to his/her organisation and report it as well to a Member State and/or to EASA. This is without prejudice to other reporting obligations contained in other legal acts (see also section 2.6)."}]}, {"qa_id": "QA_0183", "reason": "exception_record", "cls": "GM", "qtype": "timeline", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "When does the reporting period start for design or production organisations?", "answer": "For design or production organisations, the reporting period starts when the process of identifying an unsafe or potentially unsafe condition concludes. The 72-hour reporting period is counted from that point.", "citation": "GM 3.4", "parent_id": "GM_EU_376_2014_SEC_3_4", "gold": ["GM_EU_376_2014_SEC_3_4__C0005", "GM_EU_376_2014_SEC_3_4__C0006"], "evidence": "GM_EU_376_2014_SEC_3_4__C0005 [GM 3.4]: This reporting flow starts from the moment the occurrence is detected (T0). From this moment, the individual shall report it to the organisation or to the authority as soon as possible, but before 72 hours if it falls within the mandatory scheme. In this case, the organisation has 72 hours to report to the authority from the moment they become aware of the occurrence.\nGM_EU_376_2014_SEC_3_4__C0006 [GM 3.4]: It should be understood that in certain specific situations the identification of the occurrence might require an additional stage before this reporting flow starts. In particular, for Design or Production Organisations the time start (T0) is the moment where the individuals carrying out this process in the organisation identify the unsafe or the potential unsafe condition. Therefore, these organisations will have 72 hours to report to the competent authority when this process concludes that an occurrence represents an unsafe or potential unsafe condition as per Annex Part 21 of Regulation 748/2012.", "ai_notes": "The original citation incorrectly pointed to Section 2.2.", "n": 3, "va": 1, "vc": 2, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "", "action": "panel wants a correction - you must supply the corrected fields", "comments": "R1: GM 3.4 = ?\npourquoi \"design or production organisations\" ? || R4: préciser dans la réponse le délai supplémentaire de 72h pour le report à l'Autorité", "siblings": [{"id": "GM_EU_376_2014_SEC_3_4__C0001", "cit": "GM 3.4", "seq": 1, "text": "Regulation 376/2014 prescribes reporting obligations on certain natural persons (see Section 2.2), organisations and competent authorities."}, {"id": "GM_EU_376_2014_SEC_3_4__C0002", "cit": "GM 3.4", "seq": 2, "text": "The information follows a reporting flow from its initial reporting until its registration in the European Central repository (ECR)."}, {"id": "GM_EU_376_2014_SEC_3_4__C0003", "cit": "GM 3.4", "seq": 3, "text": "The diagram below illustrates the general flow of information, main deadlines and stages of the reporting."}, {"id": "GM_EU_376_2014_SEC_3_4__C0004", "cit": "GM 3.4", "seq": 4, "text": "Diagram 2. Flow of information under Regulation 376/2014"}, {"id": "GM_EU_376_2014_SEC_3_4__C0005", "cit": "GM 3.4", "seq": 5, "text": "This reporting flow starts from the moment the occurrence is detected (T0). From this moment, the individual shall report it to the organisation or to the authority as soon as possible, but before 72 hours if it falls within the mandatory scheme. In this case, the organisation has 72 hours to report to the authority from the moment they become aware of the occurrence."}, {"id": "GM_EU_376_2014_SEC_3_4__C0006", "cit": "GM 3.4", "seq": 6, "text": "It should be understood that in certain specific situations the identification of the occurrence might require an additional stage before this reporting flow starts. In particular, for Design or Production Organisations the time start (T0) is the moment where the individuals carrying out this process in the organisation identify the unsafe or the potential unsafe condition. Therefore, these organi"}, {"id": "GM_EU_376_2014_SEC_3_4__C0007", "cit": "GM 3.4", "seq": 7, "text": "In cases where an organisation learns about an occurrence through its automatic data capturing systems (e.g. FDM) and if it has requested a retrospective report to be made, the 72 hours starts when it receives the retrospective report from the reporter."}, {"id": "GM_EU_376_2014_SEC_3_4__C0008", "cit": "GM 3.4", "seq": 8, "text": "Information about the various stages part of the reporting is detailed in sections below."}]}, {"qa_id": "QA_0213", "reason": "exception_record", "cls": "GM", "qtype": "obligation", "diff": "medium", "split": "test", "audit": "ai_rewritten_supported", "question": "How should a competent authority handle occurrences reported by organisations and individuals?", "answer": "It should handle occurrences reported under Regulation 376/2014 in the same manner whether they are mandatory or voluntary, including occurrences reported directly by individuals.", "citation": "GM 4.2", "parent_id": "GM_EU_376_2014_SEC_4_2", "gold": ["GM_EU_376_2014_SEC_4_2__C0003", "GM_EU_376_2014_SEC_4_2__C0004"], "evidence": "GM_EU_376_2014_SEC_4_2__C0003 [GM 4.2]: Key principle All occurrences reported by an organisation to its competent authority in application of Regulation 376/2014 and its implementing rules shall be handled and addressed in the same manner by this competent authority. All occurrences directly by an individual reporter to a competent authority, whether or not it is reported on the basis of Regulation 2015/1018, shall be handled and addressed in the same manner by that competent authority In general, Regulation 376/2014 does not differentiate the way mandatorily reportable and voluntarily reportable occurrences shall be addressed by the competent authority. It does, however, impose differentiated requirements to the competent authority for handling, from one side, occurrences transferred by an organisation and, from the other side, occurrences directly reported by an individual.\nGM_EU_376_2014_SEC_4_2__C0004 [GM 4.2]: All information collected from organisations, whether it was reported in application of Article 4 or of Article 5, is subject to similar handling by the competent authority. And all information directly reported by individuals to the competent authority, whether it was reported in application of Article 4 or of Article 5, is subject to the same analysis and follow-up obligations.", "ai_notes": "The original citation incorrectly pointed to Section 3.7.", "n": 3, "va": 0, "vc": 3, "ve": 0, "agg_q1": "uncertain", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "", "action": "panel wants a correction - you must supply the corrected fields", "comments": "R1: GM 4.2. = ? || R3: Question peut-être trop floue || R4: A reformuler car la question et la réponse ne sont pas alignées entre organisation/individu d'un côté et obligatoire/volontaire de l'autre.", "siblings": [{"id": "GM_EU_376_2014_SEC_4_2__C0001", "cit": "GM 4.2", "seq": 1, "text": "Detailed information on the type of information to be collected by the competent authority is provided in Section 3.7."}, {"id": "GM_EU_376_2014_SEC_4_2__C0002", "cit": "GM 4.2", "seq": 2, "text": "Regulation 376/2014 establishes two different systems, the mandatory one and the voluntary one, in order to clarify reporting obligations for reporters and for organisations. It is understood that this differentiation has no impact at the level of the competent authority."}, {"id": "GM_EU_376_2014_SEC_4_2__C0003", "cit": "GM 4.2", "seq": 3, "text": "Key principle All occurrences reported by an organisation to its competent authority in application of Regulation 376/2014 and its implementing rules shall be handled and addressed in the same manner by this competent authority. All occurrences directly by an individual reporter to a competent authority, whether or not it is reported on the basis of Regulation 2015/1018, shall be handled and addre"}, {"id": "GM_EU_376_2014_SEC_4_2__C0004", "cit": "GM 4.2", "seq": 4, "text": "All information collected from organisations, whether it was reported in application of Article 4 or of Article 5, is subject to similar handling by the competent authority. And all information directly reported by individuals to the competent authority, whether it was reported in application of Article 4 or of Article 5, is subject to the same analysis and follow-up obligations."}, {"id": "GM_EU_376_2014_SEC_4_2__C0005", "cit": "GM 4.2", "seq": 5, "text": "More detailed information on the way information collected should be handled is included in the questions below."}]}, {"qa_id": "QA_0235", "reason": "stratified_unchanged_GM_development", "cls": "GM", "qtype": "responsibility", "diff": "medium", "split": "development", "audit": "ai_provisional_supported", "question": "What is the role of the Commission regarding the classification of occurrences?", "answer": "The Commission was required to adopt a list classifying occurrences to be referred to, which is outlined in Article 4(5). This list helps identify occurrences that are mandatory to report due to their significant risk to aviation safety.", "citation": "Article 4(5)", "parent_id": "GM_EU_376_2014_SEC_5_3", "gold": ["GM_EU_376_2014_SEC_5_3__C0003"], "evidence": "GM_EU_376_2014_SEC_5_3__C0003 [GM 5.3]: The occurrences to be reported in the context of mandatory reporting systems are those which may represent a significant risk to aviation safety and which fall into defined categories (Article 4(1)). To facilitate the identification of those occurrences, the Commission was required to adopt a list classifying occurrences to be referred to (Article 4(5)).", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 2, "va": 0, "vc": 2, "ve": 0, "agg_q1": "yes", "agg_q2": "no", "agg_q3": "uncertain", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R3: Peut-être donner directement les éléments du fameux article 4(5) || R4: la question est trop vague", "siblings": [{"id": "GM_EU_376_
