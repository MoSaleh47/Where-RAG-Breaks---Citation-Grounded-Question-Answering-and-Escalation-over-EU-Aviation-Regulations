2014_SEC_5_3__C0001", "cit": "GM 5.3", "seq": 1, "text": "Key principle It is understood that the reporting of any safety relevant occurrence should be encouraged."}, {"id": "GM_EU_376_2014_SEC_5_3__C0002", "cit": "GM 5.3", "seq": 2, "text": "For the sake of clarifying legal obligations, Regulation 376/2014 differentiates between occurrences that should always be reported (mandatorily reportable occurrences) and those that may be reported if judged relevant by potential reporters (voluntarily reportable occurrences)."}, {"id": "GM_EU_376_2014_SEC_5_3__C0003", "cit": "GM 5.3", "seq": 3, "text": "The occurrences to be reported in the context of mandatory reporting systems are those which may represent a significant risk to aviation safety and which fall into defined categories (Article 4(1)). To facilitate the identification of those occurrences, the Commission was required to adopt a list classifying occurrences to be referred to (Article 4(5))."}, {"id": "GM_EU_376_2014_SEC_5_3__C0004", "cit": "GM 5.3", "seq": 4, "text": "These occurrences to be reported are therefore be listed in the Commission Implementing Regulation 2015/1018 classifying the occurrences to be reported in the context of mandatory reporting schemes. The occurrences contained in Regulation 2015/1018 are those which have been considered by the legislator as potentially representing a significant risk to aviation safety. The division in the various A"}, {"id": "GM_EU_376_2014_SEC_5_3__C0005", "cit": "GM 5.3", "seq": 5, "text": "Key principle The occurrences that shall always be reported are those listed in Annex V of Regulation 2015/1018."}, {"id": "GM_EU_376_2014_SEC_5_3__C0006", "cit": "GM 5.3", "seq": 6, "text": "Regulation 2015/1018 in its Annex V.1, V.2 and V.3 states that the structure of the Section is made to ensure that the ‘‘pertinent occurrences are linked with categories of activities during which they are normally observed, according to experience, in order to facilitate the reporting of those occurrences’’."}, {"id": "GM_EU_376_2014_SEC_5_3__C0007", "cit": "GM 5.3", "seq": 7, "text": "Key principle It is therefore understood that all occurrences listed in a specific Section of Annex V to Regulation 2015/1018 are reportable, independently of the circumstances in which these occurrences may occur."}, {"id": "GM_EU_376_2014_SEC_5_3__C0008", "cit": "GM 5.3", "seq": 8, "text": "There is no legal obligation for the reporting of occurrences outside those contained in Annex V to Regulation 2015/1018. It is nevertheless understood that reporting of any safety relevant occurrence by anyone aware of it should be encouraged."}, {"id": "GM_EU_376_2014_SEC_5_3__C0009", "cit": "GM 5.3", "seq": 9, "text": "The Commission has prepared and published promotional material with the view to promoting and encouraging the reporting of safety occurrences. This material is available here."}]}, {"qa_id": "QA_0272", "reason": "exception_record", "cls": "ARTICLE", "qtype": "exception", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "For what purposes may information derived from occurrence reports be used under Article 15(2)?", "answer": "It may be used only for the purpose for which it was collected. Member States, the Agency and organisations must not use or make occurrence information available to attribute blame or liability, or for a purpose other than maintaining or improving aviation safety.", "citation": "Article 15(2)", "parent_id": "EU_376_2014_ART_15", "gold": ["EU_376_2014_ART_15__C0003", "EU_376_2014_ART_15__C0004", "EU_376_2014_ART_15__C0005", "EU_376_2014_ART_15__C0006"], "evidence": "EU_376_2014_ART_15__C0003 [Article 15(2)]: 2.Without prejudice to the provisions relating to the protection of safety information in Articles 12, 14 and 15 of Regulation (EU) No 996/2010, information derived from occurrence reports shall be used only for the purpose for which it has been collected.\nEU_376_2014_ART_15__C0004 [Article 15(2)]: Member States, the Agency and organisations shall not make available or use the information on occurrences:\nEU_376_2014_ART_15__C0005 [Article 15(2)(a)]: (a)in order to attribute blame or liability; or\nEU_376_2014_ART_15__C0006 [Article 15(2)(b)]: (b)for any purpose other than the maintenance or improvement of aviation safety.", "ai_notes": "The original answer invented a general national-law exception.", "n": 3, "va": 1, "vc": 2, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R3: Pas sûr de la clarté de la question || R4: Revoir la question", "siblings": [{"id": "EU_376_2014_ART_15__C0001", "cit": "Article 15(1)", "seq": 1, "text": "1.Member States and organisations, in accordance with their national law, and the Agency shall take the necessary measures to ensure the appropriate confidentiality of the details of occurrences received by them pursuant to Articles 4, 5 and 10."}, {"id": "EU_376_2014_ART_15__C0002", "cit": "Article 15(1)", "seq": 2, "text": "Each Member State, each organisation established in a Member State, or the Agency shall process personal data only to the extent necessary for the purposes of this Regulation and without prejudice to national legal acts implementing Directive 95/46/EC."}, {"id": "EU_376_2014_ART_15__C0003", "cit": "Article 15(2)", "seq": 3, "text": "2.Without prejudice to the provisions relating to the protection of safety information in Articles 12, 14 and 15 of Regulation (EU) No 996/2010, information derived from occurrence reports shall be used only for the purpose for which it has been collected."}, {"id": "EU_376_2014_ART_15__C0004", "cit": "Article 15(2)", "seq": 4, "text": "Member States, the Agency and organisations shall not make available or use the information on occurrences:"}, {"id": "EU_376_2014_ART_15__C0005", "cit": "Article 15(2)(a)", "seq": 5, "text": "(a)in order to attribute blame or liability; or"}, {"id": "EU_376_2014_ART_15__C0006", "cit": "Article 15(2)(b)", "seq": 6, "text": "(b)for any purpose other than the maintenance or improvement of aviation safety."}, {"id": "EU_376_2014_ART_15__C0007", "cit": "Article 15(3)", "seq": 7, "text": "3.The Commission, the Agency and the competent authorities of the Member States, when discharging their obligations under Article 14 in relation to the information contained in the European Central Repository, shall:"}, {"id": "EU_376_2014_ART_15__C0008", "cit": "Article 15(3)(a)", "seq": 8, "text": "(a)ensure the confidentiality of the information; and"}, {"id": "EU_376_2014_ART_15__C0009", "cit": "Article 15(3)(b)", "seq": 9, "text": "(b)limit the use of the information to what is strictly necessary in order to discharge their safety-related obligations without attributing blame or liability; in this respect, the information shall be used in particular for risk management and for analysis of safety trends which may lead to safety recommendations or actions, addressing actual or potential safety deficiencies."}, {"id": "EU_376_2014_ART_15__C0010", "cit": "Article 15(4)", "seq": 10, "text": "4.Member States shall ensure that their competent authorities referred to in Article 6(3) and their competent authorities for the administration of justice cooperate with each other through advance administrative arrangements. These advance administrative arrangements shall seek to ensure the correct balance between the need for proper administration of justice, on the one hand, and the necessary "}]}, {"qa_id": "QA_0279", "reason": "exception_record", "cls": "ARTICLE", "qtype": "scope", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "When must Member States refrain from proceedings for reported infringements, and when do the paragraph 10 exceptions apply?", "answer": "Subject to national criminal law, Member States must refrain from proceedings for unpremeditated or inadvertent infringements known only because they were reported under Articles 4 and 5. The protection need not apply in cases of wilful misconduct or manifest, severe and serious disregard of an obvious risk accompanied by a profound failure of professional responsibility as described in paragraph 10.", "citation": "Article 16(6) and 16(10)", "parent_id": "EU_376_2014_ART_16", "gold": ["EU_376_2014_ART_16__C0007", "EU_376_2014_ART_16__C0008", "EU_376_2014_ART_16__C0016", "EU_376_2014_ART_16__C0017", "EU_376_2014_ART_16__C0018"], "evidence": "EU_376_2014_ART_16__C0007 [Article 16(6)]: 6.Without prejudice to applicable national criminal law, Member States shall refrain from instituting proceedings in respect of unpremeditated or inadvertent infringements of the law which come to their attention only because they have been reported pursuant to Articles 4 and 5.\nEU_376_2014_ART_16__C0008 [Article 16(6)]: The first subparagraph shall not apply in the cases referred to in paragraph 10. Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular apply this rule without the exceptions referred to in paragraph 10.\nEU_376_2014_ART_16__C0016 [Article 16(10)]: 10.The protection under paragraphs 6, 7 and 9 of this Article shall not apply to any of the following situations:\nEU_376_2014_ART_16__C0017 [Article 16(10)(a)]: (a)in cases of wilful misconduct;\nEU_376_2014_ART_16__C0018 [Article 16(10)(b)]: (b)where there has been a manifest, severe and serious disregard of an obvious risk and profound failure of professional responsibility to take such care as is evidently required in the circumstances, causing foreseeable damage to a person or property, or which seriously compromises the level of aviation safety.", "ai_notes": "The rewrite uses the regulation's actual exception wording rather than the looser term gross negligence.", "n": 3, "va": 1, "vc": 2, "ve": 0, "agg_q1": "uncertain", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R3: Trop flou en général || R4: il manque dans la question et la réponse \"article 16\" à associer à paragraphe 10.", "siblings": [{"id": "EU_376_2014_ART_16__C0001", "cit": "Article 16(1)", "seq": 1, "text": "1.For the purposes of this Article, ‘personal details’ includes in particular names or addresses of natural persons."}, {"id": "EU_376_2014_ART_16__C0002", "cit": "Article 16(2)", "seq": 2, "text": "2.Each organisation established in a Member State shall ensure that all personal details are made available to staff of that organisation other than persons designated in accordance with Article 6(1) only where absolutely necessary in order to investigate occurrences with a view to enhancing aviation safety."}, {"id": "EU_376_2014_ART_16__C0003", "cit": "Article 16(2)", "seq": 3, "text": "Disidentified information shall be disseminated within the organisation as appropriate."}, {"id": "EU_376_2014_ART_16__C0004", "cit": "Article 16(3)", "seq": 4, "text": "3.Each Member State shall ensure that no personal details are ever recorded in the national database referred to in Article 6(6). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0005", "cit": "Article 16(4)", "seq": 5, "text": "4.The Agency shall ensure that no personal details are ever recorded in the Agency database referred to in Article 6(8). Such disidentified information shall be made available to all relevant parties, for example to allow them to discharge their obligations in relation to aviation safety improvement."}, {"id": "EU_376_2014_ART_16__C0006", "cit": "Article 16(5)", "seq": 6, "text": "5.Member States and the Agency shall not be prevented from taking any action necessary for maintaining or improving aviation safety."}, {"id": "EU_376_2014_ART_16__C0007", "cit": "Article 16(6)", "seq": 7, "text": "6.Without prejudice to applicable national criminal law, Member States shall refrain from instituting proceedings in respect of unpremeditated or inadvertent infringements of the law which come to their attention only because they have been reported pursuant to Articles 4 and 5."}, {"id": "EU_376_2014_ART_16__C0008", "cit": "Article 16(6)", "seq": 8, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10. Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular apply this rule without the exceptions referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0009", "cit": "Article 16(7)", "seq": 9, "text": "7.If disciplinary or administrative proceedings are instituted under national law, information contained in occurrence reports shall not be used against:"}, {"id": "EU_376_2014_ART_16__C0010", "cit": "Article 16(7)(a)", "seq": 10, "text": "(a)the reporters; or"}, {"id": "EU_376_2014_ART_16__C0011", "cit": "Article 16(7)(b)", "seq": 11, "text": "(b)the persons mentioned in occurrence reports."}, {"id": "EU_376_2014_ART_16__C0012", "cit": "Article 16(7)(b)", "seq": 12, "text": "The first subparagraph shall not apply in the cases referred to in paragraph 10."}, {"id": "EU_376_2014_ART_16__C0013", "cit": "Article 16(7)(b)", "seq": 13, "text": "Member States may retain or adopt measures to strengthen the protection of reporters or persons mentioned in occurrence reports. Member States may in particular extend that protection to civil or criminal proceedings."}, {"id": "EU_376_2014_ART_16__C0014", "cit": "Article 16(8)", "seq": 14, "text": "8.Member States may adopt or maintain in force legislative provisions ensuring a higher level of protection for reporters or for persons mentioned in occurrence reports than those established in this Regulation."}, {"id": "EU_376_2014_ART_16__C0015", "cit": "Article 16(9)", "seq": 15, "text": "9.Except where paragraph 10 applies, employees and contracted personnel who report or are mentioned in occurrence reports collected in accordance with Articles 4 and 5 shall not be subject to any prejudice by their employer or by the organisation for which the services are provided on the basis of the information supplied by the reporter."}, {"id": "EU_376_2014_ART_16__C0016", "cit": "Article 16(10)", "seq": 16, "text": "10.The protection under paragraphs 6, 7 and 9 of this Article shall not apply to any of the following situations:"}, {"id": "EU_376_2014_ART_16__C0017", "cit": "Article 16(10)(a)", "seq": 17, "text": "(a)in cases of wilful misconduct;"}, {"id": "EU_376_2014_ART_16__C0018", "cit": "Article 16(10)(b)", "seq": 18, "text": "(b)where there has been a manifest, severe and serious disregard of an obvious risk and profound failure of professional responsibility to take such care as is evidently required in the circumstances, causing foreseeable damage to a person or property, or which seriously compromises the level of aviation safety."}, {"id": "EU_376_2014_ART_16__C0019", "cit": "Article 16(11)", "seq": 19, "text": "11.Each organisation established in a Member State shall, after consulting its staff representatives, adopt internal rules describing how ‘just culture’ principles, in particular the principle referred to in paragraph 9, are guaranteed and implemented within that organisation."}, {"id": "EU_376_2014_ART_16__C0020", "cit": "Article 16(11)", "seq": 20, "text": "The body designated pursuant to paragraph 12 may ask to review the internal rules of the organisations established in its Member State before those internal rules are implemented."}, {"id": "EU_376_2014_ART_16__C0021", "cit": "Article 16(12)", "seq": 21, "text": "12.Each Member State shall designate a body responsible for the implementation of paragraphs 6, 9 and 11."}, {"id": "EU_376_2014_ART_16__C0022", "cit": "Article 16(12)", "seq": 22, "text": "Employees and contracted personnel may report to that body alleged infringements of the rules established by this Article. Employees and contracted personnel shall not be penalised for reporting alleged infringements. Employees and contracted personnel may inform the Commission about such alleged infringements."}, {"id": "EU_376_2014_ART_16__C0023", "cit": "Article 16(12)", "seq": 23, "text": "Where appropriate, the designated body shall advise the relevant authorities of its Member State concerning remedies or penalties in application of Article 21."}, {"id": "EU_376_2014_ART_16__C0024", "cit": "Article 16(13)", "seq": 24, "text": "13.On 15 May 2019 and every five years thereafter, each Member State shall send the Commission a report on the application of this Article, and in particular on the activities of the body designated pursuant to paragraph 12. The report shall not contain any personal data."}]}, {"qa_id": "QA_0287", "reason": "exception_record", "cls": "ARTICLE", "qtype": "obligation", "diff": "hard", "split": "test", "audit": "ai_rewritten_supported", "question": "How do the Agency's review duty and Member States' notification duty apply to ERCS conversion procedures?", "answer": "The Agency must regularly review the Annex conversion procedures to ensure their continuing relevance. When applicable, Member States must notify the Commission and the Agency when they use the manual procedure in point 2 of the Annex or other procedures referred to in Article 3(2).", "citation": "Article 5(1)-(2)", "parent_id": "EU_2021_2082_ART_5", "gold": ["EU_2021_2082_ART_5__C0001", "EU_2021_2082_ART_5__C0002"], "evidence": "EU_2021_2082_ART_5__C0001 [Article 5(1)]: 1.The conversion procedures set out in the Annex shall be subject to regular review by the Agency to ensure its continuing relevance. The review may take account of the expertise of the NoA and relevant expert groups if established by the Agency.\nEU_2021_2082_ART_5__C0002 [Article 5(2)]: 2.When applicable, Member States shall notify to the Commission and the Agency the use of the manual conversion procedure set out in point 2 of the Annex and other conversion procedures referred to in Article 3(2) of this Regulation.", "ai_notes": "The original answer speculated that an Agency review could release Member States from notification.", "n": 3, "va": 1, "vc": 1, "ve": 1, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R1: l'Article 5(1)-(2) parle de CR volontaires || R4: la question n'est pas claire", "siblings": [{"id": "EU_2021_2082_ART_5__C0001", "cit": "Article 5(1)", "seq": 1, "text": "1.The conversion procedures set out in the Annex shall be subject to regular review by the Agency to ensure its continuing relevance. The review may take account of the expertise of the NoA and relevant expert groups if established by the Agency."}, {"id": "EU_2021_2082_ART_5__C0002", "cit": "Article 5(2)", "seq": 2, "text": "2.When applicable, Member States shall notify to the Commission and the Agency the use of the manual conversion procedure set out in point 2 of the Annex and other conversion procedures referred to in Article 3(2) of this Regulation."}]}, {"qa_id": "QA_0289", "reason": "stratified_unchanged_GM_development", "cls": "GM", "qtype": "scope", "diff": "hard", "split": "development", "audit": "ai_provisional_supported", "question": "What are the implications for reporting an occurrence if there is only one pilot on board an aircraft, and how does this relate to the definitions of crew members in Article 4(6)(a)?", "answer": "If there is only one pilot on board, the provision stipulates that the cabin manager becomes the next crew member in the chain of command for reporting purposes. This means that the cabin manager is responsible for reporting if the pilot is unable to do so. The implication is that the reporting hierarchy changes based on the crew configuration, which must be clearly defined within the organization's safety management system.", "citation": "Article 4(6)(a)", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": ["GM_EU_376_2014_SEC_2_2__C0015", "GM_EU_376_2014_SEC_2_2__C0013"], "evidence": "GM_EU_376_2014_SEC_2_2__C0015 [GM 2.2]: Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager.\nGM_EU_376_2014_SEC_2_2__C0013 [GM 2.2]: In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 2, "va": 2, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "", "siblings": [{"id": "GM_EU_376_2014_SEC_2_2__C0001", "cit": "GM 2.2", "seq": 1, "text": "Whereas the reporting of any safety relevant occurrence should be encouraged, Regulation 376/2014 differentiates between occurrences that should always be reported, because they have been considered by the legislator as posing a significant risk for aviation safety, and those that may be reported if judged relevant by potential reporters (more information of the reportable occurrences is provided "}, {"id": "GM_EU_376_2014_SEC_2_2__C0002", "cit": "GM 2.2", "seq": 2, "text": "Furthermore, whereas any person involved in aviation activities should be encouraged to report any safety occurrence it considers relevant, Regulation 376/2014 differentiates between the persons who are always required to report defined occurrences, because they have been considered as front line operators by the legislator, and those that may report occurrences when they judge it relevant."}, {"id": "GM_EU_376_2014_SEC_2_2__C0003", "cit": "GM 2.2", "seq": 3, "text": "Key principle The obligation for designated persons to report certain occurrences does not prevent other persons from reporting occurrences under the normal operation of their organisation safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0004", "cit": "GM 2.2", "seq": 4, "text": "This section provides information on the persons who are required to report certain occurrences in accordance with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0005", "cit": "GM 2.2", "seq": 5, "text": "This Regulation provides for a list of designated persons that must report occurrences in the context of mandatory reporting schemes (Article 4(6)). This list covers a broad range of persons involved in aviation activities, employees as well as other persons."}, {"id": "GM_EU_376_2014_SEC_2_2__C0006", "cit": "GM 2.2", "seq": 6, "text": "Key principle The list of persons who are required to report certain occurrences covers employees of an organisation, as well as persons whose services are contracted or used by the organisation (Article 4(6))."}, {"id": "GM_EU_376_2014_SEC_2_2__C0007", "cit": "GM 2.2", "seq": 7, "text": "Example: Pilots employed by a European operator as well as self-employed pilots who are pilot-in-command of aircraft used by a European operator are covered under this obligation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0008", "cit": "GM 2.2", "seq": 8, "text": "These designated persons are under a legal obligation to report certain defined occurrences. Without these occurrence reports, the European Union and the organisations and competent authorities that are part of it cannot make the best decisions on safety priorities. In addition, the failure to comply with the reporting legal obligation might have consequences for those required to report (Article "}, {"id": "GM_EU_376_2014_SEC_2_2__C0009", "cit": "GM 2.2", "seq": 9, "text": "It is therefore important to clearly identify the persons that are under the obligation to report occurrences under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0010", "cit": "GM 2.2", "seq": 10, "text": "Furthermore, clarification is necessary to ensure that, where relevant, natural persons already subject to an obligation to report safety occurrences under other European rules (see also section 3.6) are the same than the ones covered under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0011", "cit": "GM 2.2", "seq": 11, "text": "Pilots"}, {"id": "GM_EU_376_2014_SEC_2_2__C0012", "cit": "GM 2.2", "seq": 12, "text": "Key principle Article 4(6)(a) covers both pilots in command operating in the context of commercial air transport as well as private pilots operating on an aircraft covered by the Regulation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0013", "cit": "GM 2.2", "seq": 13, "text": "In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so."}, {"id": "GM_EU_376_2014_SEC_2_2__C0014", "cit": "GM 2.2", "seq": 14, "text": "The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew."}, {"id": "GM_EU_376_2014_SEC_2_2__C0015", "cit": "GM 2.2", "seq": 15, "text": "Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager."}, {"id": "GM_EU_376_2014_SEC_2_2__C0016", "cit": "GM 2.2", "seq": 16, "text": "These situations should be covered and described by organisations within their safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0017", "cit": "GM 2.2", "seq": 17, "text": "Design / manufacturing / airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0018", "cit": "GM 2.2", "seq": 18, "text": "Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certi"}, {"id": "GM_EU_376_2014_SEC_2_2__C0019", "cit": "GM 2.2", "seq": 19, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition."}, {"id": "GM_EU_376_2014_SEC_2_2__C0020", "cit": "GM 2.2", "seq": 20, "text": "Example: A person working in a production organisation being responsible of the investigation, together with the Design Approval Holder (DAH), to confirm if identified deviations of the manufactured product from design data could lead to an unsafe condition of the final certified product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0021", "cit": "GM 2.2", "seq": 21, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions for the holder of a typecertificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair d"}, {"id": "GM_EU_376_2014_SEC_2_2__C0022", "cit": "GM 2.2", "seq": 22, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0023", "cit": "GM 2.2", "seq": 23, "text": "Example: A person working in a DAH having the responsibility to carry out the process to identify unsafe or potential unsafe conditions as per Part-21 requirements under Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0024", "cit": "GM 2.2", "seq": 24, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}, {"qa_id": "QA_0292", "reason": "exception_record", "cls": "GM", "qtype": "exception", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "Which persons engaged in manufacturing are described as covered by Article 4(6)(b)?", "answer": "The guidance covers persons under Member-State or EASA oversight who are directly involved in producing aeronautical items, verify compliance with applicable design data, and are responsible for investigations with the type-certificate or design-approval holder to identify whether deviations could lead to an unsafe condition.", "citation": "GM 2.2; Article 4(6)(b)", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": ["GM_EU_376_2014_SEC_2_2__C0018"], "evidence": "GM_EU_376_2014_SEC_2_2__C0018 [GM 2.2]: Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certificate or design approval in order to identify if those deviations could lead to an unsafe condition.", "ai_notes": "The source defines covered persons; it does not define when oversight itself ceases to apply.", "n": 2, "va": 1, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "yes", "auto": "", "action": "reviewers disagree", "comments": "R4: ne pas faire commencer la réponse par \"the guidance...\"", "siblings": [{"id": "GM_EU_376_2014_SEC_2_2__C0001", "cit": "GM 2.2", "seq": 1, "text": "Whereas the reporting of any safety relevant occurrence should be encouraged, Regulation 376/2014 differentiates between occurrences that should always be reported, because they have been considered by the legislator as posing a significant risk for aviation safety, and those that may be reported if judged relevant by potential reporters (more information of the reportable occurrences is provided "}, {"id": "GM_EU_376_2014_SEC_2_2__C0002", "cit": "GM 2.2", "seq": 2, "text": "Furthermore, whereas any person involved in aviation activities should be encouraged to report any safety occurrence it considers relevant, Regulation 376/2014 differentiates between the persons who are always required to report defined occurrences, because they have been considered as front line operators by the legislator, and those that may report occurrences when they judge it relevant."}, {"id": "GM_EU_376_2014_SEC_2_2__C0003", "cit": "GM 2.2", "seq": 3, "text": "Key principle The obligation for designated persons to report certain occurrences does not prevent other persons from reporting occurrences under the normal operation of their organisation safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0004", "cit": "GM 2.2", "seq": 4, "text": "This section provides information on the persons who are required to report certain occurrences in accordance with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0005", "cit": "GM 2.2", "seq": 5, "text": "This Regulation provides for a list of designated persons that must report occurrences in the context of mandatory reporting schemes (Article 4(6)). This list covers a broad range of persons involved in aviation activities, employees as well as other persons."}, {"id": "GM_EU_376_2014_SEC_2_2__C0006", "cit": "GM 2.2", "seq": 6, "text": "Key principle The list of persons who are required to report certain occurrences covers employees of an organisation, as well as persons whose services are contracted or used by the organisation (Article 4(6))."}, {"id": "GM_EU_376_2014_SEC_2_2__C0007", "cit": "GM 2.2", "seq": 7, "text": "Example: Pilots employed by a European operator as well as self-employed pilots who are pilot-in-command of aircraft used by a European operator are covered under this obligation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0008", "cit": "GM 2.2", "seq": 8, "text": "These designated persons are under a legal obligation to report certain defined occurrences. Without these occurrence reports, the European Union and the organisations and competent authorities that are part of it cannot make the best decisions on safety priorities. In addition, the failure to comply with the reporting legal obligation might have consequences for those required to report (Article "}, {"id": "GM_EU_376_2014_SEC_2_2__C0009", "cit": "GM 2.2", "seq": 9, "text": "It is therefore important to clearly identify the persons that are under the obligation to report occurrences under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0010", "cit": "GM 2.2", "seq": 10, "text": "Furthermore, clarification is necessary to ensure that, where relevant, natural persons already subject to an obligation to report safety occurrences under other European rules (see also section 3.6) are the same than the ones covered under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0011", "cit": "GM 2.2", "seq": 11, "text": "Pilots"}, {"id": "GM_EU_376_2014_SEC_2_2__C0012", "cit": "GM 2.2", "seq": 12, "text": "Key principle Article 4(6)(a) covers both pilots in command operating in the context of commercial air transport as well as private pilots operating on an aircraft covered by the Regulation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0013", "cit": "GM 2.2", "seq": 13, "text": "In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so."}, {"id": "GM_EU_376_2014_SEC_2_2__C0014", "cit": "GM 2.2", "seq": 14, "text": "The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew."}, {"id": "GM_EU_376_2014_SEC_2_2__C0015", "cit": "GM 2.2", "seq": 15, "text": "Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager."}, {"id": "GM_EU_376_2014_SEC_2_2__C0016", "cit": "GM 2.2", "seq": 16, "text": "These situations should be covered and described by organisations within their safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0017", "cit": "GM 2.2", "seq": 17, "text": "Design / manufacturing / airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0018", "cit": "GM 2.2", "seq": 18, "text": "Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certi"}, {"id": "GM_EU_376_2014_SEC_2_2__C0019", "cit": "GM 2.2", "seq": 19, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition."}, {"id": "GM_EU_376_2014_SEC_2_2__C0020", "cit": "GM 2.2", "seq": 20, "text": "Example: A person working in a production organisation being responsible of the investigation, together with the Design Approval Holder (DAH), to confirm if identified deviations of the manufactured product from design data could lead to an unsafe condition of the final certified product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0021", "cit": "GM 2.2", "seq": 21, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions for the holder of a typecertificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair d"}, {"id": "GM_EU_376_2014_SEC_2_2__C0022", "cit": "GM 2.2", "seq": 22, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0023", "cit": "GM 2.2", "seq": 23, "text": "Example: A person working in a DAH having the responsibility to carry out the process to identify unsafe or potential unsafe conditions as per Part-21 requirements under Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0024", "cit": "GM 2.2", "seq": 24, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}, {"qa_id": "QA_0293", "reason": "exception_record", "cls": "GM", "qtype": "obligation", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "How should a production organisation and design-approval holder assess deviations from design data?", "answer": "The production organisation must liaise with the design organisation, and the responsible person investigates with the Design Approval Holder whether identified deviations from design data could lead to an unsafe condition in the final certified product.", "citation": "GM 2.2; Article 4(6)(b)", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": ["GM_EU_376_2014_SEC_2_2__C0018", "GM_EU_376_2014_SEC_2_2__C0019", "GM_EU_376_2014_SEC_2_2__C0020"], "evidence": "GM_EU_376_2014_SEC_2_2__C0018 [GM 2.2]: Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certificate or design approval in order to identify if those deviations could lead to an unsafe condition.\nGM_EU_376_2014_SEC_2_2__C0019 [GM 2.2]: This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition.\nGM_EU_376_2014_SEC_2_2__C0020 [GM 2.2]: Example: A person working in a f EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}, {"qa_id": "QA_0294", "reason": "exception_record", "cls": "GM", "qtype": "scope", "diff": "hard", "split": "development", "audit": "ai_rewritten_supported", "question": "What criteria describe manufacturing personnel covered by Article 4(6)(b) in the guidance?", "answer": "They are persons under Member-State or EASA oversight who are directly involved in producing aeronautical items, verify compliance with applicable design data, and are responsible for investigations with the type-certificate or design-approval holder to identify potentially unsafe deviations.", "citation": "GM 2.2; Article 4(6)(b)", "parent_id": "GM_EU_376_2014_SEC_2_2", "gold": ["GM_EU_376_2014_SEC_2_2__C0018"], "evidence": "GM_EU_376_2014_SEC_2_2__C0018 [GM 2.2]: Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certificate or design approval in order to identify if those deviations could lead to an unsafe condition.", "ai_notes": "The original answer claimed that other persons were explicitly excluded, which the source does not state.", "n": 1, "va": 0, "vc": 1, "ve": 0, "agg_q1": "uncertain", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "", "action": "only 1 reviewer(s), need 2", "comments": "R4: reformuler question (le terme criteria est ambigu)", "siblings": [{"id": "GM_EU_376_2014_SEC_2_2__C0001", "cit": "GM 2.2", "seq": 1, "text": "Whereas the reporting of any safety relevant occurrence should be encouraged, Regulation 376/2014 differentiates between occurrences that should always be reported, because they have been considered by the legislator as posing a significant risk for aviation safety, and those that may be reported if judged relevant by potential reporters (more information of the reportable occurrences is provided "}, {"id": "GM_EU_376_2014_SEC_2_2__C0002", "cit": "GM 2.2", "seq": 2, "text": "Furthermore, whereas any person involved in aviation activities should be encouraged to report any safety occurrence it considers relevant, Regulation 376/2014 differentiates between the persons who are always required to report defined occurrences, because they have been considered as front line operators by the legislator, and those that may report occurrences when they judge it relevant."}, {"id": "GM_EU_376_2014_SEC_2_2__C0003", "cit": "GM 2.2", "seq": 3, "text": "Key principle The obligation for designated persons to report certain occurrences does not prevent other persons from reporting occurrences under the normal operation of their organisation safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0004", "cit": "GM 2.2", "seq": 4, "text": "This section provides information on the persons who are required to report certain occurrences in accordance with Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0005", "cit": "GM 2.2", "seq": 5, "text": "This Regulation provides for a list of designated persons that must report occurrences in the context of mandatory reporting schemes (Article 4(6)). This list covers a broad range of persons involved in aviation activities, employees as well as other persons."}, {"id": "GM_EU_376_2014_SEC_2_2__C0006", "cit": "GM 2.2", "seq": 6, "text": "Key principle The list of persons who are required to report certain occurrences covers employees of an organisation, as well as persons whose services are contracted or used by the organisation (Article 4(6))."}, {"id": "GM_EU_376_2014_SEC_2_2__C0007", "cit": "GM 2.2", "seq": 7, "text": "Example: Pilots employed by a European operator as well as self-employed pilots who are pilot-in-command of aircraft used by a European operator are covered under this obligation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0008", "cit": "GM 2.2", "seq": 8, "text": "These designated persons are under a legal obligation to report certain defined occurrences. Without these occurrence reports, the European Union and the organisations and competent authorities that are part of it cannot make the best decisions on safety priorities. In addition, the failure to comply with the reporting legal obligation might have consequences for those required to report (Article "}, {"id": "GM_EU_376_2014_SEC_2_2__C0009", "cit": "GM 2.2", "seq": 9, "text": "It is therefore important to clearly identify the persons that are under the obligation to report occurrences under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0010", "cit": "GM 2.2", "seq": 10, "text": "Furthermore, clarification is necessary to ensure that, where relevant, natural persons already subject to an obligation to report safety occurrences under other European rules (see also section 3.6) are the same than the ones covered under Regulation 376/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0011", "cit": "GM 2.2", "seq": 11, "text": "Pilots"}, {"id": "GM_EU_376_2014_SEC_2_2__C0012", "cit": "GM 2.2", "seq": 12, "text": "Key principle Article 4(6)(a) covers both pilots in command operating in the context of commercial air transport as well as private pilots operating on an aircraft covered by the Regulation."}, {"id": "GM_EU_376_2014_SEC_2_2__C0013", "cit": "GM 2.2", "seq": 13, "text": "In addition, Article 4(6) (a) refers to ‘‘the pilot in command, or, in cases where the pilot in command is unable to report the occurrence, any other crew member next in the chain of command of an aircraft’’. Situations where the pilot would be unable to report is understood as referring to cases where the pilot would be unable to report because he would not be physically able to do so."}, {"id": "GM_EU_376_2014_SEC_2_2__C0014", "cit": "GM 2.2", "seq": 14, "text": "The reference to ‘‘any other crew member next in the chain of command’’ intends to cover any configuration of the crew."}, {"id": "GM_EU_376_2014_SEC_2_2__C0015", "cit": "GM 2.2", "seq": 15, "text": "Example: Any other crew member next in the chain of command in the context of a CAT operation on-board of a large aeroplane would be the co-pilot whereas in the case where there is only one pilot on board it would be the cabin manager."}, {"id": "GM_EU_376_2014_SEC_2_2__C0016", "cit": "GM 2.2", "seq": 16, "text": "These situations should be covered and described by organisations within their safety management system."}, {"id": "GM_EU_376_2014_SEC_2_2__C0017", "cit": "GM 2.2", "seq": 17, "text": "Design / manufacturing / airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0018", "cit": "GM 2.2", "seq": 18, "text": "Key principle Article 4(6)(b) is understood as covering persons engaged in manufacturing of an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are directly involved in the production of aeronautical items, have the role to verify compliance with applicable design data and the responsibility to perform investigations with the holder of the type-certi"}, {"id": "GM_EU_376_2014_SEC_2_2__C0019", "cit": "GM 2.2", "seq": 19, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012, where the production organisation is required to liaise with the design organisation to confirm that the deviation in design data is actually an unsafe condition."}, {"id": "GM_EU_376_2014_SEC_2_2__C0020", "cit": "GM 2.2", "seq": 20, "text": "Example: A person working in a production organisation being responsible of the investigation, together with the Design Approval Holder (DAH), to confirm if identified deviations of the manufactured product from design data could lead to an unsafe condition of the final certified product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0021", "cit": "GM 2.2", "seq": 21, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions for the holder of a typecertificate, restricted type-certificate, supplemental type-certificate, ETSO authorisation, major repair d"}, {"id": "GM_EU_376_2014_SEC_2_2__C0022", "cit": "GM 2.2", "seq": 22, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0023", "cit": "GM 2.2", "seq": 23, "text": "Example: A person working in a DAH having the responsibility to carry out the process to identify unsafe or potential unsafe conditions as per Part-21 requirements under Commission Regulation (EU) No 748/2012."}, {"id": "GM_EU_376_2014_SEC_2_2__C0024", "cit": "GM 2.2", "seq": 24, "text": "Key principle Article 4(6)(b) is also understood as covering persons engaged in designing an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, who are in charge of the process to identify unsafe or potential unsafe conditions in the context of the continuing airworthiness of their products under the Commission Regulation (EU) No 748/2012 but not subject t"}, {"id": "GM_EU_376_2014_SEC_2_2__C0025", "cit": "GM 2.2", "seq": 25, "text": "Example: A person working in a design organisation dedicated to the design of light aircraft not certified as per Part-21 requirements or subject to an organisation approval under Commission Regulation (EU) No 748/2012 but still falling under this legal framework and in charge of the process to identify unsafe or potential unsafe conditions of the product."}, {"id": "GM_EU_376_2014_SEC_2_2__C0026", "cit": "GM 2.2", "seq": 26, "text": "Key principle Finally, Article 4(6)(b) is also understood as covering persons engaged in continuing airworthiness monitoring, maintaining or modifying an aircraft, or any equipment or part thereof under the oversight of a Member State or of EASA, and who holds a valid aircraft maintenance licence; or who is authorised by its organisation and is directly involved with tasks of maintaining aircraft,"}, {"id": "GM_EU_376_2014_SEC_2_2__C0027", "cit": "GM 2.2", "seq": 27, "text": "This is aligned with occurrence reporting requirements in Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0028", "cit": "GM 2.2", "seq": 28, "text": "Example: A person who holds a valid Part-66 mechanic license and performs actual maintenance work or a person who is a postholder for the continuing airworthiness of an aircraft."}, {"id": "GM_EU_376_2014_SEC_2_2__C0029", "cit": "GM 2.2", "seq": 29, "text": "Airworthiness personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0030", "cit": "GM 2.2", "seq": 30, "text": "Key principle Article 4(6)(c) is understood as applying to the person responsible for the airworthiness review performed in accordance with Annex I (Part M), M.A.710 of Regulation (EU) No 1321/2014, or the person responsible for the release to service in accordance with Annex I (Part M), M.A.801, M.A.802 or M.A.803 or Annex II (Part-145) 145.A.50 of Commission Regulation (EU) No 1321/2014."}, {"id": "GM_EU_376_2014_SEC_2_2__C0031", "cit": "GM 2.2", "seq": 31, "text": "Example: A person that holds a valid mechanic license as per Part-66 requirements and performs the release to service of aviation products."}, {"id": "GM_EU_376_2014_SEC_2_2__C0032", "cit": "GM 2.2", "seq": 32, "text": "ATM/ANS personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0033", "cit": "GM 2.2", "seq": 33, "text": "Key principle Article 4(6)(d) is understood as applying to a person who performs a function which requires him to be authorised by a Member State as a staff member of an air traffic service provider entrusted with responsibilities related to air navigation services or as a flight information service officer."}, {"id": "GM_EU_376_2014_SEC_2_2__C0034", "cit": "GM 2.2", "seq": 34, "text": "Example: An Air Traffic Controller or Flight Information Officer who holds a valid license as per Commission Regulation (EU) 2015/340 and acting as controller or officer on duty. In situations where an occurrence involves more than one person within the same organisation, it is understood that the most appropriate person should raise the report. A report is not needed from each person involved in "}, {"id": "GM_EU_376_2014_SEC_2_2__C0035", "cit": "GM 2.2", "seq": 35, "text": "Aerodrome personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0036", "cit": "GM 2.2", "seq": 36, "text": "Key principle Article 4(6)(e) is understood as applying to a person who performs a function connected with the safety management of an airport to which Regulation (EC) No 1008/2008 applies. This covers the Safety Manager of aerodromes certified under Commission Regulation (EU) No 139/2014, the equivalent responsible person of those aerodromes not certified under Commission Regulation (EU) No 139/2"}, {"id": "GM_EU_376_2014_SEC_2_2__C0037", "cit": "GM 2.2", "seq": 37, "text": "It also includes personnel and persons whose services (e.g. ground handling organisations, bird control and aerodrome services) are contracted or used by the aerodrome and who are expected to report information in the context of the safety management system of the aerodrome because of their aviation related tasks."}, {"id": "GM_EU_376_2014_SEC_2_2__C0038", "cit": "GM 2.2", "seq": 38, "text": "ANS facilities personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0039", "cit": "GM 2.2", "seq": 39, "text": "Key principle Article 4(6)(f) is understood as applying to a person who performs a function connected with the installation, modification, maintenance, repair, overhaul, flight-checking or inspection of air navigation facilities for which a Member State is responsible."}, {"id": "GM_EU_376_2014_SEC_2_2__C0040", "cit": "GM 2.2", "seq": 40, "text": "Ground handling personnel"}, {"id": "GM_EU_376_2014_SEC_2_2__C0041", "cit": "GM 2.2", "seq": 41, "text": "Key principle Article 4(6)(g) is understood as applying to a person who performs a function connected with the ground handling of aircraft in accordance with Directive 96/67/EC, including fuelling, servicing, loadsheet preparation, loading, de-icing and towing, at an airport covered by Regulation (EC) No 1008/2008."}]}, {"qa_id": "QA_0011", "reason": "exception_record", "cls": "ARTICLE", "qtype": "definition", "diff": "easy", "split": "development", "audit": "ai_rewritten_supported", "question": "What subject matter is laid down in Article 3(1) of Regulation (EU) No 376/2014?", "answer": "Article 3(1) lays down rules on occurrence reporting; analysis and follow-up; protection of aviation professionals; appropriate use of safety information; integration into the European Central Repository; and dissemination of anonymised information to improve aviation safety.", "citation": "Article 3(1)", "parent_id": "EU_376_2014_ART_3", "gold": ["EU_376_2014_ART_3__C0001", "EU_376_2014_ART_3__C0002", "EU_376_2014_ART_3__C0003", "EU_376_2014_ART_3__C0004", "EU_376_2014_ART_3__C0005", "EU_376_2014_ART_3__C0006", "EU_376_2014_ART_3__C0007"], "evidence": "EU_376_2014_ART_3__C0001 [Article 3(1)]: 1.This Regulation lays down rules on:\nEU_376_2014_ART_3__C0002 [Article 3(1)(a)]: (a)the reporting of occurrences which endanger or which, if not corrected or addressed, would endanger an aircraft, its occupants, any other person, equipment or installation affecting aircraft operations; and the reporting of other relevant safety-related information in that context;\nEU_376_2014_ART_3__C0003 [Article 3(1)(b)]: (b)analysis and follow-up action in respect of reported occurrences and other safety-related information;\nEU_376_2014_ART_3__C0004 [Article 3(1)(c)]: (c)the protection of aviation professionals;\nEU_376_2014_ART_3__C0005 [Article 3(1)(d)]: (d)appropriate use collected safety information;\nEU_376_2014_ART_3__C0006 [Article 3(1)(e)]: (e)the integration of information into the European Central Repository; and\nEU_376_2014_ART_3__C0007 [Article 3(1)(f)]: (f)the dissemination of anonymised information to interested parties for the purpose of providing such parties with the information they need in order to improve aviation safety.", "ai_notes": "The original question incorrectly attributed the provision to Regulation (EU) 2018/1139.", "n": 4, "va": 3, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R1: qu'entends-tu par \"subject matter\" ?", "siblings": [{"id": "EU_376_2014_ART_3__C0001", "cit": "Article 3(1)", "seq": 1, "text": "1.This Regulation lays down rules on:"}, {"id": "EU_376_2014_ART_3__C0002", "cit": "Article 3(1)(a)", "seq": 2, "text": "(a)the reporting of occurrences which endanger or which, if not corrected or addressed, would endanger an aircraft, its occupants, any other person, equipment or installation affecting aircraft operations; and the reporting of other relevant safety-related information in that context;"}, {"id": "EU_376_2014_ART_3__C0003", "cit": "Article 3(1)(b)", "seq": 3, "text": "(b)analysis and follow-up action in respect of reported occurrences and other safety-related information;"}, {"id": "EU_376_2014_ART_3__C0004", "cit": "Article 3(1)(c)", "seq": 4, "text": "(c)the protection of aviation professionals;"}, {"id": "EU_376_2014_ART_3__C0005", "cit": "Article 3(1)(d)", "seq": 5, "text": "(d)appropriate use collected safety information;"}, {"id": "EU_376_2014_ART_3__C0006", "cit": "Article 3(1)(e)", "seq": 6, "text": "(e)the integration of information into the European Central Repository; and"}, {"id": "EU_376_2014_ART_3__C0007", "cit": "Article 3(1)(f)", "seq": 7, "text": "(f)the dissemination of anonymised information to interested parties for the purpose of providing such parties with the information they need in order to improve aviation safety."}, {"id": "EU_376_2014_ART_3__C0008", "cit": "Article 3(2)", "seq": 8, "text": "2.This Regulation applies to occurrences and other safety-related information involving civil aircraft to which Regulation (EU) 2018/1139 of the European Parliament and of the Council () applies."}, {"id": "EU_376_2014_ART_3__C0009", "cit": "Article 3(2)", "seq": 9, "text": "However, this Regulation shall not apply to occurrences and other safety-related information involving unmanned aircraft for which a certificate or declaration is not required pursuant to Article 56(1) and (5) of Regulation (EU) 2018/1139, unless the occurrence or other safetyrelated information involving such unmanned aircraft resulted in a fatal or serious injury to a person or it involved aircr"}, {"id": "EU_376_2014_ART_3__C0010", "cit": "Article 3(2)", "seq": 10, "text": "Member States may decide to apply this Regulation also to occurrences and other safety-related information involving the aircraft to which Regulation (EU) 2018/1139 does not apply."}]}, {"qa_id": "QA_0047", "reason": "stratified_unchanged_ARTICLE_development", "cls": "ARTICLE", "qtype": "obligation", "diff": "easy", "split": "development", "audit": "ai_provisional_supported", "question": "What measures must Member States and organisations take regarding the confidentiality of occurrence details?", "answer": "Member States and organisations, in accordance with their national law, and the Agency shall take the necessary measures to ensure the appropriate confidentiality of the details of occurrences received by them. This is mandated by Article 15(1).", "citation": "Article 15(1)", "parent_id": "EU_376_2014_ART_15", "gold": ["EU_376_2014_ART_15__C0001", "EU_376_2014_ART_15__C0002"], "evidence": "EU_376_2014_ART_15__C0001 [Article 15(1)]: 1.Member States and organisations, in accordance with their national law, and the Agency shall take the necessary measures to ensure the appropriate confidentiality of the details of occurrences received by them pursuant to Articles 4, 5 and 10.\nEU_376_2014_ART_15__C0002 [Article 15(1)]: Each Member State, each organisation established in a Member State, or the Agency shall process personal data only to the extent necessary for the purposes of this Regulation and without prejudice to national legal acts implementing Directive 95/46/EC.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 4, "va": 3, "vc": 1, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "R3: Pas assez concret comme réponse je trouve", "siblings": [{"id": "EU_376_2014_ART_15__C0001", "cit": "Article 15(1)", "seq": 1, "text": "1.Member States and organisations, in accordance with their national law, and the Agency shall take the necessary measures to ensure the appropriate confidentiality of the details of occurrences received by them pursuant to Articles 4, 5 and 10."}, {"id": "EU_376_2014_ART_15__C0002", "cit": "Article 15(1)", "seq": 2, "text": "Each Member State, each organisation established in a Member State, or the Agency shall process personal data only to the extent necessary for the purposes of this Regulation and without prejudice to national legal acts implementing Directive 95/46/EC."}, {"id": "EU_376_2014_ART_15__C0003", "cit": "Article 15(2)", "seq": 3, "text": "2.Without prejudice to the provisions relating to the protection of safety information in Articles 12, 14 and 15 of Regulation (EU) No 996/2010, information derived from occurrence reports shall be used only for the purpose for which it has been collected."}, {"id": "EU_376_2014_ART_15__C0004", "cit": "Article 15(2)", "seq": 4, "text": "Member States, the Agency and organisations shall not make available or use the information on occurrences:"}, {"id": "EU_376_2014_ART_15__C0005", "cit": "Article 15(2)(a)", "seq": 5, "text": "(a)in order to attribute blame or liability; or"}, {"id": "EU_376_2014_ART_15__C0006", "cit": "Article 15(2)(b)", "seq": 6, "text": "(b)for any purpose other than the maintenance or improvement of aviation safety."}, {"id": "EU_376_2014_ART_15__C0007", "cit": "Article 15(3)", "seq": 7, "text": "3.The Commission, the Agency and the competent authorities of the Member States, when discharging their obligations under Article 14 in relation to the information contained in the European Central Repository, shall:"}, {"id": "EU_376_2014_ART_15__C0008", "cit": "Article 15(3)(a)", "seq": 8, "text": "(a)ensure the confidentiality of the information; and"}, {"id": "EU_376_2014_ART_15__C0009", "cit": "Article 15(3)(b)", "seq": 9, "text": "(b)limit the use of the information to what is strictly necessary in order to discharge their safety-related obligations without attributing blame or liability; in this respect, the information shall be used in particular for risk management and for analysis of safety trends which may lead to safety recommendations or actions, addressing actual or potential safety deficiencies."}, {"id": "EU_376_2014_ART_15__C0010", "cit": "Article 15(4)", "seq": 10, "text": "4.Member States shall ensure that their competent authorities referred to in Article 6(3) and their competent authorities for the administration of justice cooperate with each other through advance administrative arrangements. These advance administrative arrangements shall seek to ensure the correct balance between the need for proper administration of justice, on the one hand, and the necessary "}]}, {"qa_id": "QA_0058", "reason": "stratified_unchanged_ARTICLE_development", "cls": "ARTICLE", "qtype": "obligation", "diff": "easy", "split": "development", "audit": "ai_provisional_supported", "question": "What must the Commission do after adopting a delegated act?", "answer": "As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European Parliament and to the Council. This notification is a requirement following the adoption of the act.", "citation": "Article 18(4)", "parent_id": "EU_376_2014_ART_18", "gold": ["EU_376_2014_ART_18__C0004"], "evidence": "EU_376_2014_ART_18__C0004 [Article 18(4)]: 4.As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European Parliament and to the Council.", "ai_notes": "AI-assisted evidence proposal; independent human review pending.", "n": 3, "va": 3, "vc": 0, "ve": 0, "agg_q1": "yes", "agg_q2": "yes", "agg_q3": "yes", "agg_q4": "yes", "contested": "no", "auto": "accept", "action": "", "comments": "", "siblings": [{"id": "EU_376_2014_ART_18__C0001", "cit": "Article 18(1)", "seq": 1, "text": "1.The power to adopt delegated acts is conferred on the Commission subject to the conditions laid down
